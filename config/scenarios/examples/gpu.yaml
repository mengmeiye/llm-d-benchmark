# GPU Example Scenario for LLM-D Deployment
#
# This scenario deploys a model on GPU-accelerated nodes with vLLM. Switching
# engines is a matter of rewriting one string, `decode.engine.command` -- the
# image, health path and metrics path all follow the launcher named in it.
# examples/engines.yaml is a smaller stack that carries all three engines at once,
# the SGLang and TensorRT-LLM commands commented out beneath the vLLM one; read it
# to see the whole difference one engine makes.
#
# This particular file is the exception to "only the command changes", because
# the routing it demonstrates is vLLM-specific: the EPP's `token-producer`
# plugin counts prompt tokens by calling vLLM's /render endpoints, served by the
# `vllm-render` sidecar that `router.tokenizer.enabled: true` adds. Neither
# SGLang nor TRT-LLM exposes that endpoint. To serve this stack with another
# engine, drop `router.tokenizer` and the `router.epp` block below (and
# `decode.contextLengthRanges`, which only that plugin reads) -- then the command
# really is the only difference left.
#
# IMPORTANT NOTE:
# All parameters not defined here will use the default values from defaults.yaml.
# Many commonly defined values were left blank (default) so that this scenario
# is applicable to as many environments as possible.
#
# The model parameter and affinity are left commented -- uncomment the model and
# GPU affinity appropriate for your cluster.
scenario:
  # ============================================================================
  # GPU Example - Standard GPU deployment
  # ============================================================================
  - name: "gpu-example"

    # =========================================================================
    # COMMON -- Applies to all deployment methods
    # =========================================================================
    common:
      # -------------------------------------------------------------------------
      # Affinity / Node Selection
      # By default, affinity is disabled and pods schedule on any available node.
      # Options:
      #   1. Leave commented out -- no node selection constraint
      #   2. Set nodeSelector to "auto" -- auto-detects GPU labels from the cluster
      #   3. Set explicit labels -- pods only schedule on matching nodes
      # -------------------------------------------------------------------------
      # affinity:
      #   enabled: true
      #   nodeSelector:
      #     nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3      # OpenShift
      #     # gpu.nvidia.com/model: H200                        # Kubernetes
      #     # cloud.google.com/gke-accelerator: nvidia-h100-80gb  # GKE

      # Enable multinode (LeaderWorkerSet) for sequential pod naming.
      # Required when using contextLengthRanges or per-replica env vars
      # (`,,`-delimited values in extraEnvVars) -- both need a pod's index.
      # See config/README.md "Context-Length-Aware Routing" section for full setup guide.
      multinode:
        enabled: false

      # -------------------------------------------------------------------------
      # Model Configuration
      # -------------------------------------------------------------------------
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: facebook-opt-125m

      # -------------------------------------------------------------------------
      # PVC Configuration
      # -------------------------------------------------------------------------
      # Uncomment to override storage class:
      # storage:
      #   workloadPvc:
      #     storageClassName: standard-rwx       # GKE
      #   modelPvc:
      #     storageClassName: standard-rwx       # GKE
      #     # storageClassName: shared-vast       # Kubernetes
      #     # storageClassName: ocs-storagecluster-cephfs  # OpenShift
      #     size: 1Ti

      # -------------------------------------------------------------------------
      # Engine Configuration -- shared by every role and deployment method
      # -------------------------------------------------------------------------
      # Everything here is infrastructure the POD needs, not a parameter the
      # engine process takes: which shell wraps the command, what runs before
      # it, what gets mounted. Engine parameters are stated once, in the launch
      # command each role carries verbatim (see `decode.engine.command` below).
      # That is why there is no list of flags to keep in step with a new
      # vLLM/SGLang release -- llm-d-benchmark never assembles the command line.
      # -------------------------------------------------------------------------
      engine:
        # Shell used to exec a role's engine command. Defaults to /bin/bash.
        # shell: /bin/sh

        # Runs before the engine, in the same shell. Required for
        # context-length-aware routing: it splits ,,-delimited env vars by pod
        # index and self-labels pods through the Kubernetes API.
        preprocessScript: "python3 /setup/preprocess/set_llmdbench_environment.py && source $HOME/llmdbench_env.sh"

        # Volumes required for preprocess script and kubeconfig (pod self-labeling).
        volumes:
          - name: preprocesses
            type: configMap
            configMap:
              name: llm-d-benchmark-preprocesses
              defaultMode: 493  # 0755
          - name: k8s-llmdbench-context
            type: secret
            secret:
              secretName: llmdbench-context

        volumeMounts:
          - name: preprocesses
            mountPath: /setup/preprocess
          - name: k8s-llmdbench-context
            mountPath: /etc/kubeconfig
            readOnly: true

    # =========================================================================
    # STANDALONE -- Only applies when standalone.enabled: true
    # Note: standalone runs its own launch command (`standalone.engine.command`,
    # defaulted in defaults.yaml) and binds engine.servicePort directly -- no
    # routing sidecar exists on this path. Because each role states its own
    # command, a flag one image accepts and another does not (upstream vLLM v0.9+
    # dropped --no-enable-log-requests, for instance) stays confined to the role
    # whose image accepts it.
    # =========================================================================
    standalone:
      enabled: false
      replicas: 1
      resources:
        limits:
          memory: 40Gi
          cpu: "4"
        requests:
          memory: 40Gi
          cpu: "4"

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      # =========================================================================
      # GATEWAY -- toggle the router topology
      # -------------------------------------------------------------------------
      # `epponly` is the llm-d "Standalone Mode" router topology
      # (see https://github.com/llm-d/llm-d/blob/main/guides/recipes/router/README.md):
      # no Kubernetes Gateway is installed, the router Helm chart is swapped
      # from `llm-d-router-gateway-dev` to `llm-d-router-standalone-dev`,
      # and the EPP pod runs an Envoy sidecar that serves HTTP directly on
      # the `{model_id_label}-router-epp`
      # Service (port 80 -> 8081). HTTPRoute and `llm-d-infra` are not
      # rendered, no gateway-provider control plane is installed.
      #
      # Flip this to any of the gateway-backed options to switch topology
      # without changing anything else in the scenario:
      #   epponly                     -- no Gateway (default here)
      #   istio                       -- istio-base + istiod + Gateway + HTTPRoute
      #   agentgateway                -- agentgateway controller + Gateway + HTTPRoute
      #   gke                         -- GKE-managed Gateway + HTTPRoute
      #   data-science-gateway-class  -- OpenDataHub managed Gateway + HTTPRoute
      #
      # This setting is ignored when `kustomize.enabled: true` (or when
      # `-t kustomize` is passed) -- in that mode the upstream llm-d guide
      # manifests are applied verbatim and define their own router topology.
      # =========================================================================
      gateway:
        className: epponly

      # =========================================================================
      # INFERENCE EXTENSION (EPP) -- Context-length-aware routing
      # Uncomment this section along with multinode, contextLengthRanges,
      # preprocessScript, volumes/volumeMounts, and optionally the per-replica
      # extraEnvVars below to enable context-length-aware routing.
      # See config/README.md "Context-Length-Aware Routing" section for full setup guide.
      #
      # `router.tokenizer.enabled: true` adds the chart's `vllm-render` sidecar
      # to the EPP pod, which serves vLLM's /render endpoints over loopback HTTP
      # on `router.tokenizer.port` (default 8000). The token-producer below must
      # point at that port. Do NOT use `udsTokenizerConfig` here -- the UDS
      # tokenizer sidecar was removed when the deployment moved to the
      # llm-d-router chart, and the socket it expects is never created.
      # =========================================================================
      router:
        tokenizer:
          enabled: true
        epp:
          pluginsConfigFile: "context-length-aware-config.yaml"
          flags:
            v: "4"  # use v: "4" for debugging, v: "1" or "2" for benchmarking
          pluginsCustomConfig:
            context-length-aware-config.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
                - type: token-producer
                  parameters:
                    modelName: "facebook/opt-125m"
                    vllm:
                      url: http://localhost:8000
                - type: decode-filter
                - type: context-length-aware
                  parameters:
                    label: llm-d.ai/context-length-range
                    enableFiltering: true
                - type: max-score-picker
                - type: single-profile-handler
              schedulingProfiles:
                - name: default
                  plugins:
                    - pluginRef: token-producer
                    - pluginRef: decode-filter
                    - pluginRef: context-length-aware
                    - pluginRef: max-score-picker

      # -------------------------------------------------------------------------
      # Prefill Configuration
      # -------------------------------------------------------------------------
      prefill:
        enabled: true
        # replicas: 1  # default

      # -------------------------------------------------------------------------
      # Decode Configuration
      # -------------------------------------------------------------------------
      decode:
        replicas: 2

        # Context-length-aware routing: per-pod labels (one per replica).
        # Requires multinode enabled (for LWS sequential pod naming) and
        # kubeconfig secret mounted (see engine.volumes above).
        # Also requires the preprocess script (engine.preprocessScript) for
        # pod self-labeling and ,,-delimited env var splitting.
        # See config/README.md "Context-Length-Aware Routing" section for full setup guide.

        contextLengthRanges:
          - "0-1000"
          - "1000-2048"

        # Per-replica values. A `,,`-delimited value means "one entry per pod":
        # the preprocess script picks the entry at this pod's index and
        # re-exports the variable holding just that value, so the single command
        # below stands up two differently-sized replicas. The variable name is
        # this scenario's own -- nothing in llm-d-benchmark knows it, it matches
        # only because the command references it.
        extraEnvVars:
          - name: MAX_NUM_SEQS
            value: "64,,16"

        # -----------------------------------------------------------------------
        # The launch command, verbatim -- the same line you would run by hand,
        # or the one already in your llm-d guide. It is rendered into the
        # container unchanged, so every flag here is read by vLLM and none of
        # them by llm-d-benchmark. Only a few facts are read back out of it:
        # `--port` (container port, probes, the routing sidecar's upstream) and
        # `--max-model-len` (the pre-deploy capacity check and the harness
        # profile). How many accelerators a pod holds is a Kubernetes fact, so it
        # is stated as `parallelism.tensor`, not read from here.
        #
        # 8200, not 8000: the routing sidecar the chart injects on decode pods
        # owns `engine.servicePort` (8000) and forwards here. In direct mode
        # (`gateway.className: none`) there is no sidecar -- bind 8000 then.
        #
        # `engine.preprocessScript` above runs first, in this same shell, so
        # $MAX_NUM_SEQS is already narrowed to this pod's entry. The model is the
        # plain Hugging Face id: the weights are staged onto the model PVC as a
        # Hugging Face hub cache and the pod's HF_HUB_CACHE points at it, so the
        # id resolves locally rather than over the network.
        # -----------------------------------------------------------------------
        engine:
          command: |
            vllm serve facebook/opt-125m \
            --port 8200 \
            --max-model-len 2048 \
            --tensor-parallel-size 1 \
            --max-num-seqs $MAX_NUM_SEQS \
            --disable-uvicorn-access-log \
            --no-enable-prefix-caching

    # =========================================================================
    # WORKLOAD / HARNESS -- Benchmark execution configuration
    # =========================================================================
    # -------------------------------------------------------------------------
    # Workload/Harness Configuration
    # -------------------------------------------------------------------------
    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml

    # -------------------------------------------------------------------------
    # Used as workspace when --workspace is not specified on the CLI.
    workDir: "~/data/gpu"

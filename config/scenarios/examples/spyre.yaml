# IBM Spyre Accelerator Example Scenario for LLM-D Deployment
#
# This scenario deploys a model on IBM Spyre accelerator hardware.
# Uses the AIU vLLM image with Spyre-specific configuration including
# precompiled model PVC, custom environment variables, and Spyre scheduler.
#
# IMPORTANT NOTE:
# All parameters not defined here will use the default values from defaults.yaml.

scenario:
  # ============================================================================
  # Spyre Example - IBM Spyre accelerator deployment
  # ============================================================================
  - name: "spyre-example"

    # =========================================================================
    # COMMON -- Applies to all deployment methods
    # =========================================================================
    common:
      # -------------------------------------------------------------------------
      # Accelerator Configuration -- IBM Spyre VF
      # -------------------------------------------------------------------------
      accelerator:
        # Custom accelerator type for IBM Spyre.
        # Setting type to 'spyre' tells the helm chart to use ibm.com/spyre_vf
        # instead of the default nvidia.com/gpu. The template auto-generates
        # the chart's accelerator.resources map from type + resource.
        type: spyre
        resource: ibm.com/spyre_pf

      # Spyre uses affinity-based scheduling, not GPU label selection
      acceleratorType:
        labelKey: ibm.com/spyre.product
        labelValue: IBM_Spyre

      # -------------------------------------------------------------------------
      # Affinity / Node Selection
      # By default, affinity is disabled and pods schedule on any available node.
      # Options:
      #   1. Leave commented out -- no node selection constraint
      #   2. Set nodeSelector to "auto" -- auto-detects GPU labels from the cluster
      #   3. Set explicit labels -- pods only schedule on matching nodes
      # This scenario targets IBM Spyre accelerator nodes.
      # -------------------------------------------------------------------------
      affinity:
        enabled: true
        nodeSelector:
          ibm.com/spyre.product: IBM_Spyre

      # Enable multinode (LeaderWorkerSet) for sequential pod naming.
      # Required when using contextLengthRanges, and by any per-replica
      # `,,`-joined env var a role's engine command reads.
      # See config/README.md "Context-Length-Aware Routing" section for full setup guide.
      multinode:
        enabled: true

      # -------------------------------------------------------------------------
      # Spyre cluster requires spyre-scheduler via admission webhook
      # Corresponds to: schedulerName in the Helm chart values
      schedulerName: spyre-scheduler

      # -------------------------------------------------------------------------
      # Model Configuration
      # -------------------------------------------------------------------------
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id itself is stated once, in the launch command below; a
        # short name is a choice, so it stays here. To serve a different model
        # -- `ibm-ai-platform/micro-g3.3-8b-instruct-1b`, say -- change the
        # command and this prefix, nothing else.
        shortName: granite-3-3-8b-instruct

      # -------------------------------------------------------------------------
      # Extra PVC for precompiled Spyre models
      # -------------------------------------------------------------------------
      storage:
        # Uncomment to override storage class:
        # workloadPvc:
        #   storageClassName: standard-rwx       # GKE
        # modelPvc:
        #   storageClassName: standard-rwx       # GKE
        #   # storageClassName: shared-vast       # Kubernetes
        #   # storageClassName: ocs-storagecluster-cephfs  # OpenShift
        #   size: 1Ti
        extraPvc:
          name: spyre-precompiled-model

      images:
        vllm:
          repository: registry.redhat.io/rhaii-early-access/vllm-spyre-rhel9
          tag: 3.4.0-ea.2
          # Early-access registry: pull once per node rather than on every pod
          # start. This needs a pull secret, and `Always` turns a transient
          # registry failure into a CrashLoop on a pod whose image is already
          # local.
          pullPolicy: IfNotPresent

      # -------------------------------------------------------------------------
      # Engine Configuration
      # The pod shape shared by every role: the shell the launch line is exec'd
      # in, shared memory, the preprocess step that runs ahead of it, volumes
      # and mounts. No engine flags live here -- each role writes its own launch
      # line in `<role>.engine.command`, in the engine's own spelling, and that
      # line reaches the container verbatim. llm-d-benchmark reads it only for
      # the facts it cannot do without (the `--port` for the Service and the
      # probes, the capacity numbers for the pre-deploy check).
      #
      # Tool calling is switched on in both commands below
      # (`--enable-auto-tool-choice --tool-call-parser granite`). Prefix caching
      # is deliberately absent: this engine has not been run with it, so adding
      # `--enable-prefix-caching` is a change in behaviour to measure, not a
      # default to assume. Add it to a command if you want it.
      engine:
        # Both roles launch through the image's own wrapper script
        # (`/opt/app-root/spyre_entrypoint.sh`), which execs vLLM after setting
        # up the Spyre runtime. A wrapper is not a launcher llm-d-benchmark can
        # recognise, so the engine is declared here instead: that is what makes
        # the flags in both commands readable in vLLM's spelling (and picks the
        # health and metrics paths). The image itself is pinned below, so the
        # declaration never selects one.
        name: vllm

        # Shell the launch line is exec'd in. Defaults to /bin/bash.
        # shell: /bin/sh

        shmMemory: 64Gi

        preprocessScript: "python3 /setup/preprocess/set_llmdbench_environment.py && source $HOME/llmdbench_env.sh"

        # Spyre-specific volumes
        volumes:
          - name: spyre-precompiled-model
            type: persistentVolumeClaim
            persistentVolumeClaim:
              claimName: spyre-precompiled-model
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
          - name: preprocesses
            type: configMap
            configMap:
              name: llm-d-benchmark-preprocesses
              defaultMode: 493  # 0755
          - name: k8s-llmdbench-context
            type: secret
            secret:
              secretName: llmdbench-context

        volumeMounts:
          - name: spyre-precompiled-model
            mountPath: /mnt/spyre-precompiled-model
          - name: dshm
            mountPath: /dev/shm
          - name: preprocesses
            mountPath: /setup/preprocess
          - name: k8s-llmdbench-context
            mountPath: /etc/kubeconfig
            readOnly: true

    # -------------------------------------------------------------------------
    # Shared role configuration
    # Stated once for every role in this stack, so the live role and the
    # alternatives below it cannot drift apart. A key a role names for itself
    # wins over the value here.
    # -------------------------------------------------------------------------
    roleDefaults:
      resources:
        limits:
          memory: 200Gi
          cpu: "20"
        requests:
          memory: 200Gi
          cpu: "20"

      extraEnvVars:
        - name: FLEX_COMPUTE
          value: SENTIENT
        - name: FLEX_DEVICE
          value: PF
        - name: VLLM_SPYRE_PERF_METRIC_LOGGING_ENABLED
          value: "1"
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: TORCH_SENDNN_CACHE_ENABLE
          value: "1"
        - name: TORCH_SENDNN_CACHE_DIR
          value: /mnt/spyre-precompiled-model
        - name: VLLM_SPYRE_DYNAMO_BACKEND
          value: sendnn
        - name: VLLM_SPYRE_USE_CB
          value: "1"
        - name: VLLM_SPYRE_USE_CHUNKED_PREFILL
          value: "1"

    # =========================================================================
    # STANDALONE -- Only applies when standalone.enabled: true
    # =========================================================================
    standalone:
      enabled: false
      replicas: 2

      # No engine.command: `-t standalone` inherits decode's line below. The
      # copy that used to live here differed from it only in `--port` and in the
      # order of two flags, and the port needs no rewriting -- the Service
      # targets whatever the command binds.
      #
      # `parallelism.tensor` is the same width in Kubernetes' vocabulary: the
      # kubelet grants the four devices before the engine exists, so the count
      # cannot come from the command -- it is stated, and has to agree with the
      # `--tensor-parallel-size 4` in the command it inherits.
      parallelism:
        tensor: 4

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, routing, and GAIE.
    # =========================================================================
    modelservice:
      enabled: true

      # =========================================================================
      # INFERENCE EXTENSION (EPP) -- Context-length-aware routing
      # Uncomment this section along with multinode, contextLengthRanges, and
      # contextLengthRanges above to enable context-length-aware routing.
      # See config/README.md "Context-Length-Aware Routing" section for full setup guide.
      #
      # `router.tokenizer.enabled: true` adds the chart's `vllm-render` sidecar
      # to the EPP pod, which serves vLLM's /render endpoints over loopback HTTP
      # on `router.tokenizer.port` (default 8000). The token-producer below must
      # point at that port. Do NOT use `udsTokenizerConfig` here -- the UDS
      # tokenizer sidecar was removed when the deployment moved to the
      # llm-d-router chart, and the socket it expects is never created.
      # =========================================================================
      router:
        tokenizer:
          enabled: true
        epp:
          pluginsConfigFile: "context-length-aware-config.yaml"
          flags:
            v: "1"  # use v: "4" for debugging, v: "1" or "2" for benchmarking
          pluginsCustomConfig:
            context-length-aware-config.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
                - type: token-producer
                  parameters:
                    modelName: "ibm-granite/granite-3.3-8b-instruct"
                    vllm:
                      url: http://localhost:8000
                - type: decode-filter
                - type: context-length-aware
                  parameters:
                    label: llm-d.ai/context-length-range
                    enableFiltering: true
                - type: max-score-picker
                - type: single-profile-handler
              schedulingProfiles:
                - name: default
                  plugins:
                    - pluginRef: token-producer
                    - pluginRef: decode-filter
                    - pluginRef: context-length-aware
                    - pluginRef: max-score-picker

      # -------------------------------------------------------------------------
      # Prefill Configuration -- disabled (0 prefill pods)
      # -------------------------------------------------------------------------
      prefill:
        enabled: false
        replicas: 0

      # -------------------------------------------------------------------------
      # Decode Configuration -- 2 decode pods on Spyre
      # -------------------------------------------------------------------------
      decode:
        replicas: 2

        # Context-length-aware routing: per-pod labels (one per replica).
        # Requires multinode enabled (for LWS sequential pod naming) and
        # kubeconfig secret mounted (see engine.volumes below).
        # Also requires the preprocess script (engine.preprocessScript) for
        # pod self-labeling and ,,-delimited env var splitting.
        # See config/README.md "Context-Length-Aware Routing" section for full setup guide.
        contextLengthRanges:
          - "0-8000"
          - "8000-32768"

        # Both replicas ran the same context length and batch width, so the two
        # numbers are simply written into the command below. To give replicas
        # different values, put a `,,`-joined list in `extraEnvVars` and read it
        # from the command -- `set_llmdbench_environment.py` splits the list at
        # container start and re-exports the entry for this pod's LWS index:
        #
        #   extraEnvVars:
        #     - name: MY_MAX_LEN
        #       value: "8000,,32768"
        #   engine:
        #     command: |
        #       ... --max-model-len $MY_MAX_LEN

        # Devices per replica -- a Kubernetes fact, not a reading of the
        # command. The kubelet grants accelerators before the engine process
        # exists, so the count is stated here in Kubernetes' vocabulary and the
        # chart turns it into the pod's device request. It has to agree with the
        # width the command gives the engine (`--tensor-parallel-size 4` below),
        # or the engine starves at startup. To request a count the parallelism
        # widths do not describe, set `resources.limits.<accelerator resource>`.
        parallelism:
          tensor: 4
          data: 1
          dataLocal: 1
          workers: 1

        # The launch line, verbatim -- see the standalone block above for why
        # this image takes the model via --model rather than positionally.
        #
        # --port 8200: the routing sidecar owns the Service port (8000) on a
        # decode pod and forwards here. `--tensor-parallel-size 4` tells the
        # engine its width; `parallelism.tensor` above tells Kubernetes, and the
        # two have to agree.
        engine:
          command: |
            /opt/app-root/spyre_entrypoint.sh --model ibm-granite/granite-3.3-8b-instruct \
            --port 8200 \
            --max-model-len 32768 \
            --tensor-parallel-size 4 \
            --max-num-seqs 32 \
            --enable-auto-tool-choice \
            --tool-call-parser granite \
            --max-num-batched-tokens 1024

    # =========================================================================
    # WORKLOAD / HARNESS -- Benchmark execution configuration
    # =========================================================================
    harness:
      name: vllm-benchmark
      experimentProfile: fixed_dataset.yaml.in
      waitTimeout: 36000

    # Used as workspace when --workspace is not specified on the CLI.
    workDir: "~/data/spyre"
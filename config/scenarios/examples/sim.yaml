# Sim Example Scenario for LLM-D Deployment
#
# A scenario to capture running inference-sim on a resource limited
# Kind/OpenShift cluster without requiring GPUs.
#
# IMPORTANT NOTE:
# All parameters not defined here will use the default values from defaults.yaml.

scenario:
  # ============================================================================
  # Sim - Resource-limited simulated inference (no GPUs)
  # ============================================================================
  - name: "sim"

    # =========================================================================
    # COMMON -- Applies to all deployment methods
    # =========================================================================
    common:
      # -------------------------------------------------------------------------
      # Accelerator Configuration -- no GPUs
      # -------------------------------------------------------------------------
      accelerator:
        count: 0
        # To pass capacity planner sanity checking
        memory: 24

      # No GPU on simulation scenarios -- override the nvidia default from
      # defaults.yaml so the standalone template's nodeAffinity block targets
      # an OS label that actually exists on cluster nodes instead of
      # nvidia.com/gpu.product.
      acceleratorType:
        labelKey: kubernetes.io/os
        labelValue: linux

      # -------------------------------------------------------------------------
      # Affinity / Node Selection
      # By default, affinity is disabled and pods schedule on any available node.
      # Options:
      #   1. Leave commented out -- no node selection constraint
      #   2. Set nodeSelector to "auto" -- auto-detects GPU labels from the cluster
      #   3. Set explicit labels -- pods only schedule on matching nodes
      # This scenario targets CPU-only nodes (no GPU required).
      # -------------------------------------------------------------------------
      affinity:
        enabled: true
        nodeSelector:
          kubernetes.io/os: linux

      # -------------------------------------------------------------------------
      # Model Configuration
      # -------------------------------------------------------------------------
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: facebook-opt-125m
        gpuMemoryUtilization: 0
        maxModelLen: 1024
        size: 2Gi

      storage:
        # Uncomment to override storage class:
        # workloadPvc:
        #   storageClassName: standard-rwx       # GKE
        modelPvc:
          # storageClassName: standard-rwx       # GKE
          # storageClassName: shared-vast       # Kubernetes
          # storageClassName: ocs-storagecluster-cephfs  # OpenShift
          size: 2Gi
          accessMode:
            - ReadWriteOnce

      images:
        vllm:
          repository: ghcr.io/llm-d/llm-d-inference-sim
          tag: v0.10.2

      engine:
        shmMemory: 500Mi
        volumes:
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 500Mi
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm

      monitoring:
        installPrometheusCrds: true

      control:
        waitTimeout: 900

    # -------------------------------------------------------------------------
    # Shared role configuration
    # Every role in this scenario runs the same sim container with the same
    # footprint, so the shape is stated once. Each role below carries only what
    # it does differently -- how its container is launched. A key a role names
    # for itself wins over the value here.
    # -------------------------------------------------------------------------
    roleDefaults:
      replicas: 1

      resources:
        limits:
          memory: 100Mi
          cpu: "0"
        requests:
          memory: 100Mi
          cpu: "0"

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1

    # =========================================================================
    # STANDALONE -- Only applies when standalone.enabled: true
    # =========================================================================
    standalone:
      enabled: false

      # llm-d-inference-sim is not an inference engine and takes no `vllm
      # serve` line: its image entrypoint is the launcher, so this role passes
      # an argument list instead of a command. `command: ""` is what selects
      # that -- it drops the inherited default command (a missing key would
      # retain it) and emits `args:` without a `command:` override. That matters
      # for v0.9+ images: they are distroless and have no shell to exec.
      engine:
        command: ""
        args:
          - "--model"
          - "facebook/opt-125m"
          - "--port"
          - "8000"
          # Same image, same startup dependency on a render service the pod does
          # not run -- see the decode role below for what this flag does.
          - "--force-dummy-tokenizer"

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      # Where the weights come from. `hf` means no model PVC and no download
      # Job: the modelservice chart hands the engine an `hf://` artifact and
      # injects its own HF_HOME. llm-d-inference-sim loads no weights at all,
      # so staging a copy of opt-125m onto a PVC would only slow standup down
      # on the small clusters this scenario targets.
      #
      # This key is read at `modelservice.uriProtocol`; under `storage:` it
      # parses fine and nothing reads it.
      #
      # It does not govern the standalone role below -- enabling standalone
      # with `mountModelVolume` (the default) stages the weights regardless,
      # which is why that role's `--model` may name a /model-cache path.
      uriProtocol: hf

      # =========================================================================
      # GATEWAY -- toggle the router topology
      # -------------------------------------------------------------------------
      # `epponly` is the llm-d "Standalone Mode" router topology
      # (see https://github.com/llm-d/llm-d/blob/main/guides/recipes/router/README.md):
      # no Kubernetes Gateway is installed, the router Helm chart is swapped
      # from `llm-d-router-gateway-dev` to `llm-d-router-standalone-dev`,
      # and the EPP pod runs an Envoy sidecar that serves HTTP directly on
      # the `{model_id_label}-router-epp`
      # Service (port 80 -> 8081). HTTPRoute and `llm-d-infra` are not
      # rendered, no gateway-provider control plane is installed.
      #
      # Flip this to any of the gateway-backed options to switch topology
      # without changing anything else in the scenario:
      #   epponly                     -- no Gateway (default here)
      #   istio                       -- istio-base + istiod + Gateway + HTTPRoute
      #   agentgateway                -- agentgateway controller + Gateway + HTTPRoute
      #   gke                         -- GKE-managed Gateway + HTTPRoute
      #   data-science-gateway-class  -- OpenDataHub managed Gateway + HTTPRoute
      #
      # This setting is ignored when `kustomize.enabled: true` (or when
      # `-t kustomize` is passed) -- in that mode the upstream llm-d guide
      # manifests are applied verbatim and define their own router topology.
      # =========================================================================
      gateway:
        className: epponly
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi

      # -------------------------------------------------------------------------
      # Routing Configuration
      # Sim scenarios do not use the routing proxy sidecar
      # -------------------------------------------------------------------------
      routing:
        proxy:
          enabled: false

      # -------------------------------------------------------------------------
      # Routing / GAIE Configuration
      # -------------------------------------------------------------------------
      router:
        monitoring:
          prometheus:
            enabled: false
      prefill:
        enabled: true

        # The sim image launches itself -- see `standalone.engine` above. The
        # entrypoint's own default port is 8000, which is what a prefill pod
        # binds (it never gets a routing sidecar), so the port here only
        # restates that.
        engine:
          command: ""
          # The sim images from v0.9 through v0.10 tokenize through a
          # separate render service while building their response dataset
          # (`--render-url`, default http://localhost:8082) and exit at startup
          # when nothing answers there -- a CrashLoopBackOff with no pod of that
          # service anywhere in this stack. `--force-dummy-tokenizer` asks for
          # the simulated tokenizer instead, which is all a sim needs: it has no
          # weights and this scenario does not route on prefix-cache hits.
          # v0.11 falls back to it on its own, so the flag can go when the
          # `images.vllm` tag above moves past v0.10.
          #
          # Only the flag: the modelservice chart appends this list to the
          # `--model/--port/--served-model-name` it derives for a sim image, so
          # restating those would pass each of them twice.
          args:
            - "--force-dummy-tokenizer"

      # -------------------------------------------------------------------------
      # Decode Configuration
      # The sim image launches itself, so this role states no command and no
      # args. Nothing is auto-generated from `model.*` on its behalf: a role
      # that wants flags states them, in the engine's own spelling, in
      # `engine.command` (or here, in `engine.args`).
      # -------------------------------------------------------------------------
      decode:
        # `routing.proxy.enabled: false` above means no sidecar holds the
        # Service port in front of decode, so the sim entrypoint's own port
        # 8000 is the right one.
        engine:
          command: ""
          # The sim images from v0.9 through v0.10 tokenize through a
          # separate render service while building their response dataset
          # (`--render-url`, default http://localhost:8082) and exit at startup
          # when nothing answers there -- a CrashLoopBackOff with no pod of that
          # service anywhere in this stack. `--force-dummy-tokenizer` asks for
          # the simulated tokenizer instead, which is all a sim needs: it has no
          # weights and this scenario does not route on prefix-cache hits.
          # v0.11 falls back to it on its own, so the flag can go when the
          # `images.vllm` tag above moves past v0.10.
          #
          # Only the flag: the modelservice chart appends this list to the
          # `--model/--port/--served-model-name` it derives for a sim image, so
          # restating those would pass each of them twice.
          args:
            - "--force-dummy-tokenizer"

    # =========================================================================
    # WORKLOAD / HARNESS -- Benchmark execution configuration
    # =========================================================================
    # -------------------------------------------------------------------------
    # Harness Configuration
    # -------------------------------------------------------------------------
    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
      pvcSize: 3Gi
      resources:
        cpu: "1"
        memory: 2Gi

    # -------------------------------------------------------------------------
    # Workload Configuration
    # -------------------------------------------------------------------------
    workDir: "~/data/sim"

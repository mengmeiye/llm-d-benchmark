# eval-containers / aider-polyglot example scenario.
#
# Deploys a model on llm-d (the CPU inference-sim base below -- swap for a real
# GPU-served model for meaningful scores) and runs the eval-containers harness:
# the aider-polyglot agentic coding benchmark, one task per parallel pod.
#
#   llmdbenchmark --spec examples/eval-containers-aider-polyglot run -p "$NS" -j <#tasks>
#
# The model deployment below mirrors sim.yaml (CPU, no GPU); only the
# images.benchmark and harness blocks differ. aider-polyglot runs fully offline
# -- the harness pod needs no internet egress.
#
# IMPORTANT NOTE:
# All parameters not defined here use the default values from defaults.yaml.

scenario:
  # ============================================================================
  # Sim - Resource-limited simulated inference (no GPUs)
  # ============================================================================
  - name: "eval-aider-polyglot"

    # =========================================================================
    # COMMON -- Applies to all deployment methods
    # =========================================================================
    common :
      accelerator:
        count: 0
        memory: 24

      acceleratorType:
        labelKey: kubernetes.io/os
        labelValue: linux

      affinity:
        enabled: true
        nodeSelector:
          kubernetes.io/os: linux

      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: facebook-opt-125m
        gpuMemoryUtilization: 0
        maxModelLen: 1024
        size: 2Gi

      storage:
        # Harness results PVC.
        # accessModes and storageClassName are cluster-specific.
        # Set them in your --cluster-config file (see docs/openshift-setup.md).
        # Defaults: RWO + cluster-default storage class (works on kind/vanilla K8s).
        # Multi-node clusters typically need ReadWriteMany and a shared storage class.
        workloadPvc:
          accessModes:
            - ReadWriteOnce
          # storageClassName: ""   # leave empty to use the cluster default
        modelPvc:
          size: 2Gi
          accessMode:
            - ReadWriteOnce

      images:
        vllm:
          repository: ghcr.io/llm-d/llm-d-inference-sim
          tag: latest
        # The harness pod runs THIS image: agent + in-pod gateway + grader + otel,
        # the single-container standalone bundle. Swap for any published
        # evals/<benchmark>--<agent>-standalone image to run a different eval.
        # 2026-08-11 latest: 2-attempt grading (PR #337 + #347, Exgentic/eval-containers).
        benchmark:
          repository: ghcr.io/exgentic/evals/aider-polyglot--claude-code-standalone
          tag: latest
          pullPolicy: Always

      engine:
        shmMemory: 500Mi
        volumes:
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 500Mi
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm

    # -------------------------------------------------------------------------
    # Shared role configuration
    # Every role in this scenario runs the same sim container with the same
    # footprint, so the shape is stated once. Each role below carries only what
    # it does differently -- how its container is launched. A key a role names
    # for itself wins over the value here.
    # -------------------------------------------------------------------------
    roleDefaults:
      replicas: 1

      resources:
        limits:
          memory: 100Mi
          cpu: "0"
        requests:
          memory: 100Mi
          cpu: "0"

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1

    # =========================================================================
    # STANDALONE -- Only applies when standalone.enabled: true
    # =========================================================================

    standalone:
      enabled: false

      # llm-d-inference-sim is not an inference engine and takes no `vllm
      # serve` line: its image entrypoint is the launcher, so this role passes
      # an argument list instead of a command. `command: ""` is what selects
      # that -- it drops the inherited default command (an empty string, since a
      # YAML key with no value would leave the default in place), and
      # modelCommand resolves to `imageDefault`, which emits `args:` and no
      # `command:` (a distroless sim image has no shell to exec one in).
      # ${dotted.path} reads the resolved plan.
      #
      # Port 8000, not 8200: a standalone pod has no routing sidecar in front of
      # it, so it holds the Service port itself.
      engine:
        command: ""
        args:
          - "--model"
          - "facebook/opt-125m"
          - "--port"
          - "8000"

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      # Where the engine gets the weights. `hf` means no model PVC and no
      # download Job -- the engine pulls from Hugging Face at pod start, which
      # is why the launch command below can name the model literally. This key
      # is read at `modelservice.uriProtocol`; under `storage:` it parses fine
      # and nothing reads it.
      uriProtocol: hf

      routing:
        proxy:
          enabled: false

      gateway:
        className: epponly
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi

      inferenceExtension:
        monitoring:
          prometheus:
            enabled: false

      prefill:
        enabled: true

        accelerator:
          count: 0

        acceleratorType:
          labelKey: kubernetes.io/os
          labelValue: linux

        # The sim image launches itself -- see `standalone.engine` above. No
        # args either: the entrypoint's own default port is 8000, which is what
        # a prefill pod binds (it never gets a routing sidecar).
        engine:
          command: ""

      decode:
        accelerator:
          count: 0

        acceleratorType:
          labelKey: kubernetes.io/os
          labelValue: linux

        # `routing.proxy.enabled: false` above means no sidecar holds the
        # Service port in front of decode, so the sim entrypoint's own port
        # 8000 is the right one and there is nothing to pass.
        engine:
          command: ""

    # =========================================================================
    # WORKLOAD / HARNESS -- Benchmark execution configuration
    # =========================================================================
    harness:
      name: eval-containers
      experimentProfile: aider-polyglot.yaml
      # Run our script directly instead of the default load-generator entrypoint
      # (llm-d-benchmark.sh, which is not present in the eval image).
      entrypoint: /workspace/harnesses/eval-containers-llm-d-benchmark.sh
      pvcSize: 5Gi
      # runAsUser and serviceAccount are OpenShift-specific.
      # Set them in your --cluster-config file (see docs/openshift-setup.md).
      # A real agent + in-pod gateway runs here, not a load generator -- give it room.
      extraEnvVars:
        # Per-task agent wall-clock cap (seconds), read by the image's run-agent.
        # The image default of 300 truncates a reasoning model mid-edit. NOTE this
        # is PER ATTEMPT: images with 2-attempt grading re-invoke run-agent on a
        # failed first try, so a task's wall-clock can reach ~2x this value.
        - name: EVAL_TIMEOUT
          value: "1500"
        # If you swap the image above for the gemini-cli variant, ALSO set
        #   - name: EVAL_MODEL_API
        #     value: openai
        # gemini-cli speaks the Gemini v1beta wire
        # (/v1beta/models/<model>:generateContent), which bifrost cannot parse
        # against an OpenAI-only upstream: every call 400s, the agent writes a
        # stub solution, and the run scores ~0 -- looking like a model failure
        # rather than a transport one. Not needed for claude-code (this image).
      resources:
        cpu: "2"
        memory: 6Gi

    # dataAccess.runAsUser and dataAccess.serviceAccount are OpenShift-specific.
    # Set them in your --cluster-config file (see docs/openshift-setup.md).

    workDir: "~/data/eval-aider-polyglot"

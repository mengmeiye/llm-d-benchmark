# ENGINE SWAP example: the same Qwen3-0.6B stack on vLLM, SGLang, or
# TensorRT-LLM. vLLM is active; `--engine` applies the tagged alternatives to a
# copy in the plan directory without modifying this file:
#
#   llmdbenchmark --spec examples/engines standup                  # vLLM
#   llmdbenchmark --spec examples/engines --engine sglang standup
#   llmdbenchmark --spec examples/engines --engine trtllm standup
#
# The launcher selects `images.<engine>` and the matching endpoint defaults.
# SGLang changes only the command. TensorRT-LLM also needs its tagged block
# size, metrics path, and library path because those facts are not command-line
# options. See guides/optimized-baseline.yaml for a larger example.
scenario:
  - name: "engines-example"

    common:
      # Optional GPU node selection:
      # affinity:
      #   enabled: true
      #   nodeSelector:
      #     nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3      # OpenShift
      #     # gpu.nvidia.com/model: H200                        # Kubernetes
      #     # cloud.google.com/gke-accelerator: nvidia-h100-80gb  # GKE

      model:
        # Kubernetes resource prefix; the model id comes from the command.
        shortName: qwen-qwen3-06b
        size: 50Gi
        # TRT-LLM's KV page size is configured in its API-options file, not by
        # a server flag, so the capacity check needs it explicitly.
        # @engine trtllm
        # blockSize: 32

      # TRT-LLM exposes Prometheus metrics at a non-default path.
      # @engine trtllm
      # monitoring:
      #   metricsPath: /prometheus/metrics

      # Pod infrastructure shared by every engine.
      engine:
        shmMemory: 16Gi

        preprocessScript: "python3 /setup/preprocess/set_llmdbench_environment.py && . $HOME/llmdbench_env.sh"

        volumes:
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: preprocesses
            type: configMap
            configMap:
              name: llm-d-benchmark-preprocesses
              defaultMode: 493  # 0755
          - name: k8s-llmdbench-context
            type: secret
            secret:
              secretName: llmdbench-context

        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: preprocesses
            mountPath: /setup/preprocess
          - name: k8s-llmdbench-context
            mountPath: /etc/kubeconfig
            readOnly: true

    # `-t standalone` inherits decode's command and runtime settings.
    standalone:
      enabled: false
      replicas: 1

    modelservice:
      enabled: true

      gateway:
        className: epponly

      # P/D disaggregation needs engine-specific commands on both roles; see
      # guides/pd-disaggregation.yaml.
      prefill:
        enabled: false
        replicas: 0

      decode:
        replicas: 1

        resources:
          limits:
            memory: 64Gi
            cpu: "8"
          requests:
            memory: 32Gi
            cpu: "4"

        # A custom command bypasses the TRT-LLM image entrypoint that normally
        # supplies its library path.
        # @engine trtllm
        # extraEnvVars:
        #   - name: LD_LIBRARY_PATH
        #     value: "/usr/local/tensorrt/lib:/usr/local/cuda/lib64:/usr/local/nvidia/lib64"

        # Verbatim launch line. Decode binds 8200 because its routing sidecar
        # owns Service port 8000. Keep the command's parallel width aligned with
        # decode.parallelism.tensor, which controls the pod's device request.
        engine:
          command: |
            vllm serve Qwen/Qwen3-0.6B \
            --host 0.0.0.0 \
            --port 8200 \
            --tensor-parallel-size 1 \
            --max-model-len 32768 \
            --block-size 64 \
            --gpu-memory-utilization 0.9 \
            --max-num-seqs 256 \
            --max-num-batched-tokens 8192 \
            --dtype bfloat16 \
            --disable-uvicorn-access-log \
            --no-enable-prefix-caching

        # SGLang is a command-only swap; --enable-metrics exposes /metrics.
          # @engine sglang
          # command: |
          #   sglang serve Qwen/Qwen3-0.6B \
          #   --host 0.0.0.0 \
          #   --port 8200 \
          #   --tp-size 1 \
          #   --context-length 32768 \
          #   --page-size 64 \
          #   --mem-fraction-static 0.9 \
          #   --max-running-requests 256 \
          #   --max-prefill-tokens 8192 \
          #   --dtype bfloat16 \
          #   --enable-metrics \
          #   --uvicorn-access-log-exclude-prefixes /metrics /health

        # TRT-LLM writes API options for KV page size and Prometheus metrics.
        # Its other three tagged companion blocks are above.
          # @engine trtllm
          # command: |
          #   mkdir -p /tmp/trtllm ;
          #   printf 'return_perf_metrics: true\nenable_iter_perf_stats: true\nkv_cache_config:\n  tokens_per_block: ${model.blockSize}\n' > /tmp/trtllm/llm_api_options.yaml ;
          #   trtllm-serve serve Qwen/Qwen3-0.6B \
          #   --host 0.0.0.0 \
          #   --port 8200 \
          #   --backend pytorch \
          #   --tp_size 1 \
          #   --max_seq_len 32768 \
          #   --max_batch_size 256 \
          #   --max_num_tokens 8192 \
          #   --free_gpu_memory_fraction 0.9 \
          #   --extra_llm_api_options /tmp/trtllm/llm_api_options.yaml

    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml

    workDir: "~/data/engines"

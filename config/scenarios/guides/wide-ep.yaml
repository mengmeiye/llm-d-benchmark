# WIDE EP/DP WITH LWS WELL LIT PATH
# Based on https://github.com/llm-d/llm-d/tree/main/guides/wide-ep/README.md
#
# Notes:
# - Removed pod monitoring; can be added using decode.extraContainerConfig / prefill.extraContainerConfig
# - Removed extra volumes metrics-volume and torch-compile-volume (not needed for this model/hardware)
# - Use decode.additionalVolumeMounts and decode.additionalVolumes to add them if needed
# - Use prefill.additionalVolumeMounts and prefill.additionalVolumes to add them if needed

scenario:
  # ============================================================================
  # Wide EP/DP with LWS - Qwen3-30B-A3B with multinode support
  # ============================================================================
  - name: "wide-ep"

    common:
      # -------------------------------------------------------------------------
      # Affinity / Node Selection
      # By default, affinity is disabled and pods schedule on any available node.
      # Options:
      #   1. Leave commented out -- no node selection constraint
      #   2. Set nodeSelector to "auto" -- auto-detects GPU labels from the cluster
      #   3. Set explicit labels -- pods only schedule on matching nodes
      # -------------------------------------------------------------------------
      # affinity:
      #   enabled: true
      #   nodeSelector:
      #     nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3      # OpenShift
      #     # gpu.nvidia.com/model: H200                        # Kubernetes
      #     # cloud.google.com/gke-accelerator: nvidia-h100-80gb  # GKE

      # -------------------------------------------------------------------------
      # Multinode Configuration (LeaderWorkerSet)
      # -------------------------------------------------------------------------
      multinode:
        enabled: true

      # -------------------------------------------------------------------------
      # Scheduler Configuration
      # (commented out in original -- uncomment to enable)
      # -------------------------------------------------------------------------
      # schedulerName: custom-binpack-scheduler
      # -------------------------------------------------------------------------
      # Model Configuration
      # The model is named in the launch commands below and nowhere else. To
      # serve a different one, edit the commands and the shortName here; the
      # PVC path, pod labels, HTTPRoute and harness target all follow.
      # Models this guide has been run with: Qwen/Qwen3-30B-A3B, deepseek-ai/DeepSeek-R1-0528.
      # -------------------------------------------------------------------------
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: qwen-qwen3-30b-a3b
        size: 1Ti
        # Unusually, these stay here. A capacity number belongs in the launch
        # command whenever the command states it -- but neither command below
        # passes --max-model-len or --block-size (this guide lets vLLM derive
        # them from the model config), so these are the only record the capacity
        # planner has. gpuMemoryUtilization IS in both commands; it is repeated
        # here for the planner because 0.75 is this guide's own number, not the
        # accelerator profile's.
        maxModelLen: 4000
        blockSize: 64
        gpuMemoryUtilization: 0.75

      # -------------------------------------------------------------------------
      # Storage Configuration
      # -------------------------------------------------------------------------
      storage:
        modelPvc:
          size: 1Ti
          # Uncomment to specify storage class:
          # storageClassName: standard-rwx
          # storageClassName: shared-vast
          # storageClassName: ocs-storagecluster-cephfs

    engine:
      # Sourced before the engine command, in the same shell: the `preprocess`
      # initContainer below writes this file with the network facts only the
      # node can tell us (RDMA/IB device names, GID index) plus the CUDA
      # library path. Engine commands never mention it.
      preprocessScript: ". /shared-config/llmdbench_env.sh"
      # The UCX settings for the NIXL data plane, if this stack ever needs
      # them, are container environment variables and belong in the role's
      # extraEnvVars -- UCX reads them from the environment, not the command:
      #   - name: UCX_TLS
      #     value: "rc,sm,cuda_ipc,cuda_copy,tcp"
      #   - name: UCX_NET_DEVICES
      #     value: "eth0"   # pin KV transfer when secondary NICs are attached
      networkResource: "auto"   # auto-detect from cluster nodes
      networkNr: "1"            # number of network devices

      volumes:
        - name: shared-config
          type: emptyDir
          emptyDir: {}
        - name: dshm
          type: emptyDir
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi

      volumeMounts:
        - name: shared-config
          mountPath: /shared-config
        - name: dshm
          mountPath: /dev/shm

# Attaching a secondary network also gives UCX more interfaces to choose from
# for the NIXL KV-transfer data plane, and it chooses independently of
# VLLM_NIXL_SIDE_CHANNEL_HOST (which is pinned to the pod IP). If a rail cannot
# carry that traffic the handshake fails (NIXL_ERR_REMOTE_DISCONNECT /
# NIXL_ERR_NOT_FOUND) and requests hang instead of erroring, so set
# UCX_NET_DEVICES in the role's extraEnvVars when enabling this -- "eth0" keeps
# KV transfer on the pod network.
# Alternatively, --set 'annotations.prefill.pod."k8s.v1.cni.cncf.io/networks"'=multi-nic-compute,'annotations.decode.pod."k8s.v1.cni.cncf.io/networks"'=multi-nic-compute
    annotations:
      prefill:
        pod:
#            k8s.v1.cni.cncf.io/networks: multi-nic-inference
      decode:
        pod:
#            k8s.v1.cni.cncf.io/networks: multi-nic-inference

    timeouts:
      controlWait: 900000
      harnessWait: 900000

    # =========================================================================
    # KUSTOMIZE DEPLOY METHOD   (scope: the ENTIRE stack)
    # -------------------------------------------------------------------------
    # When kustomize.enabled is true (or `-t kustomize` is passed) this
    # scenario is deployed by applying the UPSTREAM llm-d guide directly
    # (guides/<guideName> in the llm-d repo). In that mode the deployment is
    # defined ENTIRELY by the guide's own manifests:
    #
    #   * EVERYTHING ELSE in this scenario is IGNORED -- model, modelservice,
    #     standalone, decode/prefill, engine, storage, harness model, etc.
    #   * `-m/--models` and all other CLI/scenario tuning are ignored.
    #   * DoE `experiment` SETUP sweeps do NOT alter a kustomize deploy
    #     (only run/workload treatments still apply).
    #
    # The ONLY way to modify a kustomize deployment is the kustomize.* keys
    # below:
    #   patches / overlayPath           -> modelserver (the workload pods)
    #   extraHelmValues / extraHelmSets -> router / GAIE helm release
    #   guideVariableOverrides          -> override the guide README's ${VAR}
    # See docs/kustomize.md for the full reference and worked examples.
    #
    # NOT SUPPORTED with kustomize: multi-model / multi-stack scenarios
    # (the deploy is keyed on guideName with no per-stack uniquification --
    # stacks would collide). Use the modelservice method for multi-model.
    #
    # When kustomize.enabled is false (the DEFAULT) this whole block is
    # inert and the scenario deploys via modelservice/standalone as
    # configured further below.
    # =========================================================================
    kustomize:
      enabled: false

      guideName: "wide-ep"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      acceleratorBackend: "gpu/vllm"
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides: {}   # override/fill the guide README's ${VAR}

      # Inline kustomize strategic merge patches applied on top of the
      # guide's modelserver base. The wide-ep guide ships its decode
      # and prefill resources as `LeaderWorkerSet` (not Deployment) and
      # already injects `HF_TOKEN` from the `llm-d-hf-token` Secret in
      # both base templates -- the standup creates that Secret from the
      # ambient HF_TOKEN env var so no override is needed here.
      #
      # If you DO need to patch this guide, target the LWS resource by
      # its actual name (e.g. `wide-ep-nvidia-gpu-vllm-deepseek-v4-decode`)
      # and use the LWS apiVersion / spec shape:
      #
      #   apiVersion: leaderworkerset.x-k8s.io/v1
      #   kind: LeaderWorkerSet
      #   metadata:
      #     name: wide-ep-nvidia-gpu-vllm-deepseek-v4-decode
      #   spec:
      #     leaderWorkerTemplate:
      #       workerTemplate:
      #         spec:
      #           containers:
      #             - name: vllm
      #               ...
      patches: []

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      gateway:
        className: epponly

      # -------------------------------------------------------------------------
      # Routing Configuration
      # -------------------------------------------------------------------------
      routing:
        connector: nixlv2

      # -------------------------------------------------------------------------
      # Routing / GAIE Configuration
      # Reference: https://github.com/llm-d/llm-d/blob/main/guides/wide-ep/router/wide-ep.values.yaml
      # The plugins block uses the `llm-d.ai/v1alpha1` apiVersion shipped
      # by the llm-d-router-{standalone,gateway}-dev charts.
      # -------------------------------------------------------------------------
      router:
        extraServicePorts:
          - name: http
            port: 80
            protocol: TCP
            targetPort: 8081
        epp:
          replicas: 1
          flags:
            v: 2
          pluginsConfigFile: "wide-ep-config.yaml"
          pluginsCustomConfig:
            wide-ep-config.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: disagg-headers-handler
              - type: always-disagg-pd-decider
              - type: disagg-profile-handler
                parameters:
                  deciderPluginName: always-disagg-pd-decider
              - type: prefill-filter
              - type: decode-filter
              - type: prefix-cache-scorer
              - type: queue-scorer
              - type: active-request-scorer
              schedulingProfiles:
              - name: prefill
                plugins:
                - pluginRef: prefill-filter
                - pluginRef: prefix-cache-scorer
                  weight: 3
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: active-request-scorer
                  weight: 2
              - name: decode
                plugins:
                - pluginRef: decode-filter
                - pluginRef: active-request-scorer
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        proxy:
          # CLI args for the Envoy sidecar. Override the chart's defaults of
          # `--log-level trace` (very expensive under load) and no `--concurrency`
          # (Envoy spawns ~hardware_concurrency() worker threads, oversubscribing
          # the cgroup's CPU slice). `--concurrency 8` matches the resources.limits
          # equivalent below; trace-level logging would burn a meaningful share of
          # the sidecar's CPU at high QPS.
          args:
            - "--service-node"
            - "envoy-sidecar"
            - "--log-level"
            - "warn"
            - "--concurrency"
            - "8"
            - "--drain-strategy"
            - "immediate"
            - "--drain-time-s"
            - "60"
            - "-c"
            - "/etc/envoy/envoy.yaml"
          # Resource requests and limits for the Envoy sidecar.
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        inferencePool:
          failureMode: "FailOpen"
          providerConfig:
            destinationRule:
              trafficPolicy:
                connectionPool:
                  http:
                    http1MaxPendingRequests: 256000
                    maxRequestsPerConnection: 256000
                    http2MaxRequests: 256000
                    idleTimeout: "900s"
                  tcp:
                    maxConnections: 256000
                    maxConnectionDuration: "1800s"
                    connectTimeout: "900s"
        modelServers:
          protocol: http
          # targetPorts must list all 8 DP rank ports so the EPP routes requests
          # to all ranks. Without this, only rank 0 receives traffic.
          targetPorts:
            - number: 8000
            - number: 8001
            - number: 8002
            - number: 8003
            - number: 8004
            - number: 8005
            - number: 8006
            - number: 8007
          matchLabels:
            llm-d.ai/guide: "wide-ep"
        tracing:
          otelExporterEndpoint: "http://localhost:4317"
          sampling:
            sampler: "parentbased_traceidratio"
            samplerArg: "0.1"

      # -------------------------------------------------------------------------
      # HTTPRoute Configuration
      # requestTimeout: end-to-end Gateway-API HTTPRoute timeout the istio
      # gateway enforces per request. Long agentic turns that exceed it are
      # aborted by the gateway with a 502 (surfaces as "connection reset by
      # peer" on the decode routing-proxy loopback hop). Set "0s" to disable.
      # -------------------------------------------------------------------------
      httpRoute:
        requestTimeout: "300s"
        backendRequestTimeout: "0s"

    # -------------------------------------------------------------------------
    # Shared role configuration
    # Prefill and decode are the same pod on this cluster: the same eight
    # devices, the same probes, the same environment, the same capabilities.
    # Stated once here, those cannot drift apart. Each role below carries only
    # what it does differently -- its launch command, and for decode the RDMA
    # device. A key a role names for itself wins over the value here.
    # -------------------------------------------------------------------------
    roleDefaults:
      initContainers:
        - name: preprocess
          imageKey: benchmark
          imagePullPolicy: Always
          command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
          volumeMounts:
            - name: shared-config
              mountPath: /shared-config

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 8
        workers: 2

      # Resource configuration
      resources:
        limits:
          ephemeral-storage: 1Ti
          memory: 512Gi
          cpu: "32"
        requests:
          ephemeral-storage: 1Ti
          memory: 512Gi
          cpu: "32"

      # Startup probe overrides
      probes:
        startup:
          failureThreshold: 2700
          initialDelaySeconds: 240
          periodSeconds: 30
          timeoutSeconds: 5
          path: /v1/models
        liveness:
          failureThreshold: 3
          periodSeconds: 5
        readiness:
          failureThreshold: 3
          periodSeconds: 5
          path: /v1/models

      # -----------------------------------------------------------------------
      # Extra Environment Variables
      # -----------------------------------------------------------------------
      extraEnvVars:
        # NixlConnector publishes this address to its peer as where the KV blocks
        # can be read from, and takes it from the environment rather than the
        # launch line. vLLM defaults it to `localhost`, which no other pod can
        # reach -- the same declaration the llm-d guides make.
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VLLM_SKIP_P2P_CHECK
          value: "1"
        - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
          value: "1"
        - name: VLLM_USE_DEEP_GEMM
          value: "1"
        - name: NVIDIA_GDRCOPY
          value: "enabled"
        - name: NCCL_EXCLUDE_IB_HCA
          value: ""
        - name: NVSHMEM_DEBUG
          value: "INFO"
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: NCCL_DEBUG
          value: "INFO"
        - name: NCCL_DEBUG_SUBSYS
          value: "INIT,NET"
        - name: NCCL_DEBUG_FILE
          value: "/tmp/nccl.%h.%p.log"

      # -----------------------------------------------------------------------
      # Extra Container Configuration
      # -----------------------------------------------------------------------
      extraContainerConfig:
        securityContext:
          capabilities:
            add:
              - "IPC_LOCK"
              - "SYS_RAWIO"
              - "NET_ADMIN"
              - "NET_RAW"
          runAsGroup: 0
          runAsUser: 0
        imagePullPolicy: Always

      # -----------------------------------------------------------------------
      # Additional Volume Mounts
      # -----------------------------------------------------------------------
      additionalVolumeMounts: []

      # -----------------------------------------------------------------------
      # Additional Volumes
      # -----------------------------------------------------------------------
      additionalVolumes: []

    # -------------------------------------------------------------------------
    # Prefill Configuration
    # -------------------------------------------------------------------------
    prefill:
      enabled: true
      replicas: 1
#      replicas: 8
      # The launch command, verbatim -- the same line you would run by hand.
      # It reaches the container unchanged, so every flag here is read by vLLM
      # and none of them by llm-d-benchmark, which reads only what decides
      # Kubernetes objects: `--port` and the two capacity numbers. The eight
      # devices one replica holds are stated above as
      # `roleDefaults.parallelism.dataLocal`, not read from
      # `--data-parallel-size-local`: the kubelet grants them before the engine
      # process exists.
      #
      # Prefill binds 8000, the Service port: no routing sidecar is injected on
      # prefill pods, so nothing would bridge a higher port.
      #
      # $LWS_GROUP_SIZE and $LWS_LEADER_ADDRESS come from LeaderWorkerSet at pod
      # runtime, which is why the total DP size stays a shell expression -- the
      # leader address is not knowable at render time. The local width is
      # written out, because it has to agree with `roleDefaults.parallelism`.
      engine:
        command: |
          vllm serve Qwen/Qwen3-30B-A3B \
          --host 0.0.0.0 \
          --port 8000 \
          --trust-remote-code \
          --gpu-memory-utilization 0.75 \
          --disable-access-log-for-endpoints=/health,/metrics \
          --data-parallel-hybrid-lb \
          --enable-expert-parallel \
          --tensor-parallel-size 1 \
          --max-num-seqs 256 \
          --max-num-batched-tokens 256 \
          --data-parallel-size $((LWS_GROUP_SIZE * 8)) \
          --data-parallel-size-local 8 \
          --data-parallel-address ${LWS_LEADER_ADDRESS} \
          --data-parallel-rpc-port 5555 \
          --data-parallel-start-rank $START_RANK \
          --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail"}' \
          --enable-dbo \
          --dbo-prefill-token-threshold 32 \
          --enable-eplb \
          --eplb-config '{"window_size":"1000","step_interval":"3000","num_redundant_experts":"32","log_balancedness":"False"}' \
          --moe-backend deep_gemm \
          --all2all-backend deepep_high_throughput \
          --disable-uvicorn-access-log

    # -------------------------------------------------------------------------
    # Decode Configuration
    # -------------------------------------------------------------------------
    decode:
      replicas: 1
      # Same contract as prefill above. Decode binds 8200, not 8000: the
      # routing sidecar the chart injects on decode pods owns
      # `engine.servicePort` (8000) and forwards here.
      engine:
        command: |
          vllm serve Qwen/Qwen3-30B-A3B \
          --host 0.0.0.0 \
          --port 8200 \
          --gpu-memory-utilization 0.75 \
          --trust-remote-code \
          --api-server-count 1 \
          --disable-access-log-for-endpoints=/health,/metrics \
          --data-parallel-hybrid-lb \
          --enable-expert-parallel \
          --tensor-parallel-size 1 \
          --max-num-seqs 256 \
          --max-num-batched-tokens 256 \
          --data-parallel-size $((LWS_GROUP_SIZE * 8)) \
          --data-parallel-size-local 8 \
          --data-parallel-address ${LWS_LEADER_ADDRESS} \
          --data-parallel-rpc-port 5555 \
          --data-parallel-start-rank $START_RANK \
          --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail"}' \
          --enable-dbo \
          --dbo-decode-token-threshold 32 \
          --enable-eplb \
          --eplb-config '{"window_size":"1000","step_interval":"3000","num_redundant_experts":"32","log_balancedness":"False"}' \
          --all2all-backend deepep_low_latency \
          --moe-backend deep_gemm \
          --kv-cache-memory-bytes=${KV_CACHE_MEMORY_BYTES:-} \
          --disable-uvicorn-access-log

      # -----------------------------------------------------------------------
      # ROCE/GDR Configuration (uncomment to enable)
      # Decode only: prefill on this cluster does not transfer over RDMA. Move
      # these two keys up to `roleDefaults` to give both roles the device.
      # -----------------------------------------------------------------------
      networkResource: "rdma/roce_gdr"
      networkNr: "1"

    # =========================================================================
    # WORKLOAD / HARNESS -- Benchmark execution configuration
    # =========================================================================

    # -------------------------------------------------------------------------
    # Workload/Harness Configuration
    # -------------------------------------------------------------------------
    workDir: "~/data/wide-ep"

    harness:
      name: vllm-benchmark
      experimentProfile: random_concurrent.yaml

      smoketest:
        modelReadyTimeout: 3600     # 1 hour
        modelReadyPollInterval: 30  # poll every 30s

# AGENTIC-TESTS WELL LIT PATH
# Reasoning + tool-call deployment driven by OTel-trace replay.

scenario:
  # ============================================================================
  # Agentic tests: Qwen3-30B-A3B-Thinking with tool call support
  # ============================================================================
  - name: "agentic-tests"

    # =========================================================================
    # COMMON -- Applies to all deployment methods
    # =========================================================================
    common:
      # -------------------------------------------------------------------------
      # Affinity / Node Selection
      # By default, affinity is disabled and pods schedule on any available node.
      # Options:
      #   1. Leave commented out -- no node selection constraint
      #   2. Set nodeSelector to "auto" -- auto-detects GPU labels from the cluster
      #   3. Set explicit labels -- pods only schedule on matching nodes
      # -------------------------------------------------------------------------
      # affinity:
      #   enabled: true
      #   nodeSelector:
      #     nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3      # OpenShift
      #     # gpu.nvidia.com/model: H200                        # Kubernetes
      #     # cloud.google.com/gke-accelerator: nvidia-h100-80gb  # GKE
      # -------------------------------------------------------------------------
      # Model Configuration
      # Alternative models (commented out in original):
      #   - Qwen/Qwen3-0.6B
      #   - facebook/opt-125m
      #   - meta-llama/Llama-3.1-70B-Instruct
      #   - deepseek-ai/DeepSeek-R1-0528
      # -------------------------------------------------------------------------
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: qwen-qwen3-30b-a3b-thinking-2507
        size: 1Ti
        # maxModelLen / blockSize / gpuMemoryUtilization are deliberately NOT
        # set here: they are pure engine parameters, so they are stated in
        # decode's launch command below and read back out for the capacity
        # planner.

      # -------------------------------------------------------------------------
      # Storage Configuration
      # -------------------------------------------------------------------------
      storage:
        modelPvc:
          size: 1Ti
          # Uncomment to specify storage class:
          # storageClassName: standard-rwx
          # storageClassName: shared-vast
          # storageClassName: ocs-storagecluster-cephfs

      engine:
        # Sourced before the engine command, in the same shell: the `preprocess`
        # initContainer below writes this file with the network facts only the
        # node can tell us (RDMA/IB device names, GID index) plus the CUDA
        # library path. Engine commands never mention it.
        preprocessScript: ". /shared-config/llmdbench_env.sh"
        # The UCX settings for the NIXL data plane, if this stack ever needs
        # them, are container environment variables and belong in the role's
        # extraEnvVars -- UCX reads them from the environment, not the command:
        #   - name: UCX_TLS
        #     value: "rc,sm,cuda_ipc,cuda_copy,tcp"
        #   - name: UCX_NET_DEVICES
        #     value: "eth0"   # pin KV transfer when secondary NICs are attached
        networkResource: "auto"   # auto-detect from cluster nodes
        networkNr: "1"            # number of network devices

        volumes:
          - name: shared-config
            type: emptyDir
            emptyDir: {}
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi

        volumeMounts:
          - name: shared-config
            mountPath: /shared-config
          - name: dshm
            mountPath: /dev/shm

# Attaching a secondary network also gives UCX more interfaces to choose from
# for the NIXL KV-transfer data plane, and it chooses independently of
# VLLM_NIXL_SIDE_CHANNEL_HOST (which is pinned to the pod IP). If a rail cannot
# carry that traffic the handshake fails (NIXL_ERR_REMOTE_DISCONNECT /
# NIXL_ERR_NOT_FOUND) and requests hang instead of erroring, so set
# UCX_NET_DEVICES in the role's extraEnvVars when enabling this -- "eth0" keeps
# KV transfer on the pod network.
# Alternatively, --set 'annotations.prefill.pod."k8s.v1.cni.cncf.io/networks"'=multi-nic-compute,'annotations.decode.pod."k8s.v1.cni.cncf.io/networks"'=multi-nic-compute
      annotations:
        prefill:
          pod:
#            k8s.v1.cni.cncf.io/networks: multi-nic-inference
        decode:
          pod:
#            k8s.v1.cni.cncf.io/networks: multi-nic-inference

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      # -------------------------------------------------------------------------
      # Routing / GAIE Configuration
      # -------------------------------------------------------------------------
      router:
        extraServicePorts:
          - name: http
            port: 80
            protocol: TCP
            targetPort: 8081
          - name: metrics
            port: 9090
            protocol: TCP
            targetPort: 9090
        epp:
          replicas: 1
          flags:
            v: 2
          pluginsConfigFile: agentic-serving-plugins.yaml
          pluginsCustomConfig:
            agentic-serving-plugins.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: token-load-scorer
              - type: inflight-load-producer
              - type: approx-prefix-cache-producer
                parameters:
                  maxPrefixTokensToMatch: 262144
                  # WORKAROUND: autoTune is disabled and the LRU is sized manually.
                  # autoTune derives lruCapacityPerServer from on-device (HBM) blocks
                  # only (num_gpu_blocks) and ignores the KV-cache offload tier. With
                  # offloading enabled this under-counts cached prefixes.
                  # We size the LRU for the offload-extended cache
                  # (~num_gpu_blocks x 1000). Remove once autoTune is made offload-aware
                  # upstream — tracked by the llm-d-router offload-aware-LRU issue.
                  # https://github.com/llm-d/llm-d-router/issues/1650
                  autoTune: false
                  lruCapacityPerServer: 1570000
                  blockSizeTokens: 256
              - type: prefix-cache-affinity-filter
                parameters:
                  peakPrefillThroughput: 16444
              schedulingProfiles:
              - name: default
                plugins:
                - pluginRef: prefix-cache-affinity-filter
                - pluginRef: token-load-scorer
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        proxy:
          # CLI args for the Envoy sidecar. Override the chart's defaults of
          # `--log-level trace` (very expensive under load) and no `--concurrency`
          # (Envoy spawns ~hardware_concurrency() worker threads, oversubscribing
          # the cgroup's CPU slice). `--concurrency 8` matches the resources.limits
          # equivalent below; trace-level logging would burn a meaningful share of
          # the sidecar's CPU at high QPS.
          args:
            - "--service-node"
            - "envoy-sidecar"
            - "--log-level"
            - "warn"
            - "--concurrency"
            - "8"
            - "--drain-strategy"
            - "immediate"
            - "--drain-time-s"
            - "60"
            - "-c"
            - "/etc/envoy/envoy.yaml"
          # Resource requests and limits for the Envoy sidecar.
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        inferencePool:
          failureMode: "FailOpen"
          providerConfig:
            destinationRule:
              trafficPolicy:
                connectionPool:
                  http:
                    http1MaxPendingRequests: 256000
                    maxRequestsPerConnection: 256000
                    http2MaxRequests: 256000
                    idleTimeout: "900s"
                  tcp:
                    maxConnections: 256000
                    maxConnectionDuration: "1800s"
                    connectTimeout: "900s"
        modelServers:
          protocol: http
          matchLabels:
            llm-d.ai/guide: "agentic-serving"
        tracing:
          otelExporterEndpoint: "http://localhost:4317"
          sampling:
            sampler: "parentbased_traceidratio"
            samplerArg: "0.1"

      # -------------------------------------------------------------------------
      # HTTPRoute Configuration
      # requestTimeout: end-to-end Gateway-API HTTPRoute timeout the istio
      # gateway enforces per request. Long agentic turns that exceed it are
      # aborted by the gateway with a 502 (surfaces as "connection reset by
      # peer" on the decode routing-proxy loopback hop). Set "0s" to disable.
      # -------------------------------------------------------------------------
      httpRoute:
        # 0s = no gateway request timeout. Agentic turns can exceed the 300s
        # default; capping them here aborts long sessions with a 502 (seen as a
        # routing-proxy loopback reset), so this deployment disables it.
        requestTimeout: "0s"
        backendRequestTimeout: "0s"

      # -------------------------------------------------------------------------
      # Prefill Configuration
      # -------------------------------------------------------------------------
      prefill:
        enabled: false
        replicas: 0

      # -------------------------------------------------------------------------
      # Decode Configuration
      # -------------------------------------------------------------------------
      decode:
        replicas: 2
        # The launch command, verbatim -- the same line you would run by hand.
        # It reaches the container unchanged, so every flag here is read by vLLM
        # and none of them by llm-d-benchmark, which reads only what decides
        # Kubernetes objects: `--port` (container port, probes, the routing
        # sidecar's upstream) and the capacity numbers the pre-deploy check
        # needs.
        #
        # Decode binds 8200: the routing sidecar the chart injects on decode pods
        # owns `engine.servicePort` (8000) and forwards here.
        #
        # The agentic flags below -- reasoning parser, tool-call parser, pinned
        # generation config -- are the point of this guide, and they are exactly
        # as vLLM's own documentation spells them. Nothing translates them.
        # Devices per replica -- a Kubernetes fact, not a reading of the
        # command. The kubelet grants accelerators before the engine process
        # exists, so the count is stated here in Kubernetes' vocabulary and the
        # chart turns it into the pod's device request. It has to agree with the
        # width the command gives the engine (`--tensor-parallel-size 2` below),
        # or the engine starves at startup. To request a count the parallelism
        # widths do not describe, set `resources.limits.<accelerator resource>`.
        parallelism:
          tensor: 2

        engine:
          command: |
            vllm serve Qwen/Qwen3-30B-A3B-Thinking-2507 \
            --host 0.0.0.0 \
            --port 8200 \
            --max-model-len 262144 \
            --max-num-seqs 256 \
            --max-num-batched-tokens 256 \
            --tensor-parallel-size 2 \
            --block-size 64 \
            --gpu-memory-utilization 0.95 \
            --dtype bfloat16 \
            --no-enable-log-requests \
            --reasoning-parser qwen3 \
            --enable-auto-tool-choice \
            --tool-call-parser qwen3_xml \
            --disable-uvicorn-access-log \
            --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
            --override-generation-config '{"temperature": 0, "top_p": 1.0, "top_k": -1, "seed": 42}' \
            --no-enable-prefix-caching

        initContainers:
          - name: preprocess
            imageKey: benchmark
            imagePullPolicy: Always
            command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
            volumeMounts:
              - name: shared-config
                mountPath: /shared-config


        # Resource configuration
        resources:
          limits:
            memory: 256Gi
            cpu: "16"
          requests:
            memory: 128Gi
            cpu: "16"

        # -----------------------------------------------------------------------
        # Extra Environment Variables
        # No environment variables for this scenario. Nothing is auto-populated:
        # whatever the engine -- or a library beneath it (UCX_*, NCCL_*,
        # VLLM_NIXL_*, ...) -- needs must be listed here, the same way the
        # engine command lists its own flags.
        # -----------------------------------------------------------------------
        extraEnvVars: []

        # -----------------------------------------------------------------------
        # Extra Container Configuration
        # -----------------------------------------------------------------------
        extraContainerConfig:
          ports:
            - containerPort: 5557  # NIXL side channel port
              protocol: TCP
            - containerPort: 8200  # Metrics port
              name: metrics
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_RAWIO"
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always

        # -----------------------------------------------------------------------
        # Additional Volume Mounts
        # -----------------------------------------------------------------------
        additionalVolumeMounts: []

        # -----------------------------------------------------------------------
        # Additional Volumes
        # -----------------------------------------------------------------------
        additionalVolumes: []

    harness:
      name: inference-perf
      experimentProfile: otel_traces.yaml

    experiment:
      datasetDir: /workspace/inference-perf/examples/otel/test_traces/advanced/

    # =========================================================================
    # WORKLOAD / HARNESS -- Benchmark execution configuration
    # =========================================================================
    workDir: "~/data/agentic-tests"
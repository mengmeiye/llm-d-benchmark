# EPP+KEDA SATURATION AUTOSCALING GUIDE
#
# Same base configuration as `optimized-baseline.yaml` (Qwen3-32B, 2 decode
# pods, modelservice deployment) but with direct EPP+KEDA saturation autoscaling.
# No WVA controller, no VariantAutoscaling, no prometheus-adapter.
#
# Running:
#
#   llmdbenchmark --spec guides/epp-keda-saturation standup -p <namespace>
#
# The `--epp-keda-saturation` CLI flag is NOT required with this scenario because
# `eppKedaSaturation.enabled: true` is already hard-coded below. Pass the flag with
# the plain `optimized-baseline` scenario if you want to toggle EPP+KEDA on
# without editing YAML.

scenario:
  # =========================================================================
  # EPP+KEDA SATURATION AUTOSCALING - Qwen3-32B with 2 decode pods
  # =========================================================================
  - name: "epp-keda-saturation"

    common:
      # =========================================================================
      # MODEL CONFIGURATION
      # =========================================================================
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: qwen-qwen3-32b
        size: 1Ti
        # maxModelLen / blockSize / gpuMemoryUtilization are deliberately NOT
        # set here: they are pure engine parameters, so they are stated in
        # decode's launch command below and read back out for the capacity
        # planner.

      # =========================================================================
      # STORAGE
      # =========================================================================
      storage:
        modelPvc:
          size: 1Ti
        hostPath:
          # TODO: should we default to enabled: true for WVA scenarios?
          enabled: false
          path: /mnt/models
          storageClassName: hostpath
          capacity: 1Ti
          # Target the GPU nodes where decode pods will schedule.
          # Replace with your cluster's actual node labels.
          nodeSelector:
            nvidia.com/gpu.present: "true"
          tolerations: []
          daemonSetTimeout: 3600

      # =========================================================================
      # ENGINE CONFIGURATION
      # =========================================================================
      engine:
        # Sourced before the engine command, in the same shell: the `preprocess`
        # initContainer below writes this file with the network facts only the
        # node can tell us (RDMA/IB device names, GID index) plus the CUDA
        # library path. Engine commands never mention it.
        preprocessScript: ". /shared-config/llmdbench_env.sh"
        volumes:
          - name: shared-config
            type: emptyDir
            emptyDir: {}
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi

        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: shared-config
            mountPath: /shared-config

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      gateway:
        className: agentgateway
        externallyManaged: true  # agentgateway already exists in cluster

      # =========================================================================
      # ROUTING / GAIE CONFIGURATION
      #
      # EPP+KEDA autoscaling is driven by EPP queue depth, so we enable the
      # `flowControl` feature gate in the EPP's EndpointPickerConfig. That gate
      # is not on by default, and toggling it requires shipping a custom
      # EndpointPickerConfig (the default one the gaie chart ships has no
      # `featureGates` block). We inline it here and point `pluginsConfigFile`
      # at this filename so the chart mounts it as the active config.
      # =========================================================================
      router:
        epp:
          pluginsConfigFile: "epp-keda-optimized-baseline.yaml"
          pluginsCustomConfig:
            epp-keda-optimized-baseline.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              featureGates:
                - flowControl
              plugins:
                - type: queue-scorer
                - type: kv-cache-utilization-scorer
                - type: prefix-cache-scorer
                - type: no-hit-lru-scorer
              schedulingProfiles:
                - name: default
                  plugins:
                    - pluginRef: queue-scorer
                      weight: 2
                    - pluginRef: kv-cache-utilization-scorer
                      weight: 2
                    - pluginRef: prefix-cache-scorer
                      weight: 3
                    - pluginRef: no-hit-lru-scorer
                      weight: 2

      # =========================================================================
      # PREFILL / DECODE CONFIGURATION (same as optimized-baseline.yaml)
      # =========================================================================
      prefill:
        enabled: false
        replicas: 0

      decode:
        replicas: 2

        # The launch command, verbatim -- the same line you would run by hand.
        # It reaches the container unchanged, so every flag here is read by vLLM
        # and none of them by llm-d-benchmark, which reads only what decides
        # Kubernetes objects: `--port` (container port, probes, the routing
        # sidecar's upstream) and the capacity numbers the pre-deploy check
        # needs.
        #
        # Decode binds 8200: the routing sidecar the chart injects on decode pods
        # owns `engine.servicePort` (8000) and forwards here.
        #
        # `--kv-transfer-config` is written out here rather than assembled from a
        # connector/role pair, so the JSON vLLM parses is the JSON in this file.
        # A device without GPU-to-GPU transport has to stage through host
        # memory -- add `, "kv_buffer_device":"cpu"` inside the JSON there
        # (config/scenarios/examples/intel-xpu.yaml does).
        engine:
          command: |
            vllm serve Qwen/Qwen3-32B \
            --host 0.0.0.0 \
            --port 8200 \
            --max-model-len 16000 \
            --max-num-seqs 256 \
            --max-num-batched-tokens 256 \
            --tensor-parallel-size 1 \
            --block-size 64 \
            --gpu-memory-utilization 0.95 \
            --dtype bfloat16 \
            --enforce-eager \
            --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
            --no-enable-log-requests \
            --disable-uvicorn-access-log

        initContainers:
          - name: preprocess
            imageKey: benchmark
            imagePullPolicy: Always
            command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
            volumeMounts:
              - name: shared-config
                mountPath: /shared-config


        resources:
          limits:
            memory: 64Gi
            cpu: "16"
          requests:
            memory: 64Gi
            cpu: "16"

        # vLLM reads these two from the environment rather than the command
        # line, so they stay env vars. Their names are vLLM's own.
        extraEnvVars:
          - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
            value: "1"
          - name: VLLM_SERVER_DEV_MODE
            value: "1"
          # NixlConnector publishes this address to its peer as where the KV blocks
          # can be read from, and takes it from the environment rather than the
          # launch line. vLLM defaults it to `localhost`, which no other pod can
          # reach -- the same declaration the llm-d guides make.
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP

        extraContainerConfig:
          ports:
            - containerPort: 5557
              protocol: TCP
            - containerPort: 8200
              name: metrics
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_RAWIO"
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always

        additionalVolumeMounts: []
        additionalVolumes: []

        probes:
          startup:
            path: /v1/models
            failureThreshold: 60
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          liveness:
            path: /health
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          readiness:
            path: /v1/models
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2

        monitoring:
          podmonitor:
            enabled: true
            portName: metrics
            path: /metrics
            interval: 30s
            labels:
              release: llmd


    # =========================================================================
    # EPP+KEDA SATURATION CONFIGURATION
    #
    # Direct KEDA autoscaling using EPP pool metrics. All thresholds and
    # behavior parameters are spelled out below so users can tweak them
    # per-experiment without editing defaults.yaml.
    # =========================================================================
    eppKedaSaturation:
      enabled: true

      namespace: ""              # defaults to deploy namespace (first slot of `-p`)

      prometheus:
        baseUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local
        port: 9091

      epp:
        poolName: ""             # defaults to model_id_label at render time
        metricsPortName: http-metrics
        metricsPort: 9090
        prometheusServiceAccount: thanos-querier
        prometheusServiceAccountNamespace: openshift-monitoring

      scaledObject:
        minReplicas: 1
        maxReplicas: 10
        pollingInterval: 15
        unsafeSsl: true
        # Defaults come from defaults.yaml; override the whole set here, e.g.
        # (metricType + activationThreshold optional, default AverageValue/"0"):
        # triggers:
        #   - name: pool-saturation
        #     query: 'max(llm_d_epp_flow_control_pool_saturation{inference_pool="${poolName}"})'
        #     threshold: "0.7"
        #     metricType: AverageValue
        #     activationThreshold: "0"
        #   - name: running-requests
        #     query: 'sum(llm_d_epp_request_running{model_name="${modelName}"})'
        #     threshold: "16"
        #     metricType: AverageValue
        #     activationThreshold: "0"
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              # Adjust periodSeconds to match actual pod startup time.
              # GPU hardware (H100/A100): 180 seconds
              # Simulator / kind cluster (fast startup): 30 seconds
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300

    harness:
      name: inference-perf
      experimentProfile: shared_prefix_synthetic.yaml

    workDir: "~/data/epp-keda-saturation"
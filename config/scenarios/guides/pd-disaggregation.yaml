# P/D DISAGGREGATION WELL LIT PATH
# Based on https://github.com/llm-d/llm-d/tree/main/guides/pd-disaggregation/README.md
#
# Notes:
# - Removed pod monitoring; can be added using decode.extraContainerConfig / prefill.extraContainerConfig
# - Removed extra volumes metrics-volume and torch-compile-volume (not needed for this model/hardware)
# - Use decode.additionalVolumeMounts and decode.additionalVolumes to add them if needed
# - Use prefill.additionalVolumeMounts and prefill.additionalVolumes to add them if needed

scenario:
  # ============================================================================
  # P/D Disaggregation - Qwen3-32B with 2 prefill and 2 decode pods
  # ============================================================================
  - name: "pd-disaggregation"

    common:
      accelerator:
        profile: auto
        resource: auto

      # -------------------------------------------------------------------------
      # Affinity / Node Selection
      # By default, affinity is disabled and pods schedule on any available node.
      # Options:
      #   1. Leave commented out -- no node selection constraint
      #   2. Set nodeSelector to "auto" -- auto-detects GPU labels from the cluster
      #   3. Set explicit labels -- pods only schedule on matching nodes
      # -------------------------------------------------------------------------
      # affinity:
      #   enabled: true
      #   nodeSelector:
      #     nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3      # OpenShift
      #     # gpu.nvidia.com/model: H200                        # Kubernetes
      #     # cloud.google.com/gke-accelerator: nvidia-h100-80gb  # GKE

      # -------------------------------------------------------------------------
      # Multinode Configuration (LeaderWorkerSet)
      # -------------------------------------------------------------------------
      #multinode:
      #  enabled: true

      # -------------------------------------------------------------------------
      # Scheduler Configuration
      # (commented out in original -- uncomment to enable)
      # -------------------------------------------------------------------------
      # schedulerName: custom-binpack-scheduler

      # -------------------------------------------------------------------------
      # Model Configuration
      # The model is named in the launch commands below and nowhere else. To
      # serve a different one, edit the commands and the shortName here; the
      # PVC path, pod labels, HTTPRoute and harness target all follow.
      # Models this guide has been run with: Qwen/Qwen3-0.6B, facebook/opt-125m, meta-llama/Llama-3.1-8B-Instruct,
      #   meta-llama/Llama-3.1-70B-Instruct, deepseek-ai/DeepSeek-R1-0528,
      #   openai/gpt-oss-120b.
      # -------------------------------------------------------------------------
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: qwen-qwen3-32b
        size: 1Ti
        # maxModelLen, gpuMemoryUtilization and blockSize are deliberately NOT
        # set here: they are engine parameters, so they are stated in the launch
        # commands below -- `--max-model-len`, `--gpu-memory-utilization`,
        # `--block-size` -- and read back out of them for the pre-deploy
        # capacity check and for anything that has to index the engine's KV
        # pages.

      # -------------------------------------------------------------------------
      # Storage Configuration
      # -------------------------------------------------------------------------
      storage:
        modelPvc:
          size: 1Ti
          # Uncomment to specify storage class:
          # storageClassName: standard-rwx
          # storageClassName: shared-vast
          # storageClassName: ocs-storagecluster-cephfs

      # Everything under `engine` is infrastructure the POD needs, not a
      # parameter the engine process takes: RDMA device limits, volumes, the
      # Service port. Engine parameters are stated once, in the launch command
      # each role below carries verbatim.
      #
      # The RDMA/RoCE data plane is not here either: UCX reads it from the
      # container environment, so `UCX_TLS` and `UCX_NET_DEVICES` are set in
      # `roleDefaults.extraEnvVars` below, where every other environment
      # variable this stack needs already lives.
      engine:
        # Sourced before the engine command, in the same shell: the `preprocess`
        # initContainer below writes this file with the network facts only the
        # node can tell us (RDMA/IB device names, GID index) plus the CUDA
        # library path. Engine commands never mention it.
        preprocessScript: ". /shared-config/llmdbench_env.sh"
        networkResource: "auto"   # auto-detect from cluster nodes
        networkNr: "1"            # number of network devices

        volumes:
          - name: shared-config
            type: emptyDir
            emptyDir: {}
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi

        volumeMounts:
          - name: shared-config
            mountPath: /shared-config
          - name: dshm
            mountPath: /dev/shm

# Attaching a secondary network gives UCX more interfaces to choose from for the
# NIXL KV-transfer data plane, and it chooses independently of
# VLLM_NIXL_SIDE_CHANNEL_HOST (which is pinned to the pod IP). If a rail cannot
# carry that traffic the handshake fails (NIXL_ERR_REMOTE_DISCONNECT /
# NIXL_ERR_NOT_FOUND) and requests hang or 500 rather than erroring cleanly, so
# `UCX_NET_DEVICES` in roleDefaults.extraEnvVars below narrows the choice. The
# right value depends on which transport you want, and the device names are a
# property of your cluster's hardware -- there is no portable default:
#
#   * TCP over the pod network (simplest): drop "rc" from UCX_TLS and set
#     UCX_NET_DEVICES: "eth0". KV transfer ignores the secondary rails.
#   * TCP over the secondary rails: netdev names, e.g. "net1-0,net1-1,...".
#   * RDMA/RoCE: keep "rc" in UCX_TLS AND give UCX_NET_DEVICES HCA names in
#     <device>:<port> form, e.g. "mlx5_1:1,mlx5_3:1". "eth0" is NOT an RDMA
#     device, so pinning it silently keeps you on TCP.
#
# UCX_NET_DEVICES ships empty, which lets the preprocess init container
# auto-detect the RoCE devices. That works when every rail exposes its GID at
# the same index; pin the list explicitly if you see "HCA IDs selected: []" in
# the init container log, or to hold the KV transfer to a subset of the rails.
#
# Rails sharing one subnet additionally need source-based routing rules, which
# the preprocess init container installs. The device names and the attachment name
# are per-cluster facts: override them with --set or a --cluster-config/--cc
# overlay where this guide's values do not match your nodes.
# Alternatively, --set 'annotations.prefill.pod."k8s.v1.cni.cncf.io/networks"'=multi-nic-compute,'annotations.decode.pod."k8s.v1.cni.cncf.io/networks"'=multi-nic-compute
      annotations:
        prefill:
          pod:
            k8s.v1.cni.cncf.io/networks: multi-nic-inference
        decode:
          pod:
            k8s.v1.cni.cncf.io/networks: multi-nic-inference

      # ---- OpenTelemetry tracing ----------------------------------------------
      # Emits OTEL_* env vars on prefill, decode and the routing proxy; vLLM
      # receives the endpoint through --otlp-traces-endpoint in the launch
      # commands below. Deploy a collector reachable at otlpEndpoint -- the
      # benchmark configures tracing but ships no backend of its own.
      tracing:
        enabled: true
        otlpEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"
        sampling:
          sampler: "parentbased_traceidratio"
          samplerArg: "1.0"       # 1.0 = sample everything; lower for long runs
        serviceNames:
          vllmPrefill: "vllm-prefill"
          vllmDecode: "vllm-decode"
          routingProxy: "routing-proxy"

      timeouts:
        controlWait: 900000
        harnessWait: 900000

    # =========================================================================
    # KUSTOMIZE DEPLOY METHOD   (scope: the ENTIRE stack)
    # -------------------------------------------------------------------------
    # When kustomize.enabled is true (or `-t kustomize` is passed) this
    # scenario is deployed by applying the UPSTREAM llm-d guide directly
    # (guides/<guideName> in the llm-d repo). In that mode the deployment is
    # defined ENTIRELY by the guide's own manifests:
    #
    #   * EVERYTHING ELSE in this scenario is IGNORED -- model, modelservice,
    #     standalone, decode/prefill, engine, storage, harness model, etc.
    #   * `-m/--models` and all other CLI/scenario tuning are ignored.
    #   * DoE `experiment` SETUP sweeps do NOT alter a kustomize deploy
    #     (only run/workload treatments still apply).
    #
    # The ONLY way to modify a kustomize deployment is the kustomize.* keys
    # below:
    #   patches / overlayPath           -> modelserver (the workload pods)
    #   extraHelmValues / extraHelmSets -> router / GAIE helm release
    #   guideVariableOverrides          -> override the guide README's ${VAR}
    # See docs/kustomize.md for the full reference and worked examples.
    #
    # NOT SUPPORTED with kustomize: multi-model / multi-stack scenarios
    # (the deploy is keyed on guideName with no per-stack uniquification --
    # stacks would collide). Use the modelservice method for multi-model.
    #
    # When kustomize.enabled is false (the DEFAULT) this whole block is
    # inert and the scenario deploys via modelservice/standalone as
    # configured further below.
    # =========================================================================
    kustomize:
      enabled: false
      guideName: "pd-disaggregation"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      acceleratorBackend: "gpu/vllm"
# Alternative: use --set kustomize.acceleratorBackend=gpu/sglang on the CLI to switch sglang
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides: {}   # override/fill the guide README's ${VAR}

      # Inline kustomize strategic merge patches applied on top of the
      # guide's modelserver base.  For gated models, add an HF_TOKEN
      # env var patch (the secret is auto-created from HF_TOKEN env):
      # Default is empty -- upstream guide already injects HF_TOKEN from
      # the `llm-d-hf-token` Secret (auto-created by standup) into both
      # decode and prefill Deployments. Add entries here only for
      # non-token overrides -- see optimized-baseline.yaml for an example.
      patches: []

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      gateway:
        className: epponly

      # -------------------------------------------------------------------------
      # Routing Configuration
      # -------------------------------------------------------------------------
      routing:
        connector: nixlv2

      # -------------------------------------------------------------------------
      # Routing / GAIE Configuration
      # Reference: https://github.com/llm-d/llm-d/blob/main/guides/pd-disaggregation/router/pd-disaggregation.values.yaml
      # The plugins block uses the `llm-d.ai/v1alpha1` apiVersion shipped
      # by the llm-d-router-{standalone,gateway}-dev charts.
      # -------------------------------------------------------------------------
      router:
        extraServicePorts:
          - name: http
            port: 80
            protocol: TCP
            targetPort: 8081
        epp:
          replicas: 1
          flags:
            v: 2
          pluginsConfigFile: "pd-config.yaml"
          pluginsCustomConfig:
            pd-config.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: disagg-headers-handler
              - type: always-disagg-pd-decider
              - type: disagg-profile-handler
                parameters:
                  deciderPluginName: always-disagg-pd-decider
              - type: prefill-filter
              - type: decode-filter
              - type: prefix-cache-scorer
              - type: queue-scorer
              - type: kv-cache-utilization-scorer
              - type: active-request-scorer
              schedulingProfiles:
              - name: prefill
                plugins:
                - pluginRef: prefill-filter
                - pluginRef: prefix-cache-scorer
                  weight: 3
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2
              - name: decode
                plugins:
                - pluginRef: decode-filter
                - pluginRef: active-request-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        proxy:
          # CLI args for the Envoy sidecar. Override the chart's defaults of
          # `--log-level trace` (very expensive under load) and no `--concurrency`
          # (Envoy spawns ~hardware_concurrency() worker threads, oversubscribing
          # the cgroup's CPU slice). `--concurrency 8` matches the resources.limits
          # equivalent below; trace-level logging would burn a meaningful share of
          # the sidecar's CPU at high QPS.
          args:
            - "--service-node"
            - "envoy-sidecar"
            - "--log-level"
            - "warn"
            - "--concurrency"
            - "8"
            - "--drain-strategy"
            - "immediate"
            - "--drain-time-s"
            - "60"
            - "-c"
            - "/etc/envoy/envoy.yaml"
          # Resource requests and limits for the Envoy sidecar.
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        inferencePool:
          failureMode: "FailOpen"
          providerConfig:
            destinationRule:
              trafficPolicy:
                connectionPool:
                  http:
                    http1MaxPendingRequests: 256000
                    maxRequestsPerConnection: 256000
                    http2MaxRequests: 256000
                    idleTimeout: "900s"
                  tcp:
                    maxConnections: 256000
                    maxConnectionDuration: "1800s"
                    connectTimeout: "900s"
        modelServers:
          protocol: http
          matchLabels:
            llm-d.ai/guide: "pd-disaggregation"
        tracing:
          otelExporterEndpoint: "http://localhost:4317"
          sampling:
            sampler: "parentbased_traceidratio"
            samplerArg: "0.1"

      # -------------------------------------------------------------------------
      # HTTPRoute Configuration
      # requestTimeout: end-to-end Gateway-API HTTPRoute timeout the istio
      # gateway enforces per request. Long agentic turns that exceed it are
      # aborted by the gateway with a 502 (surfaces as "connection reset by
      # peer" on the decode routing-proxy loopback hop). Set "0s" to disable.
      # -------------------------------------------------------------------------
      httpRoute:
        requestTimeout: "300s"
        backendRequestTimeout: "0s"

      # -----------------------------------------------------------------------
      # Shared role configuration
      # Prefill and decode run the same container with the same NIXL transport
      # and the same capabilities, so that shape is stated once. What genuinely
      # differs between them -- how many replicas, how wide, how much memory,
      # and the launch command -- each role states for itself below, and a key
      # a role names wins over the value here.
      # -----------------------------------------------------------------------
      roleDefaults:
        initContainers:
          - name: preprocess
            imageKey: benchmark
            imagePullPolicy: Always
            # Runs the scripts mounted from the llm-d-benchmark-preprocesses
            # ConfigMap, which standup builds from the local checkout.
            command: ["python3", "/setup/preprocess/set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
            volumeMounts:
              - name: shared-config
                mountPath: /shared-config
              - name: preprocesses
                mountPath: /setup/preprocess

        # -----------------------------------------------------------------------
        # Extra Environment Variables
        # -----------------------------------------------------------------------
        extraEnvVars:
          # The one environment variable the llm-d pd-disaggregation guide declares
          # on both roles (guides/pd-disaggregation/modelserver/gpu/vllm/base/
          # patch-{decode,prefill}.yaml). NixlConnector publishes this address to
          # its peer as where the KV blocks can be read from, and takes it from the
          # environment rather than the launch line. vLLM defaults it to
          # `localhost`, which the other pod cannot reach, so the handshake has to
          # be told the pod's own IP.
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: NCCL_EXCLUDE_IB_HCA
            value: ""
          - name: NVSHMEM_DEBUG
            value: "none"
          - name: NCCL_DEBUG
            value: "WARN"
          - name: NIXL_LOG_LEVEL
            value: debug
          - name: UCX_MAX_RMA_RAILS
            value: "1"
          # Disables NVLink SHARP (NVLS) collectives, which require an
          # initialized Fabric Manager.
          - name: NCCL_NVLS_ENABLE
            value: "0"
          # NIXL moves the KV blocks over UCX, and UCX picks its transports at
          # agent creation -- after the weights are loaded, so a bad choice
          # surfaces as an engine that dies minutes into startup rather than as
          # a flag error. These name the set this stack is built for: `rc` is
          # the RDMA transport, then shared memory and CUDA copies inside a pod,
          # TCP between pods that have no RDMA device, and TCP for the
          # rendezvous.
          - name: UCX_TLS
            value: "rc,sm,cuda_ipc,cuda_copy,tcp"
          - name: UCX_SOCKADDR_TLS_PRIORITY
            value: "tcp"
          # Rails to pin the KV transfer to, in HCA form <device>:<port> --
          # list yours with `ibstat -l` / `show_gids.sh`. Left empty, the
          # preprocess initContainer discovers the RoCE devices and writes the
          # value into /shared-config/llmdbench_env.sh; any non-empty value
          # here wins over that discovery, so set it to hold the transfer to a
          # subset of the rails, e.g.
          #   --set 'modelservice.roleDefaults.extraEnvVars[N].value=mlx5_1:1,mlx5_3:1'
          - name: UCX_NET_DEVICES
            value: ""
          # vLLM's own keep-alive is 5s, shorter than the 90s idle timeout Go's
          # http.Transport gives llm-d-routing-sidecar, so the sidecar reuses a
          # connection the engine has already closed and the request dies on a
          # TCP reset. The llm-d guide raises it for the same reason.
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: "120"

        # -----------------------------------------------------------------------
        # Extra Container Configuration
        # -----------------------------------------------------------------------
        extraContainerConfig:
          securityContext:
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_RAWIO"
                - "NET_ADMIN"
                - "NET_RAW"
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always

        # -----------------------------------------------------------------------
        # Additional Volume Mounts
        # -----------------------------------------------------------------------
        additionalVolumeMounts: []

        # -----------------------------------------------------------------------
        # Additional Volumes
        # -----------------------------------------------------------------------
        additionalVolumes:
          - name: preprocesses
            type: configMap
            configMap:
              name: llm-d-benchmark-preprocesses
              defaultMode: 493        # 0755, so the scripts are executable

      # -------------------------------------------------------------------------
      # Prefill Configuration
      # -------------------------------------------------------------------------
      prefill:
        enabled: true
        replicas: 1
  #      replicas: 8
        engine:
          # The launch command, verbatim. Paste in a line that already works for
          # you and it runs unchanged; the only flag llm-d-benchmark reads is
          # `--port`, because the container port and the probes have to name an
          # endpoint before the process exists.
          #
          # A prefill pod never gets the routing sidecar (the chart injects it
          # only on decode), so prefill binds `engine.servicePort` (8000)
          # itself -- which is also where decode's NIXL transfer reaches it.
          #
          # The flags below are the ones this guide was run with on CUDA. Other
          # backends want materially different ones -- XPU takes no
          # `--block-size` and wants `--enforce-eager`, Spyre and CPU differ
          # again -- so they get their own scenario file rather than a
          # substitution point here (see config/scenarios/examples/intel-xpu.yaml).
          command: |
            vllm serve Qwen/Qwen3-32B \
            --host 0.0.0.0 \
            --port 8000 \
            --block-size 128 \
            --max-model-len 16384 \
            --max-num-seqs 256 \
            --max-num-batched-tokens 256 \
            --tensor-parallel-size 1 \
            --gpu-memory-utilization 0.90 \
            --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
            --disable-uvicorn-access-log \
            --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
            --no-enable-prefix-caching \
            --dtype bfloat16 \
            --no-disable-hybrid-kv-cache-manager \
            ${OTEL_EXPORTER_OTLP_ENDPOINT:+--otlp-traces-endpoint $OTEL_EXPORTER_OTLP_ENDPOINT}

        # Resource configuration
        resources:
          limits:
            memory: 16Gi
            cpu: "8"
          requests:
            memory: 16Gi
            cpu: "8"

      # -------------------------------------------------------------------------
      # Decode Configuration
      # -------------------------------------------------------------------------
      decode:
        replicas: 2
        # Devices per replica -- a Kubernetes fact, not a reading of the
        # command. The kubelet grants accelerators before the engine process
        # exists, so the count is stated here in Kubernetes' vocabulary and the
        # chart turns it into the pod's device request. It has to agree with the
        # width the command gives the engine (`--tensor-parallel-size 2` below),
        # or the engine starves at startup. To request a count the parallelism
        # widths do not describe, set `resources.limits.<accelerator resource>`.
        parallelism:
          tensor: 2

        engine:
          # Same verbatim contract as prefill. Decode binds 8200, not 8000:
          # the routing sidecar the chart injects on decode pods listens on
          # `engine.servicePort` (8000) and forwards here. In direct mode
          # (`gateway.className: none`) there is no sidecar -- bind 8000 then.
          command: |
            vllm serve Qwen/Qwen3-32B \
            --host 0.0.0.0 \
            --port 8200 \
            --block-size 128 \
            --max-model-len 16384 \
            --max-num-seqs 256 \
            --max-num-batched-tokens 256 \
            --tensor-parallel-size 2 \
            --gpu-memory-utilization 0.90 \
            --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
            --disable-uvicorn-access-log \
            --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
            --no-enable-prefix-caching \
            --dtype bfloat16 \
            --no-disable-hybrid-kv-cache-manager \
            ${OTEL_EXPORTER_OTLP_ENDPOINT:+--otlp-traces-endpoint $OTEL_EXPORTER_OTLP_ENDPOINT}

        # Resource configuration
        resources:
          limits:
            memory: 128Gi
            cpu: "32"
          requests:
            memory: 128Gi
            cpu: "32"

    harness:
      name: vllm-benchmark
      experimentProfile: random_concurrent.yaml

    workDir: "~/data/pd-disaggregation"

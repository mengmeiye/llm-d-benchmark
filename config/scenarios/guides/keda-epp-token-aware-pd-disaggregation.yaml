# [EXPERIMENTAL] TOKEN-AWARE AUTOSCALING GUIDE -- P/D-DISAGGREGATED VARIANT
#
# Scales prefill and decode Deployments INDEPENDENTLY on TOKENS of outstanding
# work rather than a count of requests. Two ScaledObjects, two Deployments:
#   prefill  sum(llm_d_epp_inflight_tokens{endpoint_name=~".*prefill.*"})
#              / peakPrefillThroughput                -> SECONDS of backlog
#   decode   sum(vllm:kv_cache_usage_perc{pod=~".*decode.*"}) -> pods' worth of full KV
#   each Deployment scales independently: replicas = ceil(signal / threshold)
#
# This is the P/D-disaggregated sibling of guides/keda-epp-token-aware (P+D
# co-located). Built on guides/pd-disaggregation the same way that scenario was
# built on guides/optimized-baseline -- everything about the base topology
# (model, storage, disagg routing plugins, prefill/decode Deployments) is
# reused verbatim; only the router's token-aware plugins, decode's pod
# monitoring, and the eppKedaSaturation block are added/changed.
#
# Reuses the eppKedaSaturation plumbing (Thanos auth, TriggerAuthentication, EPP
# ServiceMonitor) with scaledObject.targets -- a list that renders ONE
# ScaledObject per Deployment instead of the co-located guide's single object.
# No new standup step, no new controller.
#
# Based on:
#   https://github.com/llm-d/llm-d/tree/main/guides/workload-autoscaling/keda-epp-token-aware/pd-disaggregation
#   https://github.com/llm-d/llm-d/tree/main/guides/pd-disaggregation
#
# Running:
#
#   llmdbenchmark --spec guides/keda-epp-token-aware-pd-disaggregation standup -p <namespace>
#   make calibrate-peak-prefill NAMESPACE=<namespace> APPLY=1
#   llmdbenchmark --spec guides/keda-epp-token-aware-pd-disaggregation run \
#     --harness inference-perf --workload random_prefill_heavy.yaml \
#     --monitoring --analyze
#
# BEFORE YOU RUN: peakPrefillThroughput below is a PLACEHOLDER borrowed from the
# co-located guide's own measurement (Qwen3-32B / H100-80GB / TP=2, same model
# and accelerator class -- but a DIFFERENT topology). The upstream guide
# explicitly warns V_P through a disaggregated KV-transfer path can be "several
# times lower" than the co-located path for the identical model/GPU, so treat
# this as a smoke-test value only. Measure your own before trusting the
# threshold:
#
#   make calibrate-peak-prefill NAMESPACE=<ns> APPLY=1
#
# CAVEAT for P/D specifically: `make calibrate-peak-prefill`'s idle-check only
# inspects pods matched by `grep decode` and curls their port 8200 -- it never
# inspects prefill pods (a separate role here, listening on port 8000). A busy
# prefill pod would inflate the measured V_P without being caught. Manually
# confirm prefill pods are idle (no in-flight requests, no queued KV) before
# trusting a calibration run against this scenario. See docs/token-aware-autoscaling.md.

scenario:
  # =========================================================================
  # EPP+KEDA TOKEN-AWARE AUTOSCALING -- P/D-disaggregated, Qwen3-32B
  # =========================================================================
  - name: "keda-epp-token-aware-pd-disaggregation"

    common:
      accelerator:
        profile: auto
        resource: auto

      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the role commands state; a short name is a
        # choice, so it stays here.
        shortName: qwen-qwen3-32b
        size: 1Ti
        # maxModelLen / blockSize / gpuMemoryUtilization are deliberately NOT
        # set here: they are engine parameters, so the role commands state them
        # and they are read back out for the pre-deploy capacity check and the
        # router's prefix-cache index.
        #
        # The prefill chunk (`--max-num-batched-tokens`) is in those commands
        # too, and in this guide it carries a second meaning: it MUST equal the
        # calibration's CHUNK_SIZE, or an 8192-token prompt is prefilled in
        # several passes and the measured peakPrefillThroughput is silently
        # wrong. See the comment on prefill's command.

      storage:
        modelPvc:
          size: 1Ti

      # Pod infrastructure, not engine parameters: RDMA device limits, volumes,
      # the Service port. Every engine parameter is stated once, in the launch
      # command each role below carries verbatim.
      engine:
        # Sourced before the engine command, in the same shell: the `preprocess`
        # initContainer below writes this file with the network facts only the
        # node can tell us (RDMA/IB device names, GID index) plus the CUDA
        # library path. Engine commands never mention it.
        preprocessScript: ". /shared-config/llmdbench_env.sh"

        networkResource: "auto"   # auto-detect from cluster nodes
        networkNr: "1"            # number of network devices

        volumes:
          - name: shared-config
            type: emptyDir
            emptyDir: {}
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi

        volumeMounts:
          - name: shared-config
            mountPath: /shared-config
          - name: dshm
            mountPath: /dev/shm

      annotations:
        prefill:
          pod:
        decode:
          pod:

      timeouts:
        controlWait: 900000
        harnessWait: 900000

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # No kustomize.* block here (unlike pd-disaggregation.yaml) -- there is no
    # single upstream guideName for this composed scenario, matching how
    # keda-epp-token-aware.yaml also drops kustomize support relative to its
    # own base (optimized-baseline.yaml).
    # =========================================================================
    modelservice:
      enabled: true

      gateway:
        className: epponly

      # -------------------------------------------------------------------------
      # Routing Configuration
      # -------------------------------------------------------------------------
      routing:
        connector: nixlv2

      # -------------------------------------------------------------------------
      # Routing / GAIE Configuration
      # Base disagg plugins reused verbatim from pd-disaggregation.yaml. Token-
      # aware plugins added; the PREFILL profile's scorer set is REPLACED (not
      # layered) with prefix-cache-affinity-filter + token-load-scorer, mirroring
      # exactly how keda-epp-token-aware.yaml converted optimized-baseline's
      # `default` profile for the co-located guide (queue-scorer/kv-cache-
      # utilization-scorer/prefix-cache-scorer swapped out wholesale for the
      # token-aware pair, unweighted). prefix-cache-scorer stays in the DECODE
      # profile unchanged -- that's a different decision (which decode replica
      # gets a request after KV transfer) unrelated to prefill-side recompute
      # economics, so it is not redundant with prefix-cache-affinity-filter there.
      # -------------------------------------------------------------------------
      router:
        extraServicePorts:
          - name: http
            port: 80
            protocol: TCP
            targetPort: 8081
        epp:
          # MUST stay at 1: inflight-load-producer's token accounting is local
          # to each EPP process, so N replicas each publish only a fraction of
          # the true per-endpoint load and the prefill trigger under-scales
          # forever. (Already 1 in the base pd-disaggregation.yaml; called out
          # here because it is now load-bearing for autoscaling correctness.)
          replicas: 1
          flags:
            v: 2
          pluginsConfigFile: "token-aware-pd-plugins.yaml"
          pluginsCustomConfig:
            token-aware-pd-plugins.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: disagg-headers-handler
              - type: always-disagg-pd-decider
              - type: disagg-profile-handler
                parameters:
                  deciderPluginName: always-disagg-pd-decider
              - type: prefill-filter
              - type: decode-filter
              - type: prefix-cache-scorer
              - type: active-request-scorer
              - type: token-load-scorer
              # publishes llm_d_epp_inflight_tokens -- the prefill trigger's only source
              - type: inflight-load-producer
              - type: approx-prefix-cache-producer
              - type: prefix-cache-affinity-filter
                parameters:
                  # Keep in sync with eppKedaSaturation.scaledObject.peakPrefillThroughput
                  # below. The router prices recompute-vs-reuse with this; the KEDA
                  # prefill trigger converts tokens to seconds with it. They must agree.
                  peakPrefillThroughput: 15845
              schedulingProfiles:
              - name: prefill
                plugins:
                - pluginRef: prefill-filter
                - pluginRef: prefix-cache-affinity-filter
                - pluginRef: token-load-scorer
              - name: decode
                plugins:
                - pluginRef: decode-filter
                - pluginRef: active-request-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        proxy:
          # CLI args for the Envoy sidecar. Override the chart's defaults of
          # `--log-level trace` (very expensive under load) and no `--concurrency`
          # (Envoy spawns ~hardware_concurrency() worker threads, oversubscribing
          # the cgroup's CPU slice). `--concurrency 8` matches the resources.limits
          # equivalent below; trace-level logging would burn a meaningful share of
          # the sidecar's CPU at high QPS.
          args:
            - "--service-node"
            - "envoy-sidecar"
            - "--log-level"
            - "warn"
            - "--concurrency"
            - "8"
            - "--drain-strategy"
            - "immediate"
            - "--drain-time-s"
            - "60"
            - "-c"
            - "/etc/envoy/envoy.yaml"
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        inferencePool:
          failureMode: "FailOpen"
          providerConfig:
            destinationRule:
              trafficPolicy:
                connectionPool:
                  http:
                    http1MaxPendingRequests: 256000
                    maxRequestsPerConnection: 256000
                    http2MaxRequests: 256000
                    idleTimeout: "900s"
                  tcp:
                    maxConnections: 256000
                    maxConnectionDuration: "1800s"
                    connectTimeout: "900s"
        # matchLabels intentionally omitted: pd-disaggregation.yaml hardcodes
        # llm-d.ai/guide: "pd-disaggregation" here because ITS scenario name is
        # literally "pd-disaggregation", so the InferencePool selector happens to
        # match. This scenario's name is different (see `_ms_guide_label` in
        # 13_ms-values.yaml.j2 -- pods are labeled with the scenario name, not
        # this string), so a copied-over hardcoded value here would leave the
        # InferencePool selecting zero pods ("no pods available in datastore").
        # Leaving matchLabels unset falls back to render_plans.py's
        # _normalize_router_block default (llm-d.ai/inferenceServing +
        # llm-d.ai/model), which correctly matches both prefill and decode pods
        # regardless of scenario name -- the same default keda-epp-token-aware.yaml
        # relies on.
        modelServers:
          protocol: http
        tracing:
          otelExporterEndpoint: "http://localhost:4317"
          sampling:
            sampler: "parentbased_traceidratio"
            samplerArg: "0.1"

      # -------------------------------------------------------------------------
      # HTTPRoute Configuration
      # -------------------------------------------------------------------------
      httpRoute:
        requestTimeout: "300s"
        backendRequestTimeout: "0s"

      # -----------------------------------------------------------------------
      # Shared role configuration
      # Prefill and decode run the same container with the same NIXL transport
      # and the same capabilities, so that shape is stated once. What genuinely
      # differs between them -- how many replicas, how wide, how much memory,
      # the launch command, and decode's metrics port -- each role states for
      # itself below, and a key a role names wins over the value here.
      # -----------------------------------------------------------------------
      roleDefaults:
        initContainers:
          - name: preprocess
            imageKey: benchmark
            imagePullPolicy: Always
            command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
            volumeMounts:
              - name: shared-config
                mountPath: /shared-config

        extraEnvVars:
          # NixlConnector publishes this address to its peer as where the KV
          # blocks can be read from, and takes it from the environment rather
          # than the launch line. vLLM defaults it to `localhost`, which the
          # other pod cannot reach.
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: NCCL_EXCLUDE_IB_HCA
            value: ""
          - name: NVSHMEM_DEBUG
            value: "none"
          - name: NCCL_DEBUG
            value: "WARN"
          - name: NIXL_LOG_LEVEL
            value: debug
          - name: UCX_MAX_RMA_RAILS
            value: "1"
          # Disables NVLink SHARP (NVLS) collectives, which require an
          # initialized Fabric Manager.
          - name: NCCL_NVLS_ENABLE
            value: "0"

        extraContainerConfig:
          securityContext:
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_RAWIO"
                - "NET_ADMIN"
                - "NET_RAW"
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always

        additionalVolumeMounts: []
        additionalVolumes: []

      # -------------------------------------------------------------------------
      # Prefill Configuration -- unchanged from pd-disaggregation.yaml.
      # -------------------------------------------------------------------------
      prefill:
        enabled: true
        replicas: 1
        engine:
          # The launch command, verbatim. Paste in a line that already works for
          # you and it runs unchanged; the only flag llm-d-benchmark reads is
          # `--port`, because the container port and the probes have to name an
          # endpoint before the process exists.
          #
          # A prefill pod never gets the routing sidecar (the chart injects it
          # only on decode), so prefill binds `engine.servicePort` (8000)
          # itself -- which is also where decode's NIXL transfer reaches it.
          #
          # `--max-num-batched-tokens` MUST stay equal to the calibration's
          # CHUNK_SIZE and to `model.maxNumBatchedTokens` above: a larger chunk
          # is prefilled in several passes, so the measured TTFT is not one
          # prefill pass and peakPrefillThroughput is silently wrong.
          command: |
            vllm serve Qwen/Qwen3-32B \
            --host 0.0.0.0 \
            --port 8000 \
            --block-size 128 \
            --max-model-len 16384 \
            --max-num-seqs 256 \
            --max-num-batched-tokens 8192 \
            --tensor-parallel-size 1 \
            --gpu-memory-utilization 0.90 \
            --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
            --disable-uvicorn-access-log \
            --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
            --no-enable-prefix-caching \
            --dtype bfloat16 \
            --no-disable-hybrid-kv-cache-manager

        parallelism:
          tensor: 1
          data: 1
          dataLocal: 1
          workers: 1

        resources:
          limits:
            memory: 16Gi
            cpu: "8"
          requests:
            memory: 16Gi
            cpu: "8"

      # -------------------------------------------------------------------------
      # Decode Configuration
      # replicas: 1 (down from pd-disaggregation.yaml's 2) -- start at the
      # eppKedaSaturation minReplicaCount floor and let the autoscaler drive
      # any scale-up, matching keda-epp-token-aware.yaml's decode.replicas: 1.
      # extraContainerConfig.ports / monitoring.podmonitor are NEW relative to
      # pd-disaggregation.yaml, which ships with no pod monitoring (see its own
      # header comment) -- the named "metrics" containerPort is what lets the
      # PodMonitor below actually resolve a scrape target (18_podmonitor.yaml.j2
      # selects podMetricsEndpoints[].port by container-port NAME, not number).
      # -------------------------------------------------------------------------
      decode:
        replicas: 1
        engine:
          # Same verbatim contract as prefill. Decode binds 8200, not 8000:
          # the routing sidecar the chart injects on decode pods listens on
          # `engine.servicePort` (8000) and forwards here. 8200 is also the
          # container port the PodMonitor below scrapes by name.
          command: |
            vllm serve Qwen/Qwen3-32B \
            --host 0.0.0.0 \
            --port 8200 \
            --block-size 128 \
            --max-model-len 16384 \
            --max-num-seqs 256 \
            --max-num-batched-tokens 8192 \
            --tensor-parallel-size 2 \
            --gpu-memory-utilization 0.90 \
            --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
            --disable-uvicorn-access-log \
            --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
            --no-enable-prefix-caching \
            --dtype bfloat16 \
            --no-disable-hybrid-kv-cache-manager

        parallelism:
          tensor: 2
          data: 1
          dataLocal: 1
          workers: 1

        resources:
          limits:
            memory: 128Gi
            cpu: "32"
          requests:
            memory: 128Gi
            cpu: "32"

        # The only container-level difference from roleDefaults: the named
        # "metrics" port the PodMonitor resolves its scrape target by. Naming
        # `ports` here replaces roleDefaults' block for decode, so the
        # securityContext it needs is restated with it.
        extraContainerConfig:
          ports:
            - containerPort: 8200
              name: metrics
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_RAWIO"
                - "NET_ADMIN"
                - "NET_RAW"
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always

        # Leave this chart-level PodMonitor OFF (inherits monitoring.podmonitor.
        # enabled: false from defaults.yaml) -- the top-level monitoring.podmonitor
        # (defaults.yaml: enabled: true) already renders 18_podmonitor.yaml.j2's
        # standalone PodMonitor (vllm-<model_id_label>), which matches every pod
        # carrying llm-d.ai/inferenceServing + llm-d.ai/model, decode included.
        # Turning this one on too double-scrapes every decode pod under two
        # different `job` labels, so sum(vllm:kv_cache_usage_perc{...}) -- the
        # decode KEDA trigger's own query -- legitimately adds both series and
        # reports ~2x real KV usage (the 0.8 threshold is effectively crossed at
        # ~0.4 real KV). Same root cause and fix as the co-located scenario's
        # decode-KV double-count (#1973) -- verified live against this scenario:
        # `kubectl get podmonitor` showed both `<model>-decode-podmonitor` and
        # `vllm-<model_id_label>` selecting the same decode pods.
        monitoring:
          podmonitor:
            enabled: false

    # =========================================================================
    # EPP+KEDA TOKEN-AWARE AUTOSCALING -- P/D-disaggregated: one ScaledObject
    # per Deployment via scaledObject.targets. minReplicas/maxReplicas/behavior
    # are shared defaults for both targets here (both currently want the same
    # 1..4 range and the same scaleUp/scaleDown behavior); override per-target
    # if you want asymmetric ceilings later (e.g. prefill TP=1 could run a
    # higher replica ceiling than decode TP=2 for the same GPU budget).
    # =========================================================================
    eppKedaSaturation:
      enabled: true

      prometheus:
        baseUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local
        port: 9091

      scaledObject:
        # Distinguishes this from the saturation variant in `kubectl get hpa`.
        nameSuffix: token-aware

        # PLACEHOLDER -- see the "BEFORE YOU RUN" note at the top of this file.
        # Borrowed from keda-epp-token-aware.yaml's own measurement (Qwen3-32B /
        # H100-80GB / TP=2, co-located), NOT measured through this P/D path.
        # Keep equal to the router plugin's peakPrefillThroughput above.
        peakPrefillThroughput: 15845

        minReplicas: 1
        maxReplicas: 4          # prefill TP=1 -> 4 accelerators; decode TP=2 -> 8

        behavior:
          # Weights take minutes to load, so a replica bought on a burst that
          # drains in seconds is pure cost.
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300

        targets:
          # -- PREFILL: seconds of uncached prefill backlog, THIS pool only ---
          # endpoint_name filter isolates prefill endpoints from decode's, since
          # both roles' EPP-published series otherwise share the same namespace.
          - role: prefill
            triggers:
              - name: prefill-backlog-seconds
                metricType: AverageValue
                query: |
                  (
                    sum(llm_d_epp_inflight_tokens{namespace="${namespace}",
                                                  producer_name="inflight-load-producer",
                                                  endpoint_name=~".*prefill.*"})
                    / ${peakPrefillThroughput}
                  ) or vector(0)
                threshold: "1.5"
                activationThreshold: "0"

          # -- DECODE: pods' worth of full KV cache, decode pods only ---------
          - role: decode
            triggers:
              - name: decode-kv-utilization
                metricType: AverageValue
                query: |
                  sum(vllm:kv_cache_usage_perc{namespace="${namespace}", pod=~".*decode.*"}) or vector(0)
                threshold: "0.8"
                activationThreshold: "0"

    harness:
      name: inference-perf
      # random_symmetrical.yaml is the crossover case; swap for
      # random_prefill_heavy.yaml / random_decode_heavy.yaml, or sweep all
      # three via experiments/token-aware-autoscaling.yaml. Open-loop Poisson
      # load only -- every *_concurrent* profile pegs inflight_tokens at
      # concurrency x ISL regardless of capacity and is unusable here.
      experimentProfile: random_symmetrical.yaml

    workDir: "~/data/keda-epp-token-aware-pd-disaggregation"

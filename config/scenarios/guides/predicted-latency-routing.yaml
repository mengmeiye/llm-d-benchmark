# PREDICTED LATENCY ROUTING WELL LIT PATH for LLM-D Deployment
# Based on https://github.com/llm-d/llm-d/tree/main/guides/predicted-latency-routing
#
# Notes:
# - Removed pod monitoring; can be added using decode.extraContainerConfig
# - Removed extra volumes metrics-volume and torch-compile-volume (not needed for this model/hardware)
# - Use decode.additionalVolumeMounts and decode.additionalVolumes to add them if needed

scenario:
  # ============================================================================
  # Predicted Latency Based Scheduling - Qwen3-32B with 2 decode pods
  # ============================================================================
  - name: "predicted-latency-routing"

    common:
      # -------------------------------------------------------------------------
      # Affinity / Node Selection
      # By default, affinity is disabled and pods schedule on any available node.
      # Options:
      #   1. Leave commented out -- no node selection constraint
      #   2. Set nodeSelector to "auto" -- auto-detects GPU labels from the cluster
      #   3. Set explicit labels -- pods only schedule on matching nodes
      # -------------------------------------------------------------------------
      # affinity:
      #   enabled: true
      #   nodeSelector:
      #     nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3      # OpenShift
      #     # gpu.nvidia.com/model: H200                        # Kubernetes
      #     # cloud.google.com/gke-accelerator: nvidia-h100-80gb  # GKE
      # -------------------------------------------------------------------------
      # Model Configuration
      # -------------------------------------------------------------------------
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: qwen-qwen3-32b
        size: 1Ti
        # maxModelLen / blockSize / gpuMemoryUtilization are deliberately NOT
        # set here: they are pure engine parameters, so they are stated in the
        # launch command below and read back out for the capacity planner.

      # -------------------------------------------------------------------------
      # Storage Configuration
      # -------------------------------------------------------------------------
      storage:
        modelPvc:
          size: 1Ti

      engine:
        # Sourced before the engine command, in the same shell: the `preprocess`
        # initContainer below writes this file with the network facts only the
        # node can tell us (RDMA/IB device names, GID index) plus the CUDA
        # library path. Engine commands never mention it.
        preprocessScript: ". /shared-config/llmdbench_env.sh"
        volumes:
          - name: shared-config
            type: emptyDir
            emptyDir: {}
          - name: dshm
            type: emptyDir
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi

        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: shared-config
            mountPath: /shared-config

    # =========================================================================
    # KUSTOMIZE DEPLOY METHOD   (scope: the ENTIRE stack)
    # -------------------------------------------------------------------------
    # When kustomize.enabled is true (or `-t kustomize` is passed) this
    # scenario is deployed by applying the UPSTREAM llm-d guide directly
    # (guides/<guideName> in the llm-d repo). In that mode the deployment is
    # defined ENTIRELY by the guide's own manifests:
    #
    #   * EVERYTHING ELSE in this scenario is IGNORED -- model, modelservice,
    #     standalone, decode/prefill, engine, storage, harness model, etc.
    #   * `-m/--models` and all other CLI/scenario tuning are ignored.
    #   * DoE `experiment` SETUP sweeps do NOT alter a kustomize deploy
    #     (only run/workload treatments still apply).
    #
    # The ONLY way to modify a kustomize deployment is the kustomize.* keys
    # below:
    #   patches / overlayPath           -> modelserver (the workload pods)
    #   extraHelmValues / extraHelmSets -> router / GAIE helm release
    #   guideVariableOverrides          -> override the guide README's ${VAR}
    # See docs/kustomize.md for the full reference and worked examples.
    #
    # NOT SUPPORTED with kustomize: multi-model / multi-stack scenarios
    # (the deploy is keyed on guideName with no per-stack uniquification --
    # stacks would collide). Use the modelservice method for multi-model.
    #
    # When kustomize.enabled is false (the DEFAULT) this whole block is
    # inert and the scenario deploys via modelservice/standalone as
    # configured further below.
    # =========================================================================
    kustomize:
      enabled: false

      guideName: "predicted-latency-routing"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      acceleratorBackend: "gpu/vllm"
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides: {}   # override/fill the guide README's ${VAR}

      # Inline kustomize strategic merge patches applied on top of the
      # guide's modelserver base.  For gated models, add an HF_TOKEN
      # env var patch (the secret is auto-created from HF_TOKEN env):
      # Default is empty -- upstream guide already injects HF_TOKEN from
      # the `llm-d-hf-token` Secret (auto-created by standup). Add entries
      # here only for non-token overrides (e.g. bump replicas, pin a
      # priorityClassName) -- see optimized-baseline.yaml for an example.
      patches: []

    # =========================================================================
    # MODELSERVICE -- Only applies when modelservice.enabled: true
    # The following sections configure the llm-d modelservice Helm chart
    # deployment including decode pods, prefill pods, router, and gateway.
    # =========================================================================
    modelservice:
      enabled: true

      gateway:
        className: epponly

      # -------------------------------------------------------------------------
      # Routing / GAIE Configuration
      # -------------------------------------------------------------------------
      router:
        latencyPredictor:
          enabled: true
          # The training and prediction servers run as sidecars on the router
          # pod. The chart (v0.10.0) points both at
          # ghcr.io/llm-d/llm-d-latency-predictor-{training,prediction}-server
          # at its own version, v0.10.0 -- a tag neither repository publishes.
          # Inherited, they leave the router pod in ImagePullBackOff and the
          # stack never comes up.
          #
          # v0.8.0 is the tag to pin, not the higher-numbered 0.9.0 those
          # repositories also carry. The chart hardcodes the prediction
          # sidecar's launch line as `uvicorn
          # llm_d_latency_predictor.prediction_server:app` with no values hook,
          # and only the v0.8.x images ship that module path -- 0.9.0, latest
          # and main are a separate lineage that still spells it
          # `prediction.prediction_server`, so they pull fine and then exit 1.
          # v0.8.0 is also what the chart's next release (v0.11.0-rc.2)
          # defaults both sidecars to, so this is the pin catching up with the
          # chart rather than diverging from it. Delete both blocks once
          # chartVersions.llmDRouter moves past v0.10.0.
          trainingServer:
            image:
              tag: "v0.8.0"
          predictionServers:
            image:
              tag: "v0.8.0"
        extraServicePorts:
          - name: http
            port: 80
            protocol: TCP
            targetPort: 8081
        epp:
          replicas: 1
          flags:
            v: 2
          pluginsConfigFile: "predicted-latency-plugins.yaml"
          pluginsCustomConfig:
            predicted-latency-plugins.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: approx-prefix-cache-producer
                parameters:
                  # Sized for the 256K-context TPU agentic case (Qwen3-Coder-480B): matching longer
                  # prefixes raises the cache-hit rate on long, shared agentic prompts. Tradeoff: it
                  # increases per-request prefix-matching work and EPP memory/CPU, most noticeably at
                  # high concurrency with very long contexts. For shorter-context GPU/default
                  # workloads a smaller value (e.g. 131072, or the chart default) is cheaper and
                  # sufficient — lower it to match your max prompt length.
                  maxPrefixTokensToMatch: 262144
              - type: predicted-latency-producer
              - type: prefix-cache-affinity-filter
                name: loose-affinity-filter
                parameters:
                  affinityThreshold: 0.8
              - type: latency-scorer
              - type: weighted-random-picker
              schedulingProfiles:
              - name: default
                plugins:
                - pluginRef: predicted-latency-producer
                - pluginRef: loose-affinity-filter
                - pluginRef: latency-scorer
                - pluginRef: weighted-random-picker
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        proxy:
          # CLI args for the Envoy sidecar. Override the chart's defaults of
          # `--log-level trace` (very expensive under load) and no `--concurrency`
          # (Envoy spawns ~hardware_concurrency() worker threads, oversubscribing
          # the cgroup's CPU slice). `--concurrency 8` matches the resources.limits
          # equivalent below; trace-level logging would burn a meaningful share of
          # the sidecar's CPU at high QPS.
          args:
            - "--service-node"
            - "envoy-sidecar"
            - "--log-level"
            - "warn"
            - "--concurrency"
            - "8"
            - "--drain-strategy"
            - "immediate"
            - "--drain-time-s"
            - "60"
            - "-c"
            - "/etc/envoy/envoy.yaml"
          # Resource requests and limits for the Envoy sidecar.
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
        inferencePool:
          failureMode: "FailOpen"
          providerConfig:
            destinationRule:
              trafficPolicy:
                connectionPool:
                  http:
                    http1MaxPendingRequests: 256000
                    maxRequestsPerConnection: 256000
                    http2MaxRequests: 256000
                    idleTimeout: "900s"
                  tcp:
                    maxConnections: 256000
                    maxConnectionDuration: "1800s"
                    connectTimeout: "900s"
        modelServers:
          protocol: http
          matchLabels:
            llm-d.ai/guide: "predicted-latency-routing"
        tracing:
          otelExporterEndpoint: "http://localhost:4317"
          sampling:
            sampler: "parentbased_traceidratio"
            samplerArg: "0.1"

      # -------------------------------------------------------------------------
      # HTTPRoute Configuration
      # requestTimeout: end-to-end Gateway-API HTTPRoute timeout the istio
      # gateway enforces per request. Long agentic turns that exceed it are
      # aborted by the gateway with a 502 (surfaces as "connection reset by
      # peer" on the decode routing-proxy loopback hop). Set "0s" to disable.
      # -------------------------------------------------------------------------
      httpRoute:
        requestTimeout: "300s"
        backendRequestTimeout: "0s"

      # -------------------------------------------------------------------------
      # Prefill Configuration
      # -------------------------------------------------------------------------
      prefill:
        enabled: false
        replicas: 0

      # -------------------------------------------------------------------------
      # Decode Configuration
      # -------------------------------------------------------------------------
      decode:
        replicas: 2
        # Verbatim launch command. llm-d-benchmark only reads the port and
        # capacity inputs needed by the surrounding infrastructure.
        #
        # Decode binds 8200, not 8000: the routing sidecar the chart injects on
        # decode pods owns `engine.servicePort` (8000) and forwards here. In
        # direct mode (`gateway.className: none`) there is no sidecar -- bind
        # 8000 then.
        #
        # Every flag is written out, with the value the engine will receive.
        # This command is the CUDA one, because that is what this guide is
        # validated on; hardware that needs a different command gets its own
        # scenario file rather than a substitution point per difference
        # (config/scenarios/examples/{intel-xpu,spyre,cpu}.yaml).
        engine:
          command: |
            vllm serve Qwen/Qwen3-32B \
            --host 0.0.0.0 \
            --port 8200 \
            --max-model-len 16000 \
            --max-num-seqs 256 \
            --max-num-batched-tokens 256 \
            --tensor-parallel-size 1 \
            --block-size 64 \
            --gpu-memory-utilization 0.95 \
            --dtype bfloat16 \
            --no-enable-log-requests \
            --disable-uvicorn-access-log \
            --disable-access-log-for-endpoints=/health,/metrics,/v1/models

        initContainers:
          - name: preprocess
            imageKey: benchmark
            imagePullPolicy: Always
            command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
            volumeMounts:
              - name: shared-config
                mountPath: /shared-config


        # Resource configuration
        resources:
          limits:
            memory: 64Gi
            cpu: "16"
          requests:
            memory: 64Gi
            cpu: "16"

        # -----------------------------------------------------------------------
        # Extra Environment Variables
        # No environment variables for this scenario. Nothing is auto-populated:
        # whatever the engine -- or a library beneath it (UCX_*, NCCL_*,
        # VLLM_NIXL_*, ...) -- needs must be listed here, the same way the
        # engine command lists its own flags.
        # -----------------------------------------------------------------------
        extraEnvVars: []

        # -----------------------------------------------------------------------
        # Extra Container Configuration
        # -----------------------------------------------------------------------
        extraContainerConfig:
          ports:
            - containerPort: 5557  # NIXL side channel port
              protocol: TCP
            - containerPort: 8200  # Metrics port
              name: metrics
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - "IPC_LOCK"
                - "SYS_RAWIO"
            runAsGroup: 0
            runAsUser: 0
          imagePullPolicy: Always

        # -----------------------------------------------------------------------
        # Additional Volume Mounts
        # -----------------------------------------------------------------------
        additionalVolumeMounts: []

        # -----------------------------------------------------------------------
        # Additional Volumes
        # -----------------------------------------------------------------------
        additionalVolumes: []

    # =========================================================================
    # WORKLOAD / HARNESS -- Benchmark execution configuration
    # =========================================================================
    harness:
      name: inference-perf
      experimentProfile: shared_prefix_synthetic.yaml

    workDir: "~/data/optimized-baseline"

# OpenShift Container Platform CI/CD Scenario
#
# CI/CD scenario for OpenShift clusters.
# Uses Qwen/Qwen3-8B so the standalone baseline and FMA nightlies exercise a
# representative model whose cold start is measurable.
# GPU affinity is auto-detected (commented out in original).

scenario:
  - name: "ocp-cicd"

    common:
      acceleratorType:
        labelKey: nvidia.com/gpu.product
        # labelValue: NVIDIA-L40S
        labelValue: NVIDIA-H100-80GB-HBM3
      # Model
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: qwen-qwen3-8b
        # Keeping it similar to FMA launcher's vLLM (24_fma-deployment.yaml.j2)
        maxModelLen: 40960
        blockSize: 16

      affinity:
        enabled: true
        nodeSelector:
          # nvidia.com/gpu.product: NVIDIA-L40S
          nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3

      # storage:
      #   modelPvc:
      #     storageClassName: ocs-storagecluster-cephfs
      #   workloadPvc:
      #     storageClassName: ocs-storagecluster-cephfs

      engine:
        priorityClassName: nightly-gpu-critical

      images:
        benchmark:
          repository: ghcr.io/llm-d/llm-d-benchmark
          tag: nightly

    standalone:
      enabled: false

    # Deployment method
    modelservice:
      enabled: true

      prefill:
        enabled: true
        replicas: 1
        engine:
          command: |
            vllm serve Qwen/Qwen3-8B \
            --port 8000 \
            --no-enable-prefix-caching

      decode:
        enabled: true
        replicas: 1
        acceleratorType:
          labelKey: nvidia.com/gpu.product
          # labelValue: NVIDIA-L40S
          labelValue: NVIDIA-H100-80GB-HBM3
        # The command reaches the container verbatim -- paste the line you
        # would run by hand. Two things this CI job needs from it:
        #   * --port 8200, because the routing sidecar owns the Service port
        #     (8000) on a decode pod and forwards here.
        #   * --no-enable-prefix-caching, so a nightly comparison is not
        #     measuring a warm prefix cache. torch.compile and CUDA-graph
        #     capture are deliberately left on (no --enforce-eager): without
        #     them the Dynamo / Torch Compile / Memory Profiling metrics this
        #     job collects are all zero, since those phases never run.
        engine:
          command: |
            vllm serve Qwen/Qwen3-8B \
            --port 8200 \
            --no-enable-prefix-caching

    fma:
      enabled: false
      iterations: 10


    harness:
      name: vllm-benchmark
      experimentProfile: sanity_random.yaml
      # executable: llm-d-benchmark.py

    workDir: /tmp/llmdbenchcicd-ocp/
# Kind Simulated Accelerators CI/CD Scenario
#
# CI/CD scenario for Kind clusters using llm-d-inference-sim.
# No GPU required -- runs inference simulation on CPU-only nodes.
# Uses facebook/opt-125m with minimal resource requirements.
#
# How inference-sim works with the modelservice Helm chart:
#
#   The llm-d-modelservice chart detects "llm-d-inference-sim" in the image
#   name and returns an empty accelerator resource, so no GPU limits/requests
#   are added to the pod spec.  This allows the sim to run on CPU-only nodes.
#
#   The routing proxy sidecar is injected into decode pods only (never into
#   prefill pods), and it owns the Service port 8000, so a decode engine that
#   runs behind it has to listen somewhere else -- the llm-d convention is
#   8200.  Which port a role listens on is stated by that role, not inferred:
#   a role with a command says so with `--port`, and a role running the image's
#   own entrypoint takes whatever port that entrypoint binds.
#
#   This scenario turns the sidecar off (`routing.proxy.enabled: false`), which
#   is what lets every role here keep the sim entrypoint's own port 8000 and
#   pass no arguments at all.  Leaving the sidecar on would mean giving decode
#   an explicit `--port 8200`, which the sim's `args` list can do but its bare
#   entrypoint cannot.

scenario:
  - name: "kind-sim-cicd"
    common:
      # No GPU accelerators
      accelerator:
        count: 0
        memory: 24 # To pass capacity planner sanity checking

      # No GPU on Kind -- use OS label instead of nvidia GPU selector
      acceleratorType:
        labelKey: kubernetes.io/os
        labelValue: linux

      # CPU-only affinity
      affinity:
        enabled: true
        nodeSelector:
          kubernetes.io/os: linux

      # Model
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: facebook-opt-125m
        maxModelLen: 1024
        gpuMemoryUtilization: 0

      # Storage -- minimal for Kind
      # Kind uses 'standard' storage class with ReadWriteOnce only
      storage:
        modelPvc:
          accessModes:
            - ReadWriteOnce
          storageClassName: standard
          size: 2Gi
        workloadPvc:
          accessModes:
            - ReadWriteOnce
          storageClassName: standard
          size: 3Gi

      # Override images for simulation
      images:
        vllm:
          repository: ghcr.io/llm-d/llm-d-inference-sim
          tag: v0.8.2

      # Minimal resources for Kind cluster
      engine:
        shmMemory: 500Mi

      # Install Prometheus CRDs on Kind (no Prometheus Operator by default)
      monitoring:
        installPrometheusCrds: true

      control:
        waitTimeout: 20

    # -------------------------------------------------------------------------
    # Shared role configuration
    # Every role in this scenario runs the same sim container with the same
    # footprint, so the shape is stated once. Each role below carries only what
    # it does differently -- how its container is launched. A key a role names
    # for itself wins over the value here.
    # -------------------------------------------------------------------------
    roleDefaults:
      replicas: 1

      resources:
        limits:
          memory: 100Mi
          cpu: "0"
        requests:
          memory: 100Mi
          cpu: "0"

    # Standalone deployment config (disabled -- deploy method is modelservice)
    # Standalone config is kept as fallback for standalone testing
    standalone:
      enabled: false

      # llm-d-inference-sim, not a real engine: the image entrypoint is the
      # launcher, so this role passes an argument list instead of a command.
      # `command: ""` is what selects that -- it drops the inherited default
      # `vllm serve` line and emits `args:` without a `command:` override. The
      # sim image is distroless and has no shell to exec.
      engine:
        command: ""
        args:
          - "--model"
          - "facebook/opt-125m"
          - "--port"
          - "8000"

    # Modelservice configuration
    modelservice:
      enabled: true
      uriProtocol: hf

      # Minimal gateway resources for Kind -- agentgateway is a lightweight
      # Envoy-based proxy; on a single-node Kind cluster we keep this lean
      # so EPP, model-server pods, and the gateway can all schedule together.
      gateway:
        className: epponly
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "250m"
            memory: 256Mi

      routing:
        proxy:
          enabled: false

      # Minimal EPP + Envoy resources for Kind. The llm-d-router chart's
      # upstream defaults (EPP: 4 CPU / 8 GiB req, 16 GiB limit; Envoy
      # sidecar: same) won't fit on a Kind node; both are stateless and
      # this is plenty for CI.
      #
      # `router.proxy` is only honored by the chart when
      # `gateway.className: epponly` (the standalone-mode topology
      # where the Envoy sidecar runs inside the EPP pod).
      router:
        epp:
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

        proxy:
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi

      # Decode configuration -- use image's default entrypoint (inference-sim)
      decode:
        parallelism:
          tensor: 0
          data: 1
          dataLocal: 1
          workers: 1

        # The sim image launches itself -- see `standalone.engine` above.
        # No args either: the entrypoint's own defaults serve on 8000, which is
        # what this stack needs, since `routing.proxy.enabled: false` means
        # there is no sidecar holding the Service port in front of decode.
        engine:
          command: ""

      # Prefill configuration -- use image's default entrypoint (inference-sim)
      prefill:
        enabled: true

        parallelism:
          tensor: 0
          data: 1
          dataLocal: 1
          workers: 1

        # The sim image launches itself; its default port is 8000, which is
        # what a prefill pod binds (it never gets a routing sidecar).
        engine:
          command: ""

    # Workload -- minimal resources for Kind
    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
      resources:
        cpu: "1"
        memory: 2Gi
#      executable: llm-d-benchmark.py

    # FMA deployment config (disabled -- deploy method is modelservice)
    # FMA config is kept as fallback for fma testing
    fma:
      enabled: false

    workDir: /tmp/llmdbenchcicd-kind/

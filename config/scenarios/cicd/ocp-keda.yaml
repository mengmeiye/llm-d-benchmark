# OpenShift CI/CD Scenario - EPP+KEDA baseline (no FMA)
#
# EPP-only (direct KEDA saturation autoscaling) baseline for the EPP+KEDA+FMA
# nightly's KEDA path. Derived from guides/epp-keda-saturation.yaml (all its
# settings preserved) with cicd conventions layered on: epponly gateway,
# enforceEager:false (matched to the FMA launcher for fair comparison),
# decode.replicas:1 (= KEDA minReplicas), a /tmp workDir, and the heavy load
# profile. `eppKedaSaturation.enabled: true` drives the KEDA saturation path
# directly via the KEDA ScaledObject.

scenario:
  # =========================================================================
  # EPP+KEDA SATURATION AUTOSCALING - Qwen3-32B with 2 decode pods
  # =========================================================================
  - name: "ocp-keda-cicd"

    # =========================================================================
    # MODEL CONFIGURATION
    # =========================================================================
    model:
      # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
      # The model id is a fact the launch command states; a short name is a
      # choice, so it stays here -- derived, it is a
      # `{first8}-{sha8}-{last8}` hash.
      shortName: qwen-qwen3-32b
      size: 1Ti

    # =========================================================================
    # DEPLOYMENT METHOD
    # =========================================================================
    modelservice:
      enabled: true

    standalone:
      enabled: false

    gateway:
      className: epponly

    # =========================================================================
    # EPP+KEDA SATURATION CONFIGURATION
    #
    # Direct KEDA autoscaling using EPP pool metrics. All thresholds and
    # behavior parameters are spelled out below so users can tweak them
    # per-experiment without editing defaults.yaml.
    # =========================================================================
    eppKedaSaturation:
      enabled: true

      namespace: ""              # defaults to deploy namespace (first slot of `-p`)

      prometheus:
        baseUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local
        port: 9091

      epp:
        poolName: ""             # defaults to model_id_label at render time
        metricsPortName: http-metrics
        metricsPort: 9090
        prometheusServiceAccount: thanos-querier
        prometheusServiceAccountNamespace: openshift-monitoring

      scaledObject:
        minReplicas: 1
        maxReplicas: 6
        pollingInterval: 15
        unsafeSsl: true
        # Triggers mirror the upstream llm-d workload-autoscaling KEDA guides.
        # Defaults (from defaults.yaml) scale on EPP pool-saturation (the
        # keda-epp-saturation guide). To scale on EPP queue size instead (the
        # keda-epp-queue guide), override triggers here:
        # triggers:
        #   - name: queue-size
        #     query: 'sum(llm_d_epp_flow_control_queue_size{model_name="${modelName}"})'
        #     threshold: "1"
        #   - name: running-requests
        #     query: 'sum(llm_d_epp_request_running{model_name="${modelName}"})'
        #     threshold: "16"
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              # Adjust periodSeconds to match actual pod startup time.
              # GPU hardware (H100/A100): 180 seconds
              # Simulator / kind cluster (fast startup): 30 seconds
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300

    # =========================================================================
    # ROUTING / GAIE CONFIGURATION
    #
    # Ship a custom EndpointPickerConfig to enable the `flowControl` feature
    # gate (off in the gaie chart's default) that EPP+KEDA autoscaling needs.
    # =========================================================================
    router:
      epp:
        pluginsConfigFile: "epp-keda-optimized-baseline.yaml"
        pluginsCustomConfig:
          epp-keda-optimized-baseline.yaml: |
            apiVersion: llm-d.ai/v1alpha1
            kind: EndpointPickerConfig
            featureGates:
              - flowControl
            plugins:
              - type: queue-scorer
              - type: kv-cache-utilization-scorer
              - type: prefix-cache-scorer
              - type: no-hit-lru-scorer
            schedulingProfiles:
              - name: default
                plugins:
                  - pluginRef: queue-scorer
                    weight: 2
                  - pluginRef: kv-cache-utilization-scorer
                    weight: 2
                  - pluginRef: prefix-cache-scorer
                    weight: 3
                  - pluginRef: no-hit-lru-scorer
                    weight: 2

    # =========================================================================
    # PREFILL / DECODE CONFIGURATION (same as optimized-baseline.yaml)
    # =========================================================================
    prefill:
      enabled: false
      replicas: 0

    decode:
      replicas: 1

      # The launch line, verbatim -- paste what you would run by hand. It is
      # read once for the facts Kubernetes needs before the engine starts
      # (--port sizes the container port and probes, the capacity flags feed
      # the pre-deploy check) and is otherwise passed through untouched.
      #
      # --port 8200: the routing sidecar owns the Service port (8000) on a
      # decode pod and forwards here. --enforce-eager is deliberately absent so
      # this arm matches the FMA launcher, which never sets it.
      engine:
        command: |
          vllm serve Qwen/Qwen3-32B \
          --host 0.0.0.0 \
          --port 8200 \
          --max-model-len 16000 \
          --block-size 64 \
          --gpu-memory-utilization 0.95 \
          --max-num-seqs 256 \
          --max-num-batched-tokens 256 \
          --tensor-parallel-size 1 \
          --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
          --no-enable-log-requests \
          --disable-uvicorn-access-log

      initContainers:
        - name: preprocess
          imageKey: benchmark
          imagePullPolicy: Always
          command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
          volumeMounts:
            - name: shared-config
              mountPath: /shared-config

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1

      resources:
        limits:
          memory: 64Gi
          cpu: "16"
        requests:
          memory: 64Gi
          cpu: "16"

      # VLLM_ALLOW_LONG_MAX_MODEL_LEN and VLLM_SERVER_DEV_MODE are vLLM
      # environment variables, not flags -- they belong here, not in the
      # command. The dev-mode one is what exposes /reset_prefix_cache, which
      # `--reset-caches` POSTs between treatments.
      extraEnvVars:
        - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
          value: "1"
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        # NixlConnector publishes this address to its peer as where the KV blocks
        # can be read from, and takes it from the environment rather than the
        # launch line. vLLM defaults it to `localhost`, which no other pod can
        # reach -- the same declaration the llm-d guides make.
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

      extraContainerConfig:
        ports:
          - containerPort: 5557
            protocol: TCP
          - containerPort: 8200
            name: metrics
            protocol: TCP
        securityContext:
          capabilities:
            add:
              - "IPC_LOCK"
              - "SYS_RAWIO"
          runAsGroup: 0
          runAsUser: 0
        imagePullPolicy: Always

      additionalVolumeMounts: []
      additionalVolumes: []

      probes:
        startup:
          path: /v1/models
          failureThreshold: 60
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        liveness:
          path: /health
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 5
        readiness:
          path: /v1/models
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 2

      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 30s
          labels:
            release: llmd

    # =========================================================================
    # ENGINE CONFIGURATION (pod shape shared by every role)
    #
    # Engine flags are not here: they are in the role's `engine.command`
    # above, in the engine's own spelling. What lives here is the pod shape
    # llm-d-benchmark builds around whatever engine runs.
    # =========================================================================
    engine:
      # Sourced before the engine command, in the same shell: the `preprocess`
      # initContainer below writes this file with the network facts only the
      # node can tell us (RDMA/IB device names, GID index) plus the CUDA
      # library path. Engine commands never mention it.
      preprocessScript: ". /shared-config/llmdbench_env.sh"
      volumes:
        - name: shared-config
          type: emptyDir
          emptyDir: {}
        - name: dshm
          type: emptyDir
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: shared-config
          mountPath: /shared-config

    # =========================================================================
    # STORAGE
    # =========================================================================
    storage:
      modelPvc:
        size: 1Ti

    # =========================================================================
    # WORKLOAD / HARNESS
    # =========================================================================
    # Enable metrics scraping (collect_metrics.sh in the harness):
    # captures requester replica counts + EPP KV-cache/queue-depth gauges into
    # results/metrics/..
    monitoring:
      metricsScrapeEnabled: true

    workDir: "/tmp/llmdbenchcicd-ocp-keda/"

    harness:
      name: inference-perf
      # Heavy variant -- matched RPS across the baseline and FMA passes.
      experimentProfile: shared_prefix_synthetic_heavy.yaml
      waitTimeout: 5400

    # Match the FMA passes' benchmark image.
    images:
      benchmark:
        tag: nightly

# GKE H100 CI/CD Scenario
#
# CI/CD scenario for Google Kubernetes Engine clusters with H100 GPUs.
# Uses the default model (facebook/opt-125m) for fast validation.
# PR 868: GKE fix for v0.5.1 llm-d-cuda image -- LD_LIBRARY_PATH
# set inline in custom commands instead of via extraEnvVars.

scenario:
  - name: "gke-cicd"

    common:
      acceleratorType:
        labelKey: cloud.google.com/gke-accelerator
        labelValue: nvidia-h100-80gb
      affinity:
        enabled: true
        nodeSelector:
          cloud.google.com/gke-accelerator: nvidia-h100-80gb
      # Model
      model:
        # This stack's Kubernetes name prefix (Deployments, Services, PVCs).
        # The model id is a fact the launch command states; a short name is a
        # choice, so it stays here -- derived, it is a
        # `{first8}-{sha8}-{last8}` hash.
        shortName: facebook-opt-125m
      # Storage
      storage:
        modelPvc:
          storageClassName: standard-rwx
          size: 1Ti
        workloadPvc:
          storageClassName: standard-rwx
      images:
        benchmark:
          repository: ghcr.io/llm-d/llm-d-benchmark
          tag: nightly
      engine:
        priorityClassName: nightly-gpu-critical

    # Standalone with GKE LD_LIBRARY_PATH (nvidia path, not cuda compat)
    standalone:
      enabled: false
      # No engine.command: `-t standalone` inherits decode's line below, which
      # is the same engine serving the same model without the router in front
      # of it. The copy that used to live here had already drifted from decode's
      # -- it still passed `--load-format auto` and `--max-num-seqs 256`, and
      # had lost the `--no-enable-log-requests` that decode carries.
      # The `--port 8200` it inherits needs no rewriting: the Service targets
      # whatever the command binds.

    # Deployment method
    modelservice:
      enabled: true
      # Disable monitoring for CI/CD
      router:
        monitoring:
          prometheus:
            enabled: false

      # Decode configuration with GKE-specific custom command
      # LD_LIBRARY_PATH is set inline because the llm-d-cuda image
      # needs the CUDA compat library path on GKE nodes.
      decode:
        enabled: true
        acceleratorType:
            labelKey: cloud.google.com/gke-accelerator
            labelValue: nvidia-h100-80gb
        replicas: 1
        # --port 8200: the routing sidecar owns the Service port (8000) on a
        # decode pod and forwards here.
        engine:
          command: |
            export LD_LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | sed ':a; N; $!ba; s/\n/:/g'):${LD_LIBRARY_PATH}
            export LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | head -1):${LIBRARY_PATH}
            vllm serve facebook/opt-125m \
            --host 0.0.0.0 \
            --port 8200 \
            --block-size 16 \
            --max-model-len 4096 \
            --tensor-parallel-size 1 \
            --gpu-memory-utilization 0.95 \
            --no-enable-log-requests \
            --disable-uvicorn-access-log \
            --no-enable-prefix-caching

      # Prefill with same GKE LD_LIBRARY_PATH fix
      prefill:
        enabled: true
        replicas: 1
        # A prefill pod never gets a routing sidecar, so it binds the
        # Service port (8000) itself.
        engine:
          command: |
            export LD_LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | sed ':a; N; $!ba; s/\n/:/g'):${LD_LIBRARY_PATH}
            export LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | head -1):${LIBRARY_PATH}
            vllm serve facebook/opt-125m \
            --host 0.0.0.0 \
            --port 8000 \
            --block-size 16 \
            --max-model-len 4096 \
            --tensor-parallel-size 1 \
            --gpu-memory-utilization 0.95 \
            --no-enable-log-requests \
            --disable-uvicorn-access-log \
            --no-enable-prefix-caching

    fma:
      enabled: false
      iterations: 5
      launcher:
        customPreprocessCommands:
          - export LD_LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | sed ':a; N; $!ba; s/\n/:/g'):${LD_LIBRARY_PATH}
          - export LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | head -1):${LIBRARY_PATH}

    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
#      executable: llm-d-benchmark.py

    workDir: /tmp/llmdbenchcicd-gke/

# ============================================================================
# Common Default Values for LLM-D Deployment
# These can be completely overridden via scenarios file.
# ============================================================================

# ============================================================================
# ANCHORS - Define reusable values here
# ============================================================================
_anchors:
  # Model identifiers
  model_name: &model_name facebook/opt-125m
  model_short_name: &model_short_name facebook-opt-125m
  model_path: &model_path models/facebook/opt-125m

  # Common ports.
  #   service_port  the port the Service/gateway exposes. Pure infrastructure:
  #                 no engine ever sees it. On decode pods the routing sidecar
  #                 listens here and forwards to the engine's port. A prefill
  #                 pod gets no sidecar, so its command binds this port itself.
  #
  # There is deliberately no anchor for the port an *engine* binds: that number
  # lives in the role's command (`--port 8200`) and nowhere else, so it cannot
  # drift from what the process actually listens on. 8200 is the llm-d
  # convention for a decode pod, because the sidecar already holds 8000 there.
  service_port: &service_port 8000
  ext_proc_port: &ext_proc_port 9002
  zmq_port: &zmq_port 5557
  rsync_port: &rsync_port 20873

  # Common resource values
  cpu_16: &cpu_16 "16"
  cpu_4: &cpu_4 "4"
  cpu_32: &cpu_32 "32"
  memory_64gi: &memory_64gi 64Gi
  memory_40gi: &memory_40gi 40Gi
  memory_16gi: &memory_16gi 16Gi
  memory_4gi: &memory_4gi 4Gi
  memory_128gi: &memory_128gi 128Gi
  memory_256gi: &memory_256gi 256Gi
  shm_16gi: &shm_16gi 16Gi
  shm_32gi: &shm_32gi 32Gi
  shm_64gi: &shm_64gi 64Gi

  # GPU configuration.
  # `gpu_label_value: auto` opts into cluster-side discovery: the resolver
  # (cluster_resource_resolver.py:_resolve_accelerator_type_labels) reads
  # actual node labels and overrides BOTH labelKey and labelValue in the
  # plan, so any GPU model works out of the box. Scenarios that need a
  # specific SKU can still pin a literal value (e.g. NVIDIA-H100-80GB-HBM3).
  gpu_label_key: &gpu_label_key nvidia.com/gpu.product
  gpu_label_value: &gpu_label_value auto
  gpu_memory_util: &gpu_memory_util 0.95

  # Container filesystem locations. Engine-neutral: every engine honours
  # HOME and HF_HOME, and nothing here is an engine parameter.
  container_home: &container_home /tmp
  hf_home: &hf_home /tmp/huggingface

  # Shell used to exec a role's engine command.
  engine_shell: &engine_shell "/bin/bash"

  # Common probe settings. No `path` here: a probe path is engine knowledge, so
  # it comes from the engine's own spec (llmdbenchmark/engine/spec.py, published
  # as `<role>.engine.healthPath`). Set `<role>.probes.<probe>.path` only for a
  # server that answers on neither its engine's path nor /health.
  #
  # `timeoutSeconds` is stated on every probe on purpose. Omitting it does not
  # mean "no deadline" -- the kubelet then applies its own default of 1 second,
  # and a health endpoint is not required to be that cheap: SGLang's /health
  # runs a real 64-token generation, so a one-second deadline turns the Ready
  # transition into a lottery (observed: the engine serving at t+179s while the
  # pod stayed NotReady until t+387s, and a 900s standup timeout on the next
  # run of the same scenario). 15s is the deadline the modelservice path has
  # always used; every role uses it now.
  probe_startup: &probe_startup
    failureThreshold: 60
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 15

  probe_liveness: &probe_liveness
    failureThreshold: 10
    periodSeconds: 5
    timeoutSeconds: 15

  probe_readiness: &probe_readiness
    failureThreshold: 10
    periodSeconds: 5
    timeoutSeconds: 15

  # Common parallelism
  parallelism_single: &parallelism_single
    data: 1
    dataLocal: 1
    tensor: 1
    workers: 1

  parallelism_4gpu: &parallelism_4gpu
    data: 1
    dataLocal: 1
    tensor: 4
    workers: 4

  parallelism_8gpu: &parallelism_8gpu
    data: 1
    dataLocal: 1
    tensor: 8
    workers: 8

  # Storage class: "auto"/"default" = use cluster default; set explicitly to override
  storage_class: &storage_class auto

  # Image pull policies
  pull_always: &pull_always Always
  pull_if_not_present: &pull_if_not_present IfNotPresent

  # General versions
  istio_version:                     &istio_version                     1.29.2
  agentgateway_version:              &agentgateway_version              v1.5.0
  lws_version:                       &lws_version                       v0.11.0

  # GAIE CRDs are still installed from the gateway-api-inference-extension
  # release (`v1.6.2`). The router chart below replaces the legacy
  # `inferencepool` / `standalone` charts from that release.
  gaie_version:                      &gaie_version                      v1.6.2
  # llm-d-router chart version (migrated off the GAIE-published
  # `inferencepool` / `standalone` charts onto the llm-d-owned
  # `llm-d-router-{gateway,standalone}-dev` charts in ghcr.io/llm-d/charts).
  # Used for both the standalone and gateway router charts.
  router_chart_version:              &router_chart_version              v0.11.0
  modelservice_chart_version:        &modelservice_chart_version        v0.4.16
  vllm-openai_version:               &vllm-openai_version               v0.30.0
  # Engine image pins for the non-vLLM engines, kept equal to what the llm-d
  # guides pin so a command copied from a guide runs against the image the
  # guide was written for:
  #   SGLang   guides/recipes/modelserver/components/images/gpu-sglang/release
  #   TRT-LLM  guides/recipes/modelserver/components/images/gpu-trtllm/release
  # TRT-LLM is a release candidate on purpose: the iteration-state gauges the
  # router's load-aware scorers read (trtllm_num_requests_waiting / _running,
  # trtllm_kv_cache_utilization) landed in 1.3.0rc12 and are absent from 1.2.x,
  # and there is no 1.3.0 GA yet.
  sglang_version:                    &sglang_version                    v0.5.19
  trtllm_version:                    &trtllm_version                    1.3.0rc23
  llm-d-router-endpoint-picker_version: &llm-d-router-endpoint-picker_version v0.11.0
  llm-d-routing-sidecar_version:     &llm-d-routing-sidecar_version     v0.11.0
  # Just use vllm-openai image for tokenizer
  llm-d-uds-tokenizer_version:       &llm-d-uds-tokenizer_version       v0.30.0
  llm-d-cuda_version:                &llm-d-cuda_version                v0.9.0
  llm-d-inference-sim_version:       &llm-d-inference-sim_version       v0.10.2
  llm-d-benchmark_version:           &llm-d-benchmark_version           nightly
  llm-d-prism_version:               &llm-d-prism_version               latest

  # Common labels
  app_label: &app_label llm-d-benchmark-harness
  inference_serving_label: &inference_serving_label "true"

  # Preprocessing script (sourced from init container output)
  preprocess_script: &preprocess_script /bin/true

# ============================================================================
# RESOURCE PRESETS - For different model sizes (as we get understanding...)
#
# Idea:
#
# These can be referenced in scenarios via resourcePreset: <name>
#
# I kind of have this implemented in the renderer. But I have not extensively
# tested it.x
#
# ============================================================================
resourcePresets:
  small:
    decode:
      resources:
        limits:
          memory: *memory_40gi
          cpu: *cpu_4
        requests:
          memory: *memory_40gi
          cpu: *cpu_4
      shm:
        size: *shm_16gi
      parallelism: *parallelism_single
    prefill:
      resources:
        limits:
          memory: *memory_40gi
          cpu: *cpu_4
        requests:
          memory: *memory_40gi
          cpu: *cpu_4
      parallelism: *parallelism_single

  medium:
    decode:
      resources:
        limits:
          memory: *memory_64gi
          cpu: *cpu_16
        requests:
          memory: *memory_64gi
          cpu: *cpu_16
      shm:
        size: *shm_16gi
      parallelism: *parallelism_single
    prefill:
      resources:
        limits:
          memory: *memory_64gi
          cpu: *cpu_16
        requests:
          memory: *memory_64gi
          cpu: *cpu_16
      parallelism: *parallelism_single

  large:
    decode:
      resources:
        limits:
          memory: *memory_256gi
          cpu: *cpu_32
        requests:
          memory: *memory_256gi
          cpu: *cpu_32
      shm:
        size: *shm_64gi
      parallelism: *parallelism_4gpu
    prefill:
      resources:
        limits:
          memory: *memory_256gi
          cpu: *cpu_32
        requests:
          memory: *memory_256gi
          cpu: *cpu_32
      parallelism: *parallelism_4gpu

  xlarge:
    decode:
      resources:
        limits:
          memory: *memory_256gi
          cpu: *cpu_32
        requests:
          memory: *memory_256gi
          cpu: *cpu_32
      shm:
        size: *shm_64gi
      parallelism: *parallelism_8gpu
    prefill:
      resources:
        limits:
          memory: *memory_256gi
          cpu: *cpu_32
        requests:
          memory: *memory_256gi
          cpu: *cpu_32
      parallelism: *parallelism_8gpu

# ============================================================================
# TOP-LEVEL / COMMON CONFIGURATION
# ============================================================================

# Common config block (passed through to helm chart)
common: {}

# For subchart usage
modelservice:
  enabled: true
  # Where the weights come from, and what the engine's model argument therefore
  # looks like. One of:
  #
  #   pvc+hf  (default) A download Job stages a Hugging Face *hub cache* onto the
  #           model PVC, and the engine's model argument is the plain model id.
  #           uri: pvc+hf://<storage.modelPvc.name>/<model.path>
  #           The chart resolves that to the id plus HF_HUB_CACHE, so the command
  #           reads exactly as it would outside Kubernetes:
  #             vllm serve Qwen/Qwen3-32B
  #
  #   hf      No PVC and no download Job -- the engine pulls from the Hub at pod
  #           start. Same command, same plain id.
  #           uri: hf://<model.huggingfaceId>
  #
  #   pvc     The PVC holds a raw weights directory rather than a hub cache (one
  #           staged out of band, or a layout Hugging Face did not produce). The
  #           engine's model argument is then a path, so the command states the
  #           path and names the model with `--served-model-name`:
  #             vllm serve /model-cache/Kimi-K3 --served-model-name moonshotai/Kimi-K3
  #           uri: pvc://<storage.modelPvc.name>/<model.path>
  #
  # `pvc+hf` requires `model.path` to end in the two segments of the model id
  # (`models/Qwen/Qwen3-32B`); anything else is a `pvc` layout.
  uriProtocol: pvc+hf

# Override service account name (optional)
serviceAccountOverride: ""

# Global scheduler name (can be overridden per decode/prefill or standalone)
schedulerName: default-scheduler

# ============================================================================
# NAMESPACE CONFIGURATION
# ============================================================================
namespace:
  name: auto  # "auto" resolves to "llmdbench" at plan time; override via CLI --namespace
  labels:
    podSecurity:
      audit: privileged
      warn: privileged

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
# What is served, and where it comes from. None of these are engine
# parameters: they name the model to everything *outside* the engine -- the
# model PVC path, pod labels, the HTTPRoute, the harness target.
#
# The model is named once, and normally that is in the launch command, as the
# serve target a user writes anyway:
#
#     vllm serve Qwen/Qwen3-32B --port 8200
#
# `name`, `huggingfaceId` and `path` below are then filled in from that one
# literal, so no scenario types the id a second time. (Under `uriProtocol: pvc`
# the serve target is a directory instead of an id, so the id is read off
# `--served-model-name` there.)
#
# Naming it here instead is for when the command must not carry a literal id:
# `-m/--models` replaces the model at plan time, and one `shared:` command can
# serve stacks that differ only in which model they load. Both write the serve
# target as `${model.name}`, which resolves before anything is rendered. A name
# stated anywhere (scenario, treatment, `-m`) wins, and a command that then
# serves a different model is reported as a mismatch rather than overriding it.
#
# `shortName` is worth writing down. It is the Kubernetes name prefix for the
# stack; left unset it derives as a `{first8}-{sha8}-{last8}` hash, so stating
# it is what keeps pod names readable.
model:
  name: *model_name
  shortName: *model_short_name
  path: *model_path
  huggingfaceId: *model_name
  size: 1Ti

  # Read out of the engine command -- NOT rendered into anything. Three numbers
  # that something outside the engine needs and the command already states:
  #
  #   maxModelLen, gpuMemoryUtilization  the pre-deploy capacity check's KV-cache
  #                                      arithmetic, and the harness workload
  #                                      profile's context length
  #   blockSize                          the router's prefix-cache index, which
  #                                      has to hash on the same page boundaries
  #                                      the engine writes
  #
  # Whichever flag your engine spells them with sets these:
  #   vLLM    --max-model-len  / --gpu-memory-utilization      / --block-size
  #   SGLang  --context-length / --mem-fraction-static         / --page-size
  #   TRT-LLM --max_seq_len    / --free_gpu_memory_fraction    / (none)
  #
  # Set one here only when the command cannot state it: an image whose entrypoint
  # carries the flag, or a value the engine has no CLI flag for at all (TRT-LLM
  # takes its page size as `tokens_per_block` inside an options file). A value
  # nothing states stays unknown, and whatever needed it turns itself off.
  maxModelLen: null
  gpuMemoryUtilization: null
  blockSize: null


# ============================================================================
# MODEL ARTIFACTS CONFIGURATION
# ============================================================================
modelArtifacts:
  # Mount path for model volume
  mountPath: /model-cache
  # Extra labels for model pods (in addition to llm-d.ai/inferenceServing and llm-d.ai/model)
  extraLabels: {}

# ============================================================================
# STORAGE CONFIGURATION
# ============================================================================
storage:
  # Max seconds to wait for model download job completion.
  # Matches bash LLMDBENCH_VLLM_COMMON_PVC_DOWNLOAD_TIMEOUT default.
  downloadTimeout: 2400

  # Max retries for model download job before failing the step.
  downloadMaxRetries: 2

  workloadPvc:
    name: workload-pvc
    size: 20Gi
    accessModes:
      - ReadWriteMany
    storageClassName: *storage_class

  modelPvc:
    name: model-pvc
    size: 300Gi
    accessModes:
      - ReadWriteMany
    storageClassName: *storage_class

  # Extra PVC - only created when name is non-empty.
  # Mirrors bash LLMDBENCH_VLLM_COMMON_EXTRA_PVC_NAME.
  # The PVC is NOT automatically mounted; scenarios must also add matching
  # entries to engine.volumes/volumeMounts to wire it into pods.
  extraPvc:
    name: ""          # Empty = skip creation (default)
    size: 10Gi
    accessModes:
      - ReadWriteMany
    storageClassName: *storage_class

  # HostPath-backed model storage (opt-in).
  # When enabled, a static PersistentVolume with hostPath is created and the
  # model PVC binds to it via a matching storageClassName.  A DaemonSet
  # downloads the model to the hostPath on every target node BEFORE the
  # serving pods start; the regular download Job is skipped.
  #
  # Requirements:
  #   - Nodes must have the hostPath directory writable.
  #   - nodeSelector / tolerations should target the GPU nodes where
  #     vLLM pods will schedule.
  #   - The storageClassName does NOT need a real StorageClass object
  #     on the cluster; static PV binding uses label matching.
  hostPath:
    enabled: false
    path: /mnt/models
    storageClassName: hostpath
    capacity: 300Gi
    nodeSelector: {}
    tolerations: []
    daemonSetTimeout: 3600
    daemonSetName: download-model-ds

# ============================================================================
# HUGGINGFACE CONFIGURATION
# ============================================================================
huggingface:
  # Auto-computed at render time based on whether a valid HF token is available.
  # When true: the HF token secret is created, download job authenticates,
  # and EPP/harness pods mount the secret.
  # When false: no secret, no auth -- works for public (non-gated) models.
  # Gated models without a token fail early at the model access check.
  enabled: true
  secretName: llm-d-hf-token
  tokenKey: HF_TOKEN
  token: ""  # Plain-text HF token; auto-detected from HF_TOKEN env var if empty
  tokenBase64: ""  # Base64-encoded form; auto-computed when token is set from env

# ============================================================================
# IMAGE CONFIGURATION
# ============================================================================
#
# Each entry has:
#   repository:  registry path used at pod-spec render time (consumed by templates)
#   tag:         image tag, "auto" resolves to the latest at plan time
#   pullPolicy:  Kubernetes imagePullPolicy
#   sourceRepo:  upstream source code repository URL (NOT consumed by templates --
#                read by util/generate_sbom.py to build the SBOM. The registry path
#                often differs from the source repo URL, so we record both.)
#   sourcePath:  optional path within sourceRepo (e.g. a Dockerfile or subdir)
#
# Init containers (decode/prefill/standalone) can reference an entry from
# this section via `imageKey: <entry>`, which expands to repo:tag (and
# inherits pullPolicy when the block doesn't set its own).  See
# `decode.initContainers` for usage.  Setting both `image` and `imageKey`
# on the same entry is an error.
#
images:
  benchmark:
    repository: ghcr.io/llm-d/llm-d-benchmark
    tag: *llm-d-benchmark_version
    pullPolicy: *pull_always
    sourceRepo: https://github.com/llm-d/llm-d-benchmark

  vllm:
#    repository: ghcr.io/llm-d/llm-d-cuda
#    tag: *llm-d-cuda_version
#    pullPolicy: *pull_if_not_present
#    sourceRepo: https://github.com/llm-d/llm-d
#    sourcePath: docker/Dockerfile.cuda
    repository: docker.io/vllm/vllm-openai
    tag: *vllm-openai_version
    pullPolicy: *pull_always
    sourceRepo: https://github.com/vllm-project/vllm

  # One entry per inference engine. `engine.name` (or the launcher detected in
  # the command) picks which one a role's container image defaults to, so a
  # scenario that switches engine does not have to restate the image. Override
  # per role with `<role>.engine.image.{repository,tag,pullPolicy}`.
  sglang:
    repository: docker.io/lmsysorg/sglang
    tag: *sglang_version
    pullPolicy: *pull_always
    sourceRepo: https://github.com/sgl-project/sglang

  trtllm:
    repository: nvcr.io/nvidia/tensorrt-llm/release
    tag: *trtllm_version
    pullPolicy: *pull_always
    sourceRepo: https://github.com/NVIDIA/TensorRT-LLM

  llmdInferenceSim:
    repository: ghcr.io/llm-d/llm-d-inference-sim
    tag: *llm-d-inference-sim_version
    pullPolicy: *pull_always
    sourceRepo: https://github.com/llm-d/llm-d-inference-sim

  prism:
    repository: ghcr.io/llm-d/llm-d-prism
    tag: *llm-d-prism_version
    pullPolicy: *pull_always
    sourceRepo: https://github.com/llm-d/llm-d-prism

  # EPP (Endpoint Picker / Router) image -- llm-d-owned, sourced from the
  # llm-d-router chart family.
  routerEndpointPicker:
    repository: ghcr.io/llm-d/llm-d-router-endpoint-picker
    tag: *llm-d-router-endpoint-picker_version
    pullPolicy: *pull_always
    sourceRepo: https://github.com/llm-d/llm-d-router

  routingSidecar:
    repository: ghcr.io/llm-d/llm-d-router-disagg-sidecar
    tag: *llm-d-routing-sidecar_version
    pullPolicy: *pull_if_not_present
    sourceRepo: https://github.com/llm-d/llm-d-router

  udsTokenizer:
    repository: docker.io/vllm/vllm-openai
    tag: *llm-d-uds-tokenizer_version
    pullPolicy: *pull_always
    sourceRepo: https://github.com/vllm-project/vllm
#    repository: ghcr.io/llm-d/llm-d-uds-tokenizer
#    tag: *llm-d-uds-tokenizer_version
#    pullPolicy: *pull_if_not_present
#    sourceRepo: https://github.com/llm-d/llm-d-kv-cache
#    sourcePath: services/uds_tokenizer

  python:
    repository: python
    tag: "3.10"
    sourceRepo: https://hub.docker.com/_/python

# ============================================================================
# HELM REPOSITORY CONFIGURATION
# ============================================================================
#
# Each entry has:
#   url:         chart repository URL used by `helm`/`helmfile` (consumed by templates)
#   name:        optional chart name override when it differs from the key
#   sourceRepo:  upstream source code URL (read by util/generate_sbom.py for SBOM,
#                NOT consumed by templates)
#
helmRepositories:
  istio:
    url: https://istio-release.storage.googleapis.com/charts
    sourceRepo: https://github.com/istio/istio
  llmDModelservice:
    url: https://llm-d-incubation.github.io/llm-d-modelservice/
    sourceRepo: https://github.com/llm-d-incubation/llm-d-modelservice
  llmDInfra:
    url: https://llm-d-incubation.github.io/llm-d-infra/
    sourceRepo: https://github.com/llm-d-incubation/llm-d-infra
  agentgateway:
    name: agentgateway
    url: oci://cr.agentgateway.dev/charts/
    sourceRepo: https://github.com/agentgateway/agentgateway
  # The next entries hold metadata only -- the charts are pulled from
  # OCI registries directly in the helmfile templates (no `url` needed for
  # `helm repo add`). They live here so the SBOM can find the source repo.
  #
  # `llmDRouter` is the chart family the benchmark deploys, in place of the
  # GAIE-published `inferencepool` and `standalone` charts. It always uses
  # `llm-d-router-gateway-dev` (or `-standalone-dev` when
  # gateway.className=epponly), so only the source repo metadata is held
  # here. The chart URLs themselves are constructed in
  # `config/templates/jinja/10_helmfile-main.yaml.j2`.
  llmDRouter:
    sourceRepo: https://github.com/llm-d/llm-d-router
  # Source-repo metadata only, for the SBOM. Chart URLs come from
  # `llmDRouter` above.
  inferencePool:
    sourceRepo: https://github.com/kubernetes-sigs/gateway-api-inference-extension
  gaie:
    sourceRepo: https://github.com/kubernetes-sigs/gateway-api-inference-extension
  lws:
    sourceRepo: https://github.com/kubernetes-sigs/lws

# ============================================================================
# CHART VERSIONS
# ============================================================================
chartVersions:
  istioBase: *istio_version
  istiod: *istio_version
  llmDInfra: auto
  llmDModelservice: *modelservice_chart_version
  # llm-d-router chart version (used by the standalone and gateway
  # variants). This is the chart the EPP/router deploy uses.
  llmDRouter: *router_chart_version
  # Not consumed by the helmfile template; kept so a scenario or downstream
  # tool that reads this key still resolves.
  inferencePool: *gaie_version
  agentgateway: *agentgateway_version
  lws: *lws_version

# ============================================================================
# SERVICE ACCOUNT CONFIGURATION
# ============================================================================
serviceAccount:
  name: inference-perf-runner

# ============================================================================
# MONITORING CONFIGURATION
# ============================================================================
monitoring:
  enabled: true
  enableUserWorkload: true
  podmonitor:
    enabled: true
  # Install PodMonitor/ServiceMonitor CRDs if they don't exist on the cluster.
  # Set to true for clusters without Prometheus Operator (e.g., Kind, vanilla K8s).
  # OpenShift clusters already have these CRDs via the monitoring stack.
  installPrometheusCrds: false
  prometheusCrdUrls:
    - https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
    - https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
  # Override only. Where an engine serves metrics is engine knowledge, so it
  # normally comes from the resolved spec (`<role>.engine.metricsPath`): vLLM and
  # SGLang serve /metrics, TRT-LLM serves /prometheus/metrics. Left as a default
  # here it would win over that and point every PodMonitor at /metrics whatever
  # the role launches. Set it to pin a path the spec gets wrong.
  metricsPath: null
  scrapeInterval: "30s"
  metricsScrapeEnabled: false
  # Embed downsampled per-timestamp series into the report's
  # results.observability.components[].time_series, for interactive plotting.
  # Only metrics in the _EMBED_TIME_SERIES allow-list (metrics_processor.py) qualify.
  embedTimeSeries: true
  timeSeriesMaxPoints: 256
  # Prometheus time-series metrics retained for processing, visualization,
  # and benchmark-report observability entries. Add new metrics here without
  # changing the analysis code.
  timeSeriesMetrics:
    - vllm:kv_cache_usage_perc
    - vllm:gpu_cache_usage_perc
    - vllm:cpu_cache_usage_perc
    - vllm:gpu_memory_usage_bytes
    - vllm:cpu_memory_usage_bytes
    - container_memory_usage_bytes
    - DCGM_FI_DEV_GPU_UTIL
    - DCGM_FI_DEV_POWER_USAGE
    - vllm:num_requests_running
    - vllm:num_requests_waiting
    - vllm:prefix_cache_hits_total
    - vllm:prefix_cache_queries_total
    - vllm:external_prefix_cache_hits_total
    - vllm:external_prefix_cache_queries_total
    - vllm:prefix_cache_hit_rate
    - vllm:external_prefix_cache_hit_rate
    - vllm:kv_offload_total_bytes_total
    - vllm:kv_offload_total_time_total
    - vllm:nixl_xfer_time_seconds_sum
    - vllm:nixl_xfer_time_seconds_count
    - vllm:nixl_bytes_transferred_sum
    - vllm:nixl_bytes_transferred_count
    - vllm:num_preemptions_total
    - vllm:prompt_tokens_total
    - vllm:generation_tokens_total
    - inference_pool_average_kv_cache_utilization
    - inference_pool_average_queue_size
    - inference_pool_average_running_requests
    - inference_pool_ready_pods
    - llm_d_epp_flow_control_pool_saturation
    - llm_d_epp_flow_control_queue_size
    - llm_d_epp_request_running

# ============================================================================
# ACCELERATOR CONFIGURATION
# Supports: nvidia, intel-xpu, intel-i915, intel-xe, intel-gaudi, amd, google
# ============================================================================
accelerator:
  type: nvidia
  # Resource name for the accelerator used in limits/requests
  # Override for non-NVIDIA GPUs (e.g. habana.ai/gaudi, amd.com/gpu)
  resource: "nvidia.com/gpu"
  # There are deliberately no command fragments here. An engine command states
  # its own flags, literally, so what the engine parses is what the file says.
  # A scenario for hardware that needs different flags is its own scenario file
  # (config/scenarios/examples/{intel-xpu,spyre,cpu}.yaml), not a guide with
  # substitution points. The one runtime detail that genuinely cannot be written
  # down at render time -- where the injected CUDA driver library landed -- is
  # emitted into /shared-config/llmdbench_env.sh by the preprocess script and is
  # self-guarding on nodes that have none.
  # Resource names for different accelerator types (optional override)
  # DRA drivers are tracked separately as accelerator.draDriver and are not
  # rendered into container resource limits or requests.
  # resources:
  #   nvidia: "nvidia.com/gpu"
  #   intel-i915: "gpu.intel.com/i915"
  #   intel-xe: "gpu.intel.com/xe"
  #   intel-gaudi: "habana.ai/gaudi"
  #   amd: "amd.com/gpu"
  #   google: "google.com/tpu"
  # Environment variables specific to accelerator types (optional)
  # env:
  #   intel-i915:
  #     - name: VLLM_USE_V1
  #       value: "1"

# ============================================================================
# DYNAMIC RESOURCE ALLOCATION (DRA) - Optional
# ============================================================================
dra:
  enabled: false
  type: nvidia
  # Keyed by accelerator type -- the chart looks the entry up by
  # accelerator.type and builds one ResourceClaimTemplate per role.
  # Omit `count` to let each role derive it from its own parallelism.
  # claimTemplates:
  #   nvidia:
  #     name: nvidia-claim-template
  #     class: gpu.nvidia.com
  #     match: "exactly"
  #     count: 1
  #     selectors: []

# ============================================================================
# AFFINITY CONFIGURATION
# ============================================================================
affinity:
  enabled: false
  # Node selector labels (used for nodeAffinity)
  nodeSelector: {}
  # Example:
  # nodeSelector:
  #   nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
  #   topology.kubernetes.io/zone: us-east-1a

  # Pod affinity rules (optional)
  podAffinity: {}

  # Pod anti-affinity rules (optional)
  podAntiAffinity: {}

# ============================================================================
# ANNOTATIONS CONFIGURATION
# ============================================================================
annotations:
  # Common annotations applied to all pods
  common: {}

  decode:
    # Pod-level annotations
    pod: {}
    # Container-level annotations (if supported)
    container: {}

  prefill:
    pod: {}
    container: {}

# ============================================================================
# MODELSERVICE-ONLY SECTIONS: gateway / router / routing / httpRoute
#
# These sections (gateway, router, routing below, plus httpRoute further
# down) are consumed ONLY on the modelservice deploy path -- standalone,
# kustomize and fma do not read them. Scenarios MAY nest them under
# `modelservice:` to make that scope explicit, e.g.:
#
#   modelservice:
#     enabled: true
#     gateway:
#       className: epponly
#     router:
#       epp: { replicas: 2 }
#     httpRoute:
#       requestTimeout: "300s"
#
# The renderer hoists any such nested block back to the top level before the
# resolver chain runs (RenderPlans._hoist_modelservice_sections). Templates,
# resolvers and standup steps always read the TOP-LEVEL keys -- which is why
# these defaults live at the top level. The flat top-level spelling in a
# scenario is equally valid; pick one spelling per section.
#
# IMPORTANT: DoE experiment treatments and CLI overrides target the
# TOP-LEVEL dotted path (e.g. `router.epp.pluginsConfigFile`,
# `--gateway-class`), not the nested path. Precedence is
# defaults < scenario < treatment/CLI.
# ============================================================================

# ============================================================================
# GATEWAY CONFIGURATION
# ============================================================================
gateway:
  name: infra-llmdbench-inference-gateway
  namespace: auto  # Synced with namespace.name; resolved at plan time
  # Gateway implementation. Supported values:
  #   istio                      - default; istio-base + istiod control plane
  #   agentgateway               - agentgateway-crds + agentgateway controller
  #   gke                        - GKE-managed Gateway
  #   data-science-gateway-class - OpenDataHub / OpenShift AI managed Gateway
  #   epponly                    - llm-d "standalone" router topology: no
  #                                Kubernetes Gateway is deployed, the EPP
  #                                runs with an Envoy sidecar that serves
  #                                HTTP directly (single-stack only).
  #   none                       - plain ClusterIP Service to decode vLLM;
  #                                no Gateway, EPP, Envoy, or routing proxy.
  className: epponly
  providerNamespace: istio-system
  # Gateway version is derived from chartVersions.istiod at plan time
  logLevel: error
  # Optional: override the Gateway's HTTP listener port. When unset (default)
  # the chart's built-in listener is used. Not supported for
  # className: data-science-gateway-class (that class pins port 443 HTTPS+TLS).
  # listenerPort: 80
  service:
    type: NodePort
  resources:
    limits:
      cpu: *cpu_16
      memory: *memory_16gi
    requests:
      cpu: *cpu_4
      memory: *memory_4gi

# ============================================================================
# ROUTER CONFIGURATION
#
# Scenario-level keys for the llm-d-router chart. Mirrors the chart's
# top-level `router:` shape; the 12_router-values.yaml.j2 template passes
# this through largely unchanged, with a few benchmark-specific niceties
# (HF token env injection, zmq port expansion into the extraContainerPorts
# / extraServicePorts arrays, EPP image resolution from
# `images.routerEndpointPicker`, and tokenizer.modelName fallback to
# model.name).
# ============================================================================
router:
  epp:
    replicas: 1
    extProcPort: *ext_proc_port
    # Used to populate router.epp.extraContainerPorts and
    # router.extraServicePorts with the zmq port (the EPP needs the
    # container port for the kv-events publisher, and the service port
    # so other pods can reach the publisher).
    zmqPort: *zmq_port
    pluginsConfigFile: "default-plugins.yaml"
    # Custom plugin content to embed in router-values.yaml.
    # Keys are filenames, values are the YAML content as literal strings.
    # The chart expects apiVersion `llm-d.ai/v1alpha1` for the
    # EndpointPickerConfig (the legacy `inference.networking.x-k8s.io/v1alpha1`
    # is also accepted but deprecated).
    # Example:
    #   pluginsCustomConfig:
    #     my-plugins.yaml: |
    #       apiVersion: llm-d.ai/v1alpha1
    #       kind: EndpointPickerConfig
    #       ...
    pluginsCustomConfig: {}
    verbosity: "1"
    # Resources are intentionally NOT set here.
    # CI runners override this in their scenario YAML -- see
    # config/scenarios/cicd/kind.yaml for an example.
    # Extra volumes / mounts on the EPP container (e.g. shared dirs).
    volumes: []
    volumeMounts: []
  # UDS tokenizer is a first-class chart feature. Flip
  # `router.tokenizer.enabled: true` and the chart wires up the
  # tokenizer container, sockets, and volumes itself. When `enabled`
  # is true and `modelName` is unset, the template falls back to
  # `model.name`.
  tokenizer:
    enabled: false
  inferencePool:
    failureMode: "FailOpen"
    # Provider-specific config rendered to the values root as
    # `provider.{gatewayClassName}.{...}` for gke/istio (epponly and
    # agentgateway don't consume this).
    # Example (istio):
    #   providerConfig:
    #     destinationRule:
    #       trafficPolicy:
    #         connectionPool:
    #           http:
    #             h2UpgradePolicy: DO_NOT_UPGRADE
    providerConfig: {}
  monitoring:
    # Service-account token secret name for the Prometheus scraper.
    # Multi-stack scenarios sharing one namespace get a per-stack
    # rewrite of this name in render_plans to avoid Helm ownership
    # collisions.
    secretName: inference-gateway-sa-metrics-reader-secret
    interval: "10s"
    prometheus:
      enabled: true
      auth:
        enabled: true

# ============================================================================
# ROUTING / PROXY CONFIGURATION
# ============================================================================
routing:
  # Service port (matches routing.servicePort in helm chart)
  servicePort: *service_port
  connector: nixlv2
  debugLevel: 3
  secure: false

  # Proxy configuration
  # Image is sourced from `images.routingSidecar`; override that entry per
  # scenario to change the version.
  proxy:
    enabled: true
    imagePullPolicy: *pull_always
    # Where the sidecar forwards. Left null and filled in from
    # `decode.engine.port` -- the --port in decode's engine command -- because
    # the sidecar has to point at wherever the engine actually listens. Set it
    # only for an engine whose entrypoint binds a port the command does not say.
    targetPort: null
    # TLS configuration (optional)
    # prefillerUseTLS: false
    # certPath: "/certs"
    # Zap logging configuration
    zapEncoder: json
    zapLogLevel: debug
    # zapDevel: false
    # zapStacktraceLevel: error
    # zapTimeEncoding: epoch

# ============================================================================
# HTTPROUTE CONFIGURATION
#
# Gateway-API HTTPRoute settings consumed by 08_httproute.yaml.j2. Applies to
# every rule the template emits (both per-stack and shared modes).
#
#   requestTimeout        End-to-end request timeout the gateway enforces.
#                         Requests exceeding it are aborted with a 502 (which
#                         surfaces as a "connection reset by peer" on the
#                         decode routing-proxy loopback hop). Set "0s" to
#                         disable -- appropriate for long agentic turns.
#   backendRequestTimeout Per-retry backend timeout; "0s" disables.
#
# Shared-mode-only knobs (mode/name/pathPrefix/rewriteTo) are documented in
# the template header and read with their own defaults.
# ============================================================================
httpRoute:
  requestTimeout: "300s"
  backendRequestTimeout: "0s"

# ============================================================================
# ENGINE CONFIGURATION
#
# Each role supplies its engine's launch command. This section contains only
# shared container and Service settings. See config/README.md#engine-command.
# ============================================================================
engine:
  # Usually detected from the command. Set for image-entrypoint/custom engines.
  name: null

  # Fallback command for roles that do not state their own. Leave null and put
  # the command under `decode.engine.command` / `prefill.engine.command` etc.:
  # decode and prefill rarely want the same line.
  command: null

  # Fallback for roles that state no `engine.extraArgs` of their own (see
  # `decode.engine.extraArgs` for what those are). A role's own list replaces
  # this one rather than adding to it, the same as `command`.
  extraArgs: []

  # Engine-neutral serving-container name.
  containerName: modelserver

  # Shell used to exec a role's engine command. Override to /bin/sh for an
  # image without bash.
  shell: *engine_shell

  # Script run before the engine starts, inside the same container.
  preprocessScript: *preprocess_script

  # Public Service port; distinct from each role's resolved engine bind port.
  servicePort: *service_port

  # PriorityClassName for pod scheduling priority (optional)
  # Set to a valid PriorityClass name on the cluster, or leave empty/"none" to skip.
  # Applied to standalone, decode, and prefill pods unless overridden per-section.
  priorityClassName: ""

  # Image pull secret name for private registries (optional)
  # When set, adds imagePullSecrets to all pod specs.
  pullSecret: ""

  # Container HOME and HF_HOME directories.
  # Default to /tmp which works for the standard llm-d-cuda image (runs as root).
  # Override to /dev/shm for custom images on OpenShift where /tmp is not writable
  # by the non-root UID assigned by restricted-v2 SCC.
  containerHome: *container_home
  hfHome: *hf_home

  # Ephemeral storage resource for pod limits/requests (optional)
  # Only added to pod specs when ephemeralStorage value is non-empty.
  ephemeralStorageResource: "ephemeral-storage"
  ephemeralStorage: ""

  # Network resource (RDMA/InfiniBand) for pod limits/requests (optional)
  # Only added to pod specs when both networkResource and networkNr are non-empty.
  networkResource: ""
  networkNr: ""

  # Volume configurations -- no defaults.
  # Each scenario defines its own volumes and volumeMounts explicitly.
  # Common volumes like dshm (shared memory) and shared-config (preprocess output)
  # should be defined in the scenario YAML, not inherited from defaults.
  volumes: []
  volumeMounts: []

# ============================================================================
# DECODE CONFIGURATION
# ============================================================================
decode:
  enabled: true
  replicas: 1

  # Autoscaling (optional)
  autoscaling:
    enabled: false
    # minReplicas: 1
    # maxReplicas: 10

  # Node selector (optional - for direct nodeSelector, not affinity)
  nodeSelector: {}

  # Scheduler name override global schedulerName (optional)
  # schedulerName: default-scheduler

  # PriorityClassName override (optional - inherits from engine if not set)
  # priorityClassName: ""

  # Ephemeral storage override (optional - inherits from engine if not set)
  # ephemeralStorage: ""

  # Network resource override (optional - inherits from engine if not set)
  # networkResource: ""
  # networkNr: ""

  # Accelerator type selection
  acceleratorType:
    labelKey: *gpu_label_key
    labelValue: *gpu_label_value
    # Use labelValues for multiple values (takes precedence over labelValue)
    # labelValues:
    #   - NVIDIA-H100-80GB-HBM3
    #   - NVIDIA-A100-SXM4-80GB

  # Parallelism configuration
  parallelism: *parallelism_single

  # Resource configuration
  resources:
    limits:
      memory: *memory_40gi
      cpu: *cpu_4
      # GPU resource (optional - uncomment to explicitly request GPUs)
      # nvidia.com/gpu: "1"
      # DRA claims (optional)
      # claims: {}
    requests:
      memory: *memory_40gi
      cpu: *cpu_4
      # nvidia.com/gpu: "1"

  # Shared memory
  shm:
    size: *shm_16gi

  # Probe configuration
  probes:
    startup: *probe_startup
    liveness: *probe_liveness
    readiness: *probe_readiness

  # Inference engine. `command` is the launch line, verbatim -- see the ENGINE
  # CONFIGURATION section above. Everything else here is optional.
  engine:
    # Engine name. Detected from the command; set it only when there is no
    # command (the image's entrypoint launches the server).
    name: null

    # Minimal fallback. Scenario commands replace it wholesale. Decode binds
    # 8200 because the routing sidecar normally owns Service port 8000.
    command: |
      vllm serve ${model.name} \
        --port 8200

    # Opaque words appended to the command. A role's list replaces the
    # plan-wide list; repeated flags are left for the engine to resolve.
    extraArgs: []

    # Port the engine binds. Normally read from the command's --port; set it
    # only for an image whose entrypoint fixes the port.
    port: null

    # Command run before the engine, in the same container. Overrides
    # engine.preprocessScript for this role.
    preprocessCommand: null

    imagePullPolicy: *pull_if_not_present

    # Per-role image override. What you omit comes from `images.<engine>`.
    # image:
    #   repository: quay.io/my-org/vllm
    #   tag: nightly

  # Mount model volume
  mountModelVolume: true

  # Additional volume mounts
  additionalVolumeMounts: []

  # Additional volumes
  additionalVolumes: []

  # Extra environment variables
  extraEnvVars: []
  # Example:
  # extraEnvVars:
  #   - name: CUDA_VISIBLE_DEVICES
  #     value: "0,1,2,3"
  #   - name: NCCL_DEBUG
  #     value: "INFO"
  #   - name: MY_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: password

  # Extra ports (optional)
  # ports:
  #   - containerPort: 8200
  #     name: metrics
  #     protocol: TCP

  # Extra container config
  extraContainerConfig: {}
  # Example:
  # extraContainerConfig:
  #   securityContext:
  #     privileged: true
  #     capabilities:
  #       add:
  #         - IPC_LOCK

  # Extra pod config
  extraPodConfig: {}

  # Init containers (optional, configured per scenario).
  # Each entry sets `image` directly or `imageKey` (an entry name from
  # `images.*`); if neither is set, image defaults to `images.benchmark`.
  initContainers: []

  # LWS / Multinode options (optional)
  # hostIPC: false
  # hostPID: false
  # enableServiceLinks: true
  # terminationGracePeriodSeconds: 30
  # subGroupPolicy:
  #   subGroupSize: 8
  # subGroupExclusiveTopology: false

  # Monitoring / PodMonitor (optional)
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      # No `path`: it comes from the engine's own spec, published as
      # `<role>.engine.metricsPath` (TRT-LLM, for one, serves
      # /prometheus/metrics). Set `path` here only to override that.
      interval: "30s"
      # scrapeTimeout: "10s"
      labels: {}
      annotations: {}
      relabelings: []
      metricRelabelings: []

# ============================================================================
# PREFILL CONFIGURATION
# ============================================================================
prefill:
  enabled: false
  replicas: 0

  # Autoscaling (optional)
  autoscaling:
    enabled: false
    # minReplicas: 1
    # maxReplicas: 10

  # Node selector (optional)
  nodeSelector: {}

  # Scheduler name override global schedulerName (optional)
  # schedulerName: default-scheduler

  # PriorityClassName override (optional - inherits from engine if not set)
  # priorityClassName: ""

  # Ephemeral storage override (optional - inherits from engine if not set)
  # ephemeralStorage: ""

  # Network resource override (optional - inherits from engine if not set)
  # networkResource: ""
  # networkNr: ""

  # Accelerator type selection
  acceleratorType:
    labelKey: *gpu_label_key
    labelValue: *gpu_label_value

  # Parallelism configuration
  parallelism: *parallelism_single

  # Resource configuration
  resources:
    limits:
      memory: *memory_40gi
      cpu: *cpu_4
    requests:
      memory: *memory_40gi
      cpu: *cpu_4

  # Probe configuration
  probes:
    startup: *probe_startup
    liveness: *probe_liveness
    readiness: *probe_readiness

  # Inference engine. `command` is the launch line, verbatim -- see the ENGINE
  # CONFIGURATION section above. Everything else here is optional.
  engine:
    # Engine name. Detected from the command; set it only when there is no
    # command (the image's entrypoint launches the server).
    name: null

    # The launch command, exactly as you would run it. Same contract as
    # decode's (see above); the one difference is the port. A prefill pod
    # never gets a routing sidecar -- the chart injects it only on decode --
    # so prefill binds `engine.servicePort` (8000) itself, which is also where
    # the decode sidecar reaches it for P/D.
    command: |
      vllm serve ${model.name} \
        --port 8000

    # Port the engine binds. Normally read from the command's --port; set it
    # only for an image whose entrypoint fixes the port.
    port: null

    # Command run before the engine, in the same container. Overrides
    # engine.preprocessScript for this role.
    preprocessCommand: null

    imagePullPolicy: *pull_if_not_present

    # Per-role image override. What you omit comes from `images.<engine>`.
    # image:
    #   repository: quay.io/my-org/vllm
    #   tag: nightly

  # Mount model volume
  mountModelVolume: true

  # Additional volume mounts
  additionalVolumeMounts: []

  # Additional volumes
  additionalVolumes: []

  # Extra environment variables
  extraEnvVars: []

  # Extra container config
  extraContainerConfig: {}

  # Extra pod config
  extraPodConfig: {}

  # Init containers (optional). See `decode.initContainers`.
  initContainers: []


  # Monitoring / PodMonitor (optional)
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      # No `path`: it comes from the engine's own spec, published as
      # `<role>.engine.metricsPath` (TRT-LLM, for one, serves
      # /prometheus/metrics). Set `path` here only to override that.
      interval: "30s"
      labels: {}
      annotations: {}
      relabelings: []
      metricRelabelings: []

# ============================================================================
# STANDALONE DEPLOYMENT CONFIGURATION
# For simple single-model deployments without llm-d routing infrastructure
# ============================================================================
standalone:
  enabled: false
  replicas: 1
  role: both  # Options: prefill, decode, both

  # Deployment naming
  deployment:
    name: null  # Auto-generated if null: standalone-<model.shortName>

  # Service configuration
  service:
    name: null  # Uses deployment name if null
    port: 80
    type: ClusterIP
    # nodePort: 30080  # Only used when type: NodePort
    # loadBalancerIP: ""  # Only used when type: LoadBalancer
    # loadBalancerSourceRanges: []
    # externalTrafficPolicy: Cluster
    # sessionAffinity: None
    annotations: {}
    additionalPorts: []
    # Example:
    # additionalPorts:
    #   - name: metrics
    #     port: 9090
    #     targetPort: 9090

  # Labels applied to deployment and service
  labels:
    stood-up-by: "auto" # Should be automatically configured to user
    stood-up-from: llm-d-benchmark
    stood-up-via: "standalone"

  # Extra labels for pod template
  extraPodLabels: {}

  # Pod annotations
  podAnnotations: {}

  # Scheduler name override global schedulerName (optional)
  schedulerName: default-scheduler

  # PriorityClassName override (optional - inherits from engine if not set)
  # priorityClassName: ""

  # Ephemeral storage override (optional - inherits from engine if not set)
  # ephemeralStorage: ""

  # Network resource override (optional - inherits from engine if not set)
  # networkResource: ""
  # networkNr: ""

  # Node selector (optional)
  nodeSelector: {}

  # Accelerator type selection (inherits from decode if not specified).
  # `labelValue: auto` triggers cluster-side discovery; see the
  # `gpu_label_value` anchor at the top of this file.
  acceleratorType:
    labelKey: nvidia.com/gpu.product
    labelValue: auto
    # labelValues:  # Use for multiple GPU types
    #   - NVIDIA-H100-80GB-HBM3
    #   - NVIDIA-A100-SXM4-80GB

  # The three keys below are the pod the inherited command needs in order to
  # run, and a scenario that states them for `decode` gets them here too: when
  # `standalone` names none of its own, `decode`'s are used
  # (_STANDALONE_INHERITS_FROM_DECODE in llmdbenchmark/parser/render_plans.py).
  # Standalone is decode without the router in front of it, so it serves the
  # same model with the same engine -- and a command inherited from decode while
  # the pod around it falls back to the floors below cannot work: a 32B
  # checkpoint under 40Gi is OOMKilled at load, and a `--tp_size 4` command on a
  # one-device pod never starts.
  #
  # What follows is therefore a floor for a scenario that configures neither
  # role, not a value standalone normally runs at. Each key is inherited whole,
  # so naming `standalone.resources` at all opts it out of inheritance
  # completely -- state both limits and requests, not just the one you change.

  # Parallelism widths the llm-d chart needs as chart values, stated -- not read
  # out of the command. They decide the pod's accelerator request, which the
  # kubelet grants before the engine process exists, so they have to agree with
  # whatever width the command gives the engine (`--tensor-parallel-size`,
  # `--tp-size`, `--tp_size`, ...). This is the single-device floor.
  parallelism:
    tensor: 1

  # Resource configuration
  resources:
    limits:
      memory: 40Gi
      cpu: "4"
    requests:
      memory: 40Gi
      cpu: "4"

  # Probe configuration. The anchors, not a copy of them: the copy that used to
  # live here is how standalone came to run its readiness probe on the kubelet's
  # 1s default while decode ran on 15s.
  probes:
    startup: *probe_startup
    liveness: *probe_liveness
    readiness: *probe_readiness

  # Inference engine. Same contract as decode/prefill: `command` is the launch
  # line verbatim. See the ENGINE CONFIGURATION section above.
  engine:
    name: null

    # Omitted: standalone inherits decode's command and command-coupled runtime
    # settings. Set a different command here, or "" to use the image entrypoint.
    # command: |
    #   vllm serve my-org/my-model \
    #     --port 8000

    # Port the engine binds. Normally read from the command's --port.
    port: null

    preprocessCommand: null

    imagePullPolicy: Always

    # Per-role image override; what you omit comes from `images.<engine>`,
    # so switching engine switches the image without restating it.
    # image:
    #   repository: quay.io/my-org/vllm
    #   tag: nightly

    # Passed to the image entrypoint when command is empty.
    args: []

  # Model volume configuration
  # NOTE: The model PVC is standalone-specific (not in engine.volumes)
  # because modelservice handles its own model volume via the Helm chart.
  mountModelVolume: true
  modelMountPath: /model-cache
  modelPvcName: model-pvc

  # Launcher container (optional second container in the same pod)
  # Mirrors bash LLMDBENCH_VLLM_STANDALONE_LAUNCHER feature.
  # Shares the same pod volumes, env vars, and resources as the main container.
  launcher:
    enabled: false
    port: 8001
    vllmPort: 8002
    imagePullPolicy: Always
    # Image defaults to standalone.engine.image if not specified
    image:
      repository: null  # null = inherit from standalone.engine.image
      tag: null          # null = inherit from standalone.engine.image
    customPreprocessCommand: null
    # Custom args for the launcher. null = use default uvicorn command.
    args: null
    # Example custom args:
    # args: |
    #   uvicorn launcher:app --host 0.0.0.0 --log-level info --port 8001

  # Additional volume mounts
  additionalVolumeMounts: []
  # Example:
  # additionalVolumeMounts:
  #   - name: custom-config
  #     mountPath: /config
  #     readOnly: true

  # Additional volumes
  additionalVolumes: []
  # Example:
  # additionalVolumes:
  #   - name: custom-config
  #     type: configMap
  #     configMap:
  #       name: my-config

  # Extra environment variables
  extraEnvVars: []
  # Example:
  # extraEnvVars:
  #   - name: CUDA_VISIBLE_DEVICES
  #     value: "0"
  #   - name: MY_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: password

  # Init containers (optional)
  initContainers: []
  # Example:
  # initContainers:
  #   - name: download-model
  #     image: python:3.10
  #     command: ["python", "-c", "print('downloading...')"]

  # Extra container config (merged into container spec)
  extraContainerConfig: {}
  # Example:
  # extraContainerConfig:
  #   securityContext:
  #     privileged: true

  # Extra pod config (merged into pod spec)
  extraPodConfig: {}

# ============================================================================
# NO-KUBERNETES (nok8s) DEPLOYMENT CONFIGURATION
# Runs the llm-d routing stack (vLLM + EPP + Envoy) as plain docker/podman
# containers on the local host, with NO Kubernetes cluster.  The EPP uses the
# file-discovery plugin (reads endpoints.yaml) instead of a k8s InferencePool.
# Wired: client -> Envoy (listenPort) -> EPP (grpcPort) -> vLLM (hostPort).
# Opt-in via `nok8s.enabled: true` in a scenario or `-t nok8s` on the CLI.
# ============================================================================
nok8s:
  enabled: false
  # Container runtime: "docker" or "podman".
  runtime: docker
  # Host whose container runtime runs the stack.
  #   localhost                          -- the machine running llmdbenchmark
  #                                         (default)
  #   ssh://[user@]host[:port][/socket]  -- a remote node. A bare "10.0.0.7"
  #                                         or "user@node" is read as ssh://.
  # Remote standup needs no daemon reconfiguration and no manual ssh tunnel;
  # it does need key-based SSH to work non-interactively. "tcp://" is refused
  # on purpose: an unauthenticated socket is root on that node.
  # Overridable per run without editing any file, on every subcommand:
  #   --set nok8s.connection=10.0.0.7
  connection: localhost
  # How a *remote* runtime is driven (ignored when connection is localhost):
  #   ssh     -- run `ssh <node> docker ...`, i.e. the runtime runs on the
  #              node. Needs NO container client on this machine, and no
  #              agreement between the two ends: only the node's runtime
  #              matters. This is the default.
  #   native  -- the runtimes' own SSH transport (`docker -H ssh://...` /
  #              `podman --url ssh://...`). Requires a client here of the SAME
  #              family as the node's daemon (a podman client cannot drive
  #              dockerd -- it asks for Libpod endpoints dockerd does not
  #              serve), and authenticates by that client's own rules: podman's
  #              Go SSH client ignores ~/.ssh/id_rsa, so `ssh node true` can
  #              succeed while every container command fails.
  transport: ssh
  # SSH private key for a remote connection (default: the agent / ~/.ssh keys).
  # Honoured by both transports, though "native" + podman needs the key to be
  # one podman itself accepts.
  sshIdentity: ""
  # Extra ssh/scp options for a remote connection. Replaces the defaults
  # (BatchMode=yes, ConnectTimeout=10), so re-state those if you override.
  sshArgs: []
  # Host env var read at standup time and passed to the vLLM container so it
  # can pull gated models from Hugging Face.
  hfTokenEnv: HUGGING_FACE_HUB_TOKEN
  # Host directory where rendered EPP/Envoy configs are staged and bind-mounted
  # from (avoids sudo writes to /etc). A scenario with more than one stack
  # gets a per-stack subdirectory appended so stacks never overwrite each
  # other's staged configs.
  workspaceHostDir: "~/.llmdbench/nok8s"
  # Appended to every container name (modelserver-N, epp, envoy). Filled in
  # automatically with "-<stack>" when a scenario has more than one stack, so
  # sibling stacks on one host don't share (and delete) each other's
  # containers. An explicit value is preserved, but two stacks resolving to
  # the same container name is a render error; single-stack scenarios keep
  # the bare names.
  nameSuffix: ""

  # Inference engine worker(s). Same contract as the Kubernetes roles: state
  # the launch command verbatim and it runs inside the container unchanged.
  #   nok8s:
  #     engine:
  #       command: |
  #         vllm serve ${model.name} --port 8000 --tensor-parallel-size 2
  engine:
    name: null
    command: null
    # Port the engine binds inside the container. Read from the command's
    # --port; stated here only when the command cannot say.
    port: null
    # Per-engine image default comes from `images.<engine>`; override here.
    # image:
    #   repository: docker.io/vllm/vllm-openai
    #   tag: v0.26.0
    hostPort: 8000          # worker i is published on hostPort + i
    # Accelerator preset for exposing the device to the container:
    #   nvidia | amd | intel | gaudi | cpu | spyre
    # Only NVIDIA is validated end-to-end; others follow each backend's
    # documented device flags. Point `image` at the matching engine backend.
    accelerator: nvidia
    gpus: "all"             # nvidia only: docker --gpus value (podman uses CDI)
    # Raw runtime device flags; overrides the accelerator preset entirely.
    # Use for IBM Spyre/AIU or any custom device wiring, e.g.
    #   deviceArgs: ["--device", "/dev/kfd", "--device", "/dev/dri"]
    deviceArgs: []
    shmSize: "20g"          # required for NCCL/RCCL when sharding across devices
    hfCacheDir: "~/.cache/huggingface"
    # Devices one worker is given. The nok8s counterpart of a Kubernetes role's
    # `parallelism.tensor`: the container runtime pins devices before the engine
    # process exists, so the count is stated here rather than read out of the
    # command -- it has to agree with the width the command gives the engine
    # (e.g. `--tensor-parallel-size 2` -> 2).
    acceleratorCount: 1
    # Number of independent workers (EPP load-balances across them). With
    # replicas > 1 each worker is pinned to its own contiguous slice of the
    # host's devices (replica i -> devices i*acceleratorCount ..
    # i*acceleratorCount+acceleratorCount-1) via the accelerator's
    # visible-devices env. Total devices needed = replicas * acceleratorCount.
    replicas: 1

  # Endpoint Picker (router brain), file-discovery mode
  epp:
    image: ghcr.io/llm-d/llm-d-router-endpoint-picker
    tag: v0.11.0
    grpcPort: 9002
    grpcHealthPort: 9003
    metricsPort: 9090
    poolName: file-discovery
    poolNamespace: default
    configMountDir: /etc/epp

  # Envoy front door
  envoy:
    image: docker.io/envoyproxy/envoy
    tag: distroless-v1.33.2
    listenPort: 8081
    # Envoy admin interface. Envoy runs with --network host, so two stacks on
    # one host need distinct admin ports as well as distinct listenPorts.
    adminPort: 19000
    configMountPath: /etc/envoy/envoy.yaml
    # Envoy's hot-restart base ID (--base-id), which names the shared-memory
    # region and abstract domain socket it claims. Under --network host that
    # claim is host-wide, so the Envoy default of 0 lets any second Envoy on
    # the node -- a sibling stack, or one left running by an earlier standup --
    # exit with errno=98 before it binds listenPort, which looks only like a
    # readiness timeout. Left at 0 here and resolved per stack from
    # listenPort (already unique per host); set it to pin a specific value.
    baseId: 0

# ============================================================================
# KUSTOMIZE DEPLOYMENT CONFIGURATION
# Opt-in via `kustomize.enabled: true` in a scenario or `-t kustomize` on
# the CLI. Defined here (matching modelservice/standalone/fma) so the
# structural key is always present in merged values and template guards
# can use `kustomize.enabled` directly.
# ============================================================================
kustomize:
  enabled: false

# ============================================================================
# FMA DEPLOYMENT CONFIGURATION
# For Fast Model Actuation
# ============================================================================
fma:
  enabled: false
  iterations: 1

  # Pin FMA launchers + requester to a single GPU node. When enabled, standup
  # (step_06) picks a GPU node with free GPUs and CPU (preferring a dedicated
  # one), labels it <nodeLabel>=true, and sizes launchers/requesters to its free
  # GPUs. Standup fails if no node qualifies. Off by default; opt in per-scenario.
  launcherNodeSelection:
    enabled: false
    nodeLabel: fma-hotstart

  # Deployment naming
  deployment:
    name: null  # Auto-generated if null: standalone-<model.shortName>

  # Labels applied to deployment and service
  labels:
    stood-up-by: "auto" # Should be automatically configured to user
    stood-up-from: llm-d-benchmark
    stood-up-via: "fma"

  chart:
    version: 0.6.5

  image:
    repository: ghcr.io/llm-d-incubation/llm-d-fast-model-actuation

  requester:
    image:
      repository: ghcr.io/llm-d-incubation/llm-d-fast-model-actuation/requester
      tag: v0.6.5
      pullPolicy: IfNotPresent
    probePort: 8080
    spiPort: 8081
    limitsGPU: 1
    limitsCPU: 1
    limitsMemory: 250Mi

  launcher:
    maxInstances: 4
    # The FMA launcher process IS the vLLM entrypoint -- it owns sleep mode --
    # so this path has no `vllm serve` line: the LauncherConfig CRD takes a flag
    # string. `options` is that string, verbatim, exactly as `engine.command` is
    # verbatim elsewhere. Nothing assembles it flag by flag, so nothing here has
    # to be taught a new vLLM flag.
    #
    # Numbers an FMA arm must share with the arm it is compared against go in as
    # references, and then they cannot desync:
    #
    #   options: >-
    #     --model ${model.name}
    #     --enable-sleep-mode
    #     --max-model-len ${model.maxModelLen}
    #     --gpu-memory-utilization ${model.gpuMemoryUtilization}
    #     --block-size ${model.blockSize}
    #
    # `--model` is the repo ID, and it loads the weights the download job already
    # staged: the launcher pod gets HF_HUB_CACHE pointed at that staged hub cache,
    # so the ID resolves locally rather than re-resolving over the network and
    # filling the PVC with a second copy at weight load (#1822).
    #
    # It has to stay an ID rather than a path regardless: it feeds the derived
    # Helm release name, which a path mangles into an invalid (leading-dash) name.
    #
    # This is also the one path with no command for `model.maxModelLen`,
    # `model.blockSize` and `model.gpuMemoryUtilization` to be read off, so a
    # scenario using them states them in its own `model:` block.
    options: "--model ${model.name} --enable-sleep-mode"
    # Tensor-parallel width, stated because it is a pod-spec fact and not only a
    # flag: TP workers exchange over a shared-memory message queue, so > 1
    # provisions a 16Gi in-memory /dev/shm on the launcher (the pod default 64Mi
    # crashes NCCL at init). Write the same width in `options`, and pair it with
    # fma.requester.limitsGPU so the requester reserves matching GPUs. Default 1
    # leaves single-GPU runs unchanged (#1853).
    tensorParallelSize: 1
    image:
      repository: ghcr.io/llm-d-incubation/llm-d-fast-model-actuation/launcher
      tag: v0.6.5
      pullPolicy: IfNotPresent
    runtimeClassName: nvidia-legacy
    podTemplate:
      metadata:
        labels:
          stood-up-by: "auto"
          stood-up-from: llm-d-benchmark
          stood-up-via: "fma"
        annotations: {}
    customPreprocessCommands: []

  dualPod:
    sleeperLimit: 2
    debugAcceleratorMemory: false

  launcherConfigurator:
    port: 8001

  launcherPopulatorConfigurator:
    limitsCPU: 2
    limitsMemory: 2Gi
    requestsCPU: 100m
    requestsMemory: 128Mi

  mountModelVolume: true
  modelMountPath: /model-cache
  modelPvcName: model-pvc

# ============================================================================
# DOWNLOAD JOB CONFIGURATION
# ============================================================================
downloadJob:
  # Job name. Multi-stack scenarios auto-suffix this with the model ID
  # label (render_plans._resolve_per_stack_identity) so each stack gets
  # its own download-{model_id_label} Job and the waits don't cross-talk.
  # Set explicitly here to opt out of the auto-suffix.
  name: download-model
  backoffLimit: 3
  mountPath: /cache
  # `hf download`'s default of 8 workers all lock the same local-dir
  # metadata directory (.cache/huggingface/*.lock); on a shared/network PVC
  # (e.g. GKE Premium Filestore RWX) they serialize on that lock instead of
  # actually parallelizing, which looks like a hung download. Keep this low;
  # raise it per-scenario only for fast local/non-shared storage.
  maxWorkers: 1

# ============================================================================
# DATA ACCESS CONFIGURATION
# ============================================================================
dataAccess:
  rsyncPort: *rsync_port
  runAsUser: ~
  # Compression runs here, not in the harness pod. `zstd -T0` reads the *host* core
  # count, ignoring any cgroup quota, and its worker buffers scale with it -- GBs of
  # RSS on a large benchmark node. The cpu *limit* sets the quota the script reads to
  # pick a thread count; requests stay small so the pod still schedules on a
  # single-node Kind cluster that is also running a model server.
  resources:
    limitsCpu: 4
    limitsMemory: 8Gi
    requestsCpu: 100m
    requestsMemory: 128Mi
  nodeSelector: {}
  tolerations: []

# ============================================================================
# LABELS
# ============================================================================
labels:
  inferenceServing: *inference_serving_label
  app: *app_label

# ============================================================================
# MULTINODE CONFIGURATION (LeaderWorkerSet)
# ============================================================================
multinode:
  enabled: false
  # When enabled, workers will be scaled by parallelism.workers

# ============================================================================
# EXTRA OBJECTS - Additional K8s resources to deploy
# ============================================================================
extraObjects: []
# Example:
# extraObjects:
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata:
#       name: example-config
#     data:
#       key: value

# ============================================================================
# WVA (Workload Variant Autoscaler)
#
# Installed in *namespaced* mode: the controller watches only the namespace
# it is deployed in. One controller per unique wva.namespace across rendered
# stacks. A KEDA ScaledObject is rendered per-stack (28_wva-scaledobject.yaml.j2)
# so a single controller can manage multiple models in the same namespace.
# ============================================================================
wva:
  enabled: false
  wellLitPath: optimized-baseline
  # When blank, resolves to namespace.name at render time. Overridable via
  # the third component of `--namespace deploy,harness,wva`.
  namespace: ""
  image:
    repository: ghcr.io/llm-d/llm-d-workload-variant-autoscaler
    tag: auto
  replicaCount: 1
  # Chart-level top-level switch (v0.6.0): enables the controller Deployment.
  controller:
    enabled: true
  # When true, the controller only watches the namespace it runs in.
  namespaceScoped: true
  metrics:
    enabled: true
    port: 8443
    secure: true
  prometheus:
    baseUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local
    port: 9091
  # Only variantCost is consumed by rendering (llm-d.ai/variant-cost annotation
  # on the KEDA ScaledObject). The controller's SLO / saturation tuning comes
  # from the upstream overlay's ConfigMaps, not from per-model fields here --
  # no VariantAutoscaling CR is rendered.
  variantAutoscaling:
    variantCost: "10.0"
  # Drives the per-stack KEDA ScaledObject (min/maxReplicaCount, trigger
  # threshold, HPA behavior). Named "hpa" for parity with the upstream guide.
  hpa:
    # Gates the smoketest's autoscaling-aware replica-range check. Does not
    # affect rendering -- the ScaledObject is gated on wva.enabled.
    enabled: true
    minReplicas: 1
    maxReplicas: 16
    targetAvgValue: 1
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 120
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
      scaleDown:
        stabilizationWindowSeconds: 120
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
  engineService:
    enabled: true
    interval: 15s
    scheme: http

# ============================================================================
# GENERIC KEDA SCALEDOBJECTS
# ============================================================================
# Platform-agnostic KEDA autoscaling. Renders one ScaledObject per entry in
# keda.scaledObjects. Works on any Kubernetes cluster (not gated on OpenShift).
# KEDA must already be installed. The TriggerAuthentication name used by this
# path is "keda-prometheus-auth" -- distinct from "prometheus-auth" used by
# eppKedaSaturation below, so both paths can coexist in the same namespace.
keda:
  prometheus:
    baseUrl: http://prometheus      # host only -- port is appended separately
    port: 9090
    authMode: none                  # "none" | "bearer-secret"
    secretName: ""                  # pre-existing Secret in deploy namespace (bearer-secret only)
    unsafeSsl: false
  scaledObjects: []                 # list of ScaledObject definitions; see config/README.md

# ============================================================================
# EPP+KEDA SATURATION AUTOSCALING
# ============================================================================
# Direct KEDA autoscaling using EPP flow-control metrics, without WVA controller.
# Queries llm_d_epp_flow_control_pool_saturation and llm_d_epp_request_running
# directly (see scaledObject.triggers below).
eppKedaSaturation:
  enabled: false
  namespace: ""                 # defaults to namespace.name at render time
  prometheus:
    baseUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local
    port: 9091
  epp:
    poolName: ""                # InferencePool name; defaults to model_id_label
    metricsPortName: http-metrics
    metricsPort: 9090
    prometheusServiceAccount: thanos-querier
    prometheusServiceAccountNamespace: openshift-monitoring
  scaledObject:
    minReplicas: 1
    maxReplicas: 10
    pollingInterval: 15
    unsafeSsl: true
    # KEDA Prometheus triggers, fully defined here so new metrics/thresholds
    # can be added without touching the Jinja. These mirror the upstream llm-d
    # workload-autoscaling keda-epp-saturation guide; a scenario may redefine
    # this entire list (e.g. the keda-epp-queue guide). Per entry: query
    # (required), threshold, and optional name/metricType/activationThreshold.
    # In `query`, ${poolName} and ${modelName} are substituted at render time.
    triggers:
      - name: pool-saturation
        query: 'max(llm_d_epp_flow_control_pool_saturation{inference_pool="${poolName}"})'
        threshold: "0.7"
        activationThreshold: "0"
      - name: running-requests
        query: 'sum(llm_d_epp_request_running{model_name="${modelName}"})'
        threshold: "16"
        activationThreshold: "0"
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Pods
            value: 1
            periodSeconds: 180  # adjust to actual pod startup time
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300

# ============================================================================
# PRISM DASHBOARD
#
# Persistent in-cluster dashboard. Survives teardown; removed only by `-d`.
# ============================================================================
prism:
  enabled: true
  name: llm-d-prism
  serviceName: llm-d-prism
  image:
    repository: ghcr.io/llm-d/llm-d-prism
    tag: *llm-d-prism_version
    pullPolicy: *pull_always
  replicas: 1
  port: 8080
  route:
    enabled: true               # OpenShift route
  env:
    PRISM_LOCAL_DIR: /requests  # plots benchmark reports from workload-pvc
    DEFAULT_BUCKETS: ","         # show local dir only: no GCS/GIQ cloud sources
  resources: {}

# ============================================================================
# GATEWAY PROVIDERS
# ============================================================================
gatewayProviders:
  agentgateway:
    # Chart version managed in chartVersions.agentgateway
    namespace: agentgateway-system
    helmRepository: oci://cr.agentgateway.dev/charts/

# ============================================================================
# LWS (LeaderWorkerSet)
# ============================================================================
lws:
  # Chart version managed in chartVersions.lws
  namespace: lws-system
  helmRepository: oci://registry.k8s.io/lws/charts/

# ============================================================================
# GATEWAY API CRD VERSIONS
# ============================================================================
gatewayApiCrd:
  revision: v1.5.1
  inferenceExtensionRevision: *gaie_version
  # Install URLs for the CRD bundles. ``{revision}`` is substituted with
  # ``revision`` / ``inferenceExtensionRevision`` above at standup time.
  # Kept here so the URL has a single source of truth (read by
  # llmdbenchmark/standup/steps/step_02_admin_prerequisites.py).
  crdUrlTemplate: "github.com/kubernetes-sigs/gateway-api/config/crd?ref={revision}"
  inferenceExtensionUrlTemplate: "https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/download/{revision}/manifests.yaml"

# ============================================================================
# HARNESS CONFIGURATION
# ============================================================================
harness:
  name: inference-perf
  profile: sanity_random.yaml
  executable: llm-d-benchmark.sh
  condaEnvName: inference-perf-env
  waitTimeout: 3600
  loadParallelism: 1
  podLabel: llmdbench-harness-launcher
  debug: false
  resources:
    cpu: 16
    memory: 32Gi
    memoryLimit: 128Gi
  nodeSelector: {}
  tolerations: []
  output: local
  inferencePerf:
    rayonNumThreads: 4

# ============================================================================
# EXPERIMENT RUNTIME DEFAULTS
# ============================================================================
experiment:
  resultsDir: /requests
  workspaceDir: /workspace
  datasetUrl: ""
  datasetDir: ""

# ============================================================================
# RUN DESCRIPTION (submitter-provided; surfaces as run.description/keywords)
# ============================================================================
description:
  text: ""
  keywords: []

# ============================================================================
# CONTROL TIMEOUTS
# ============================================================================
control:
  waitTimeout: 900
  ignoreFailedValidation: true    # When true, capacity planner failures are warnings (deployment continues). Matches bash default.
  # Name of the K8s Secret that holds the kubeconfig for in-cluster pods.
  # Matches bash LLMDBENCH_VLLM_COMMON_CONTEXT_SECRET_NAME default.
  contextSecretName: llmdbench-context

# ============================================================================
# RELEASE CONFIGURATION
# ============================================================================
release: llmdbench

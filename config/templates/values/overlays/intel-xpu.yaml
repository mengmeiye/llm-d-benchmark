# Shared Intel XPU machine profile. DRA clusters select it directly from the
# stable ``gpu.intel.com`` driver/device class. Classic device-plugin clusters
# continue to select it through their ``intel-i915`` or ``intel-xe`` profiles.

accelerator:
  # Avoid duplicating VLLM_WORKER_MULTIPROC_METHOD: llm-d-benchmark already
  # injects it into the serving container.
  env:
    intel-i915: []
    intel-xe: []
  # This profile carries no command fragments. XPU needs a materially different
  # command (--enforce-eager, no --block-size at all, lower memory utilization,
  # host-memory KV staging), and a substitution point per difference made every
  # guide command unreadable for the 95% of readers on CUDA. The XPU command
  # lives, spelled out, in config/scenarios/examples/intel-xpu.yaml.

images:
  vllm:
    repository: ghcr.io/llm-d/llm-d-xpu
    tag: v0.7.0
    pullPolicy: IfNotPresent
    sourceRepo: https://github.com/llm-d/llm-d

# An accelerator profile does not choose a model, for the same reason it no
# longer carries command fragments: the launch command names the model, so a
# model named here would either be ignored (the usual case) or quietly disagree
# with the command the engine is handed. A scenario meant for this hardware
# names a fitting model in its own command --
# config/scenarios/examples/intel-xpu.yaml serves Qwen/Qwen3-0.6B, which is what
# a single B60 holds. What stays here is what the machine decides.
model:
  # Sized for that scenario's model. A larger one needs a larger modelPvc, which
  # is a scenario-level `storage.modelPvc.size`.
  size: 50Gi
  # Context length and memory fraction are deliberately absent: an engine
  # command always states both, and the capacity planner reads them back from
  # it. Stating them here as well would let the planner do its KV-cache
  # arithmetic against numbers the engine never received.
  #
  # `blockSize` is the exception the planner cannot cover. The XPU FMHA kernel
  # picks its own page size, so an XPU command carries no `--block-size` at all
  # (config/scenarios/examples/intel-xpu.yaml) and there is nothing to read
  # back -- but the precise prefix-cache router's token processor must be told
  # one, and it must be the one the kernel uses.
  blockSize: 16

decode:
  parallelism:
    tensor: 1
  resources:
    limits:
      memory: 24Gi
      cpu: "8"
    requests:
      memory: 12Gi
      cpu: "4"
  extraContainerConfig:
    securityContext:
      capabilities:
        add: []
prefill:
  resources:
    limits:
      memory: 24Gi
      cpu: "8"
    requests:
      memory: 12Gi
      cpu: "4"
  extraContainerConfig:
    securityContext:
      capabilities:
        add: []

# Intel XPU NIXL transport uses host memory/TCP rather than CUDA IPC or GDR,
# which means UCX_TLS=tcp. That is not set here: it is a container environment
# variable (the preprocess reads it from the environment, see
# set_llmdbench_environment.py), and its home is the role's `extraEnvVars`.
# An accelerator profile cannot contribute one entry to that list -- lists are
# replaced, not merged, so an override here would drop whatever env vars the
# guide itself set. A P/D guide meant to run on XPU states it per role:
#
#   decode:
#     extraEnvVars:
#       - name: UCX_TLS
#         value: tcp

# The compact single-node XPU validation environment has 20 CPUs. The precise
# prefix-cache guide otherwise requests 8 CPUs per EPP replica before model
# servers are scheduled. The XPU profile uses a public model, so it also must
# not require an optional Hugging Face token Secret.
router:
  epp:
    env: []
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        memory: 2Gi
  proxy:
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        memory: 2Gi

# Preserve the storage and harness sizing from the previously working XPU
# guide. These values allow the supported single-node Kind/B60 path to bind
# local-path PVCs and leave enough node capacity for the serving stack.
storage:
  modelPvc:
    size: 50Gi
    accessModes:
      - ReadWriteOnce
  workloadPvc:
    accessModes:
      - ReadWriteOnce

harness:
  resources:
    cpu: 2
    memory: 8Gi
    memoryLimit: 64Gi
